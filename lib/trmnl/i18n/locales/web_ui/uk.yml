        guide_link: Переглянути інструкцію з режиму прошивання
        port_unavailable: Не вдалося відкрити послідовний порт. Кабель USB-C може підтримувати лише заряджання, або пристрій не перебуває в режимі прошивання.
        reset_refused: Пристрій не перейшов у режим прошивання, тому скидання не вдалося. Повторіть крок 3 і спробуйте знову.
      meta_title_custom: Flash Custom Firmware
      meta_title: Flash Firmware
      title: Flash Assistant
      subtitle: Update your device firmware in 1 click, no coding required.
      powered_by_html: Powered by %{link}.
      step_1: Step 1 - Select your device
      loading: Loading, please wait...
      select_file_html: Select the firmware <code>.bin</code> file to flash.
      version_prompt_html: And the %{link} you want to install
      firmware_version: firmware version
      please_select: Please select...
      step_2: Step 2 - Plug in your device
      plug_in: Use a USB-C cable to plug your device into your computer. The TRMNL branded cable works great if you have one.
      step_3: Step 3 - Enter 'Flashing mode'
      select_model_first: Select a device model above for instructions.
      og_flash_off: Turn off the device by flipping the power switch to 'OFF'
      og_flash_hold: While pressing down on the circular button, flip the power switch to 'ON'
      og_flash_release: Let go of the circular button
      here: here
      x_flash_html: See the Model X > "Flashing / Boot Mode" instructions %{link}.
      diy_kit_flash: Press and hold Key 3 for about 5 seconds.
      xiao_flash: Press the Reset button, release it, then press and hold the Boot button for 5 seconds.
      e100x_flash: Press and hold both navigation buttons (left and right) simultaneously for 2 seconds.
      e1003_flash_html: See instructions in the Seeed Studio help center %{link}.
      x4_wake: If you're running X4 default firmware or Crosspoint, wake up the device.
      x4_reset: If you're already running TRMNL firmware, hold the X4 reset button for 3 seconds.
      x4_note_html: '<strong>Note</strong>: The X4 only remains in a "flashing mode" state for a couple seconds. Follow the prompts in Step 4 immediately after holding the reset button or you''ll need to retry.'
      step_4: Step 4 - Flash firmware
      click_connect: Click the 'Connect' button below
      select_serial: Select 'USB JTAG/serial...' from the list
      select_install: Select 'Install' from the popup menu
      wait_install: Wait for the device to install the firmware (this may take a minute or two)
      confirmation: You should see a confirmation message within the popup menu
      step_5: Step 5 - Restart your device
      og_restart_off: Turn the device off by flipping the power switch to 'OFF'
      og_restart_wait: Wait approximately 15 seconds
      og_restart_on: Flip the power switch to 'ON'
      x_restart_html: Your X may begin working without any interaction. If it doesn't, see the Model X > "Soft Reset" instructions %{link}.
      troubleshooting: Troubleshooting
      open_error: 'If you get an error "Failed to execute ''open'' on ''SerialPort'' during Step 4:'
      charge_only_cable: your USB-C cable might only be capable of charging (not data transfer)
      not_flashing_mode: your device may not yet be in "flashing mode."
      repeat_step_html: Repeat Step 3 or see %{link} for additional options.
      this_guide: this guide
      init_failure_html: If you get the message "Failed to initialize. Try resetting your device or holding the BOOT button while clicking INSTALL", your device is not in flashing mode. Repeat Step 3 or see %{link} for additional options.
      og_description: Update your device firmware in 1 click.
      x_first_start: Leave the USB-C cable in. On its first start the X can spend about 75 seconds on "Flashing modem firmware...". When the screen shows "Device is ready to ship!", unplug the cable, then plug it in again to set up Wi-Fi.
      x_still_in_flashing_mode: If the screen does not change within 2 minutes, the X is still in flashing mode. Keep the cable in and click the button below.
      x_restart_button: Restart my X
      x_restart_sent: Restart sent. The screen changes within a few seconds.
