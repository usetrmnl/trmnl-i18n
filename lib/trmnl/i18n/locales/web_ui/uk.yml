      linux_warning: Прошивання з Linux часто не вдається, оскільки Chrome не може відкрити послідовний порт. Додайте користувача до групи dialout (sudo usermod -aG dialout $USER), вийдіть із сеансу та увійдіть знову, а потім повторіть спробу. Якщо це не допоможе, скористайтеся Chrome або Edge на Mac чи ПК з Windows.
