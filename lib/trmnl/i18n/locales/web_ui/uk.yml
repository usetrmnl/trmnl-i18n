  integration_overviews:
    alias: |-
      Власне зображення на дисплеї TRMNL ePaper. Alias призначено для тих, хто вже створює екрани деінде, наприклад скриптом на домашньому сервері. Вставте повну URL-адресу зображення, і пристрій завантажить його безпосередньо звідти. Локальна адреса на кшталт http://localhost:4567/image.png теж працює.

      Зображення має бути підготовлене для ePaper: 1-бітний BMP або 1- чи 2-бітний PNG із точними розмірами екрана пристрою. Ми не конвертуємо його за вас — для цього є Image Display. Постійно перезаписуєте той самий файл? Вимкніть кешування, і пристрій перемальовуватиме його щоразу, навіть якщо назва файлу не змінилася.
    apple_calendar: |-
      Ваш Apple Calendar на дисплеї TRMNL ePaper. Є 3 способи підключення: вставити посилання на календар, відкритий для загального доступу в iCloud; синхронізувати з iPhone або iPad через застосунок TRMNL Companion; або увійти з Apple ID та паролем для застосунку й вибрати календарі iCloud для показу.

      Потім виберіть макет: план на сьогодні, найближчі дні, тиждень чи робочий тиждень, місячна сітка або мінімалістичний розклад. Показуйте час і описи подій, використовуйте 12- або 24-годинний формат, приховуйте події з певними словами та починайте тиждень із будь-якого дня. Лінія поточного часу та виділення сьогоднішнього дня допомагають орієнтуватися в розкладі.
    apple_photos: |-
      Фотографії зі спільного альбому Apple Photos на дисплеї TRMNL ePaper. У застосунку «Фотографії» увімкніть «Загальнодоступний вебсайт» для спільного альбому та вставте посилання на нього в плагін. Під час кожного оновлення вибирається випадкове фото.

      Виберіть Cover, щоб заповнити весь екран (краї можуть обрізатися), або Contain, щоб показати фото повністю з полями навколо. Фото, додані до альбому пізніше, теж потраплять у чергування. TRMNL читає лише цей спільний альбом і нічого іншого у вашій медіатеці.
    asana: |-
      Ваші завдання Asana на дисплеї TRMNL ePaper. Підключіть акаунт Asana, виберіть робочий простір і розділи My Tasks для показу, наприклад «Do today» або «Do later». На повному екрані вміщуються 3 розділи поруч, на менших макетах — 2.

      Кожне завдання показує назву й термін виконання. Сортуйте за терміном, алфавітом або порядком Asana та показуйте терміни як «Сьогодні», «Завтра», назви днів тижня або короткі дати. Можна також показувати проєкт кожного завдання й включати завершені завдання. Подання проєктів, спільні командні списки та підзавдання не підтримуються — лише My Tasks.
    basecamp: |-
      Ваші справи Basecamp на дисплеї TRMNL ePaper. Підключіть акаунт Basecamp, виберіть обліковий запис і проєкт — екран збере справи зі списків цього проєкту в одному місці.

      Справи впорядковано за терміном, від найближчих, тож наступне завдання буде вгорі. Хочете стежити за кількома проєктами? Додайте окремий екземпляр плагіна для кожного проєкту й розмістіть їх поруч на одному екрані за допомогою комбінації.
    beehiiv: |-
      Статистика останньої розсилки beehiiv на дисплеї TRMNL ePaper. Ви бачите тему листа, кількість одержувачів, відкриття та їхній відсоток, кліки та їхній відсоток, а також відписки й скарги на спам.

      Налаштування займає хвилину й не потребує коду. У beehiiv відкрийте Settings → Integrations → API, створіть ключ API та скопіюйте ID публікації. Вставте обидва значення в плагін і збережіть. Ведете кілька розсилок? Додайте окремий екземпляр плагіна для кожної публікації.
    bible_verses: |-
      Випадковий біблійний вірш на дисплеї TRMNL ePaper — новий із кожним оновленням екрана. Вірш розташований посередині під заголовком «Daily Scripture», а нижче вказано книгу, розділ і номер вірша.

      Виберіть переклад: American Standard, King James або World English Bible. Це єдине налаштування. Додайте плагін до списку відтворення, і він з’являтиметься між календарем та погодою.
    bitcoin_wallet_balance: |-
      Баланс Bitcoin-гаманця на дисплеї TRMNL ePaper. Вставте публічну адресу гаманця, і екран покаже його баланс у BTC та доларах США, а також свічковий графік ціни Bitcoin за останні 90 днів.

      Також показується зміна ціни за 7 і 90 днів, щоб одразу оцінити результати тижня. TRMNL потрібна лише публічна адреса — ваші ключі ніколи не потрібні. Маєте кілька гаманців? Додайте окремий екземпляр плагіна для кожної адреси.
    caldav: |-
      Події майже з будь-якого календарного сервісу на дисплеї TRMNL ePaper. Вставте одне чи кілька опублікованих посилань на календарі .ics і додайте HTTP-заголовки, якщо сервер вимагає їх для доступу. Зручніше з телефона? Синхронізуйте календарі з iPhone або iPad через TRMNL Companion.

      Виберіть макет: план на сьогодні, найближчі дні, тиждень чи робочий тиждень, місячна сітка або мінімалістичний розклад. Показуйте час і описи подій, використовуйте 12- або 24-годинний формат, приховуйте події з певними словами й застосовуйте кольори календарів до блоків подій. Тижневий і місячний вигляди можуть затіняти вихідні, виділяти сьогоднішній день, показувати номери тижнів і лінію поточного часу.
    changelog: |-
      Новини команди TRMNL на вашому дисплеї TRMNL ePaper. Екран показує останні оголошення, починаючи з найновіших, із датою та заголовком кожного. У повноекранному вигляді під ними додається короткий опис.

      Налаштовувати нічого не потрібно. Додайте плагін до списку відтворення й дізнавайтеся про нові плагіни та функції безпосередньо з пристрою, не перевіряючи пошту або соцмережі.
    chatgpt: |-
      Відповіді ChatGPT на дисплеї TRMNL ePaper. Напишіть запит один раз — він повторюватиметься під час кожного оновлення, даючи нову відповідь. Наприклад, цікавий факт, слово дня або щоденну ідею для тексту.

      Створіть ключ API в акаунті OpenAI та вставте його разом із запитом. Виберіть модель і ввімкніть вебпошук для відповідей, що потребують актуальної інформації; джерела буде наведено внизу. Плагін працює з вашим ключем API, тому використання зараховується до акаунта OpenAI. Якщо буде досягнуто лімітів запитів OpenAI, екран покаже відповідну помилку.
    clicky: |-
      Аналітика вашого сайту з Clicky на дисплеї TRMNL ePaper. Екран показує перегляди сторінок, відвідувачів і середній час на сторінці, а нижче — графік переглядів за днями.

      Введіть ID та ключ сайту з Clicky, потім виберіть період: 1, 7, 14 або 30 днів. Маєте кілька сайтів? Додайте окремий екземпляр плагіна для кожного та об’єднайте їх на екрані в комбінацію.
    clock: |-
      Годинник для дисплея TRMNL ePaper. Виберіть аналоговий циферблат зі стрілками або цифровий із семисегментними цифрами, як у класичного РК-годинника, і задайте часовий пояс. Він може займати весь екран, половину або чверть.

      Цифровий циферблат показує час у 24-годинному форматі. Маєте колег чи родину в інших містах? Додайте по годиннику для кожного часового поясу. Потім розмістіть їх у комбінації поруч із календарем або погодою, щоб бачити час там, куди вже дивитеся.
    close: |-
      Ваша воронка Close CRM на дисплеї TRMNL ePaper. Підключіть акаунт Close і виберіть до 3 статусів для відстеження, наприклад «Active» або «Won». Кожен статус отримає окрему колонку угод.

      Кожна угода показує ім’я потенційного клієнта, суму та відповідального у вашій команді. Виберіть період: угоди, оновлені за останні 7, 14 або 30 днів. Повісьте дисплей біля відділу продажів, і всі бачитимуть стан угод.
    coinmarketcap: |-
      Актуальні ціни криптовалют із CoinMarketCap на дисплеї TRMNL ePaper. Для кожної монети показуються символ, назва, поточна ціна та зміна за останні 24 години.

      Додайте ключ API CoinMarketCap і введіть символи монет для відстеження, наприклад BTC або ETH. Показуйте одну монету великим шрифтом або до 12 у сітці. Типово ціни наведено в доларах США; можна вибрати іншу валюту, наприклад EUR, GBP, JPY або ZAR, із перерахунком за курсом давністю не більше доби.
    convertkit_analytics: |-
      Показники вашої розсилки ConvertKit на дисплеї TRMNL ePaper. З одного боку — дані акаунта: кількість підписників і проданих товарів. З іншого — результати розсилки: одержувачі, відсотки відкриттів і кліків, кліки, відписки та статус.

      Вставте ключ і секрет API ConvertKit, а потім виберіть період: 7, 30 або 90 днів.
    custom_text: |-
      Ваші слова на дисплеї TRMNL ePaper. Цитата, мета чи нагадування пити воду. Введіть одну фразу або кілька, розділених крапкою з комою, — під час кожного оновлення вибиратиметься випадкова.

      Підтримується Markdown: можна додати жирний текст, курсив або список, чи вимкнути його й показувати текст саме так, як введено. Автоматичне масштабування шрифту підлаштовує текст під доступне місце, що зручно для довших уривків; також можна залишити фіксований розмір. Вирівняйте текст ліворуч, по центру або праворуч і додайте власний рядок до нижнього заголовка.
    days_left_retirement: |-
      Скільки залишилося до пенсії — на дисплеї TRMNL ePaper. Введіть дату народження та вік, у якому плануєте вийти на пенсію. Екран покаже пройдений шлях у відсотках, кількість тижнів до пенсії та смугу прогресу, що заповнюється з роками.

      Відлік у тижнях робить час відчутним — у цьому й задум. Додайте до списку відтворення як м’яке нагадування присвячувати наявні тижні тому, що важливо.
    days_left_until: |-
      Відлік до будь-якої дати на дисплеї TRMNL ePaper: запуску, подорожі, дедлайну чи весілля. Задайте початкову й кінцеву дати — екран покаже, скільки днів минуло й залишилося, та смугу прогресу.

      Цікавить лише одне число? Приховайте дні, що минули, або дні, що залишилися. Відлічуєте час до кількох подій? Додайте окремий екземпляр плагіна для кожної дати.
    days_left_year: |-
      Увесь рік одним поглядом на дисплеї TRMNL ePaper. Кожен день — маленький квадрат, розташований за тижнями. Минулі дні затінено, сьогоднішній — суцільний чорний, решта ще попереду. Над сіткою два числа: скільки днів минуло й залишилося.

      Налаштовувати нічого не потрібно: додайте й збережіть. Плагін використовує дату в часовому поясі акаунта та починає відлік заново 1 січня.
    days_since: |-
      Відлік днів від важливої для вас події на дисплеї TRMNL ePaper. Відмова від звички, початок бізнесу чи останній випадок, коли хтось зламав збірку. Екран показує початкову дату та кількість днів, що минули.

      Виберіть дату й формат запису — від «November 26, 2024» до 2024-11-26 або 11/26/2024. Відстежуєте кілька подій? Додайте окремий екземпляр плагіна для кожної дати й об’єднайте їх на одному екрані в комбінацію.
    dropbox_photo_album: |-
      Перетворіть дисплей TRMNL ePaper на цифрову фоторамку з фотографіями з Dropbox. Підключіть акаунт Dropbox, і ми створимо папку застосунку TRMNL у вашій папці Apps. Додавайте туди фото — під час кожного оновлення показуватиметься випадкове, підігнане під екран.

      TRMNL може читати файли й надавати доступ лише в цій папці, а не в решті Dropbox. Плануєте вертикальне розташування? Завантажуйте вертикальні фото; для горизонтального екрана підійдуть горизонтальні. Додавайте й видаляйте фото будь-коли — чергування змінюватиметься відповідно.
    eight_sleep: |-
      Ваші дані Eight Sleep на дисплеї TRMNL ePaper. Прокиньтеся й одним поглядом оцініть тиждень: показник сну за кожен з останніх 7 днів і тижнева оцінка з простою шкалою від низької до доброї.

      Поруч — тижневі середні показники якості сну, хропіння, глибокого та швидкого сну, часу засинання й загальної тривалості сну. Для налаштування потрібні лише пошта й пароль, які ви використовуєте в Eight Sleep. Офіційного API Eight Sleep немає, тому ми входимо так само, як застосунок, і читаємо ті самі показники. Цей плагін займає весь екран і не підтримує комбінації.
    email_meter: |-
      Аналітика вашої пошти Gmail від Email Meter на дисплеї TRMNL ePaper. Дізнайтеся, скільки повідомлень і скільком одержувачам ви надіслали, скільки отримали та від скількох відправників, а також середній час відповіді.

      Виберіть період: останні 1, 7 або 30 днів. У налаштуванні є невелика хитрість: увійдіть до Email Meter, відкрийте консоль браузера й скопіюйте токен сеансу за допомогою рядка з форми налаштувань — програмувати не потрібно. Email Meter припиняє дію токена після завершення сеансу. Якщо екран повідомляє про відхилення токена, отримайте й вставте новий.
    enphase: |-
      Ваша сонячна система Enphase на дисплеї TRMNL ePaper. Підключіть акаунт Enphase, виберіть систему — екран покаже сьогоднішню криву виробництва, великий головний показник і час останнього звіту системи.

      Головний показник обираєте ви: вироблено, спожито, імпортовано або експортовано сьогодні; чистий імпорт чи експорт; пікова потужність; поточне виробництво; частка покриття сонячною енергією; залежність від мережі; загальне виробництво або батарея. Потім виберіть додаткові показники поруч. Менші макети показують перші з тих, що вміщуються. Немає лічильника споживання? Показники, які система не може надати, пропускаються, а не показуються нульовими.
    ethereum_wallet_balance: |-
      Баланс вашого Ethereum-гаманця на дисплеї TRMNL ePaper. Вставте публічну адресу — екран покаже вартість у доларах США, кількість ETH і зміну ціни ETH за останні 7 та 90 днів із 90-денним графіком.

      Потрібна лише публічна адреса. Жодних ключів, входу чи доступу, що дозволяє переміщувати кошти. Стежите за кількома гаманцями? Додайте окремий екземпляр плагіна для кожної адреси.
    etsy: |-
      Продажі вашого магазину Etsy на дисплеї TRMNL ePaper. Підключіть акаунт Etsy, виберіть магазин і переглядайте загальну суму продажів, середню вартість замовлення та кількість замовлень, що очікують виконання або вже виконані.

      Графік порівнює щоденні продажі з попереднім періодом, тож одразу видно, чи цей тиждень кращий за минулий. Виберіть останні 7, 30 або 90 днів чи період від початку місяця. Скасовані замовлення не враховуються, а неоплачені не входять до суми продажів.
    fastmail_calendar: |-
      Ваш календар Fastmail на дисплеї TRMNL ePaper. У Fastmail опублікуйте календар через Edit & Share — з усіма відомостями про події або лише статусом вільно/зайнято — та вставте посилання в плагін, замінивши «webcal» на «https». Календарів кілька? Додайте по одному посиланню в рядку. Зручніше з телефона? Синхронізуйте з iPhone чи iPad через TRMNL Companion.

      Виберіть макет: план на сьогодні, найближчі дні, тиждень чи робочий тиждень, місячна сітка або мінімалістичний розклад. Показуйте час і описи подій, використовуйте 12- або 24-годинний формат, приховуйте події з певними словами та показуйте кольори календарів. Тижневий і місячний вигляди можуть затіняти вихідні, виділяти сьогоднішній день і показувати номери тижнів.
    fera: |-
      Ваші відгуки Fera на дисплеї TRMNL ePaper. Угорі — середня оцінка, загальна кількість відгуків, частка підтверджених і кількість товарів із відгуками. Нижче — останні відгуки із зірками, заголовками й текстом.

      Підключіть акаунт Fera та виберіть відгуки для показу: схвалені (типово), ті, що очікують схвалення чи оновлення, відхилені або в очікуванні. TRMNL лише читає відгуки й не може нічого редагувати. Від’єднати його з боку Fera можна будь-коли.
    gaffa: |-
      Власна перша шпальта новин на дисплеї TRMNL ePaper, створена ШІ Gaffa. Укажіть адресу новинного сайту — Gaffa прочитає сторінку, вибере головні матеріали й напише короткий виклад кожного. Ви отримаєте нумерований список заголовків із одним-двома рядками контексту.

      Спрямовуйте виклад власним запитом, наприклад «зосередься на світових подіях і пропускай клікбейт», та змініть підпис рядка заголовка на свій. Безкоштовний пробний період Gaffa триває перші 6 місяців. Після цього вставте власний ключ API Gaffa, щоб продовжити.
    github_commit_graph: |-
      Ваш графік внесків GitHub на дисплеї TRMNL ePaper. Уведіть ім’я користувача GitHub без @ — екран намалює активність за минулий рік як сітку квадратів: темніші позначають дні з більшим внеском.

      Поруч — загальна кількість внесків за рік, найдовша й поточна серії активності, найактивніший день і середній показник за день. Нічого підключати не потрібно, токен не потрібен — лише ім’я користувача. Хочете також графік колеги? Додайте плагін ще раз із його ім’ям.
    github_commits: |-
      Останні коміти будь-якого репозиторію GitHub на дисплеї TRMNL ePaper. Кожен рядок показує повідомлення коміту, автора, дату, час і короткий хеш.

      Укажіть репозиторій у форматі org/repo або вставте його посилання GitHub. Залиште гілку порожньою для відстеження типової або вкажіть потрібну. Для відкритих репозиторіїв більше нічого не потрібно. Для приватного виберіть приватну видимість і додайте токен із детальними дозволами на читання вмісту репозиторію. Якщо GitHub дасть збій, на екрані залишиться останній успішно отриманий список.
    github_contributor_summary: |-
      Хто робить коміти до вашого репозиторію GitHub — на дисплеї TRMNL ePaper. Таблиця показує ім’я кожного учасника, його коміти за минулий тиждень і за весь час, тож одразу видно, хто активний.

      Уведіть репозиторій у форматі username/repository і додайте токен доступу з детальними дозволами з налаштувань GitHub. Достатньо дозволу на читання метаданих репозиторію. GitHub показує токен лише один раз, тому одразу скопіюйте його до TRMNL. Відстежуєте кілька репозиторіїв? Додайте окремий екземпляр плагіна для кожного.
    google_analytics: |-
      Ваші показники Google Analytics на дисплеї TRMNL ePaper. Перегляди сторінок, сеанси, відвідувачі й середня тривалість сеансу, а нижче — графік щоденних переглядів.

      Підключіть акаунт Google, введіть Property ID потрібного сайту й виберіть період: 7, 30 або 90 днів. Дані можуть закінчуватися сьогоднішнім або вчорашнім днем. Виберіть учора, щоб графік не падав наприкінці лише тому, що сьогоднішній день ще не завершився. Ведете кілька сайтів? Додайте окремий екземпляр плагіна для кожного ресурсу.
    google_calendar: |-
      Ваш Google Calendar на дисплеї TRMNL ePaper. Увійдіть через Google, виберіть потрібні календарі — готово. Маєте робочий і особистий акаунти? Підключіть кілька акаунтів Google і покажіть їхні календарі на одному екрані.

      Виберіть макет під свій спосіб планування: план на сьогодні, найближчі дні, тиждень чи робочий тиждень, місячна сітка або мінімалістичний розклад. Показуйте час і описи подій, використовуйте 12- або 24-годинний формат, приховуйте події з певними словами або показуйте лише прийняті запрошення. Можна додати лінію поточного часу, а в тижневому й місячному виглядах — затіняти вихідні, виділяти сьогоднішній день і показувати номери тижнів.
    google_drive_photos: |-
      Перетворіть папку Google Drive на фоторамку для дисплея TRMNL ePaper. Кожне оновлення вибирає випадкове зображення з папки: JPEG, PNG, GIF, BMP, WebP або TIFF.

      Входити в Google не потрібно. Надайте адресі TRMNL, указаній у налаштуваннях, доступ до папки з роллю Viewer і вставте посилання на неї. TRMNL бачить лише те, чим ви поділилися. У чергуванні беруть участь фото безпосередньо з папки, але не з підпапок. Виберіть Cover, щоб заповнити екран з можливим обрізанням країв, або Contain, щоб показати зображення повністю з полями навколо.
    google_photos: |-
      Фото з вашої медіатеки Google Photos на дисплеї TRMNL ePaper. Підключіть акаунт Google, а потім самостійно виберіть потрібні фото у вбудованому засобі вибору Google. Кожне оновлення показує одне з них навмання.

      TRMNL бачить лише вибрані фото й нічого іншого в медіатеці. Виберіть Cover, щоб заповнити екран з можливим обрізанням країв, або Contain, щоб показати фото повністю з полями навколо. Google припиняє цей доступ через 7 днів, тому час від часу фото потрібно вибирати знову. На сторінці налаштувань указано, коли доступ завершиться.
    google_tasks: |-
      Ваші Google Tasks на дисплеї TRMNL ePaper. Підключіть акаунт Google, виберіть список завдань — екран покаже незавершені завдання з термінами. Завершені завдання не показуються.

      Сортуйте за терміном або збережіть порядок із застосунку. Підзавдання розміщуються з відступом під основним завданням, щоб їх легко розрізняти. Список можна вирівняти вгорі, по центру або внизу доступної області. Маєте робочий і особистий списки? Додайте окремий екземпляр плагіна для кожного й розмістіть їх поруч у комбінації.
    gumroad_analytics: |-
      Ваші продажі Gumroad на дисплеї TRMNL ePaper. Два великі числа: кількість продажів і їхня загальна вартість.

      Підключіть акаунт Gumroad і виберіть період: 7, 30 або 90 днів. Це все налаштування. Хочете бачити тиждень і квартал поруч? Додайте плагін двічі: з періодами 7 і 90 днів. Поставте дисплей там, де бачите його під час роботи, і нехай цифри показують реальний стан справ.
    hacker_news: |-
      Що зараз читає технологічна спільнота — на дисплеї TRMNL ePaper. Екран показує матеріали Hacker News у порядку рейтингу, із заголовком, кількістю голосів і автором допису. На повному екрані список переходить у дві колонки.

      Налаштування — це один вибір. Top Stories показує матеріали з найвищим поточним рейтингом Hacker News. Show HN — речі, які люди створили й пропонують спробувати (префікс «Show HN:» у заголовках прибрано, адже ви вже знаєте розділ). У комбінації плагін займає половину або чверть екрана.
    home_assistant_screenshot: |-
      Ваші панелі Home Assistant на дисплеї TRMNL ePaper. Плагін працює разом із доповненням TRMNL HA, яке робить знімки панелей усередині вашої мережі, готує їх для ePaper та надсилає на приватну URL-адресу вебхука, надану плагіном. Ззовні до вашої мережі ніхто не підключається.

      Установіть доповнення з магазину Home Assistant або запустіть окремим контейнером, якщо використовуєте Home Assistant у Docker. Створіть розклад у доповненні, виберіть профіль пристрою та вставте URL вебхука. У TRMNL виберіть, чи зображення має заповнювати область або показуватися повністю поруч з іншими плагінами, і яким кольором заповнювати вільний простір навколо.
    homey: |-
      Ваш розумний дім Homey на дисплеї TRMNL ePaper. Overview починається з показників потужності, температури й вологості, далі показує активні тривоги та пристрої. Batteries перелічує всі пристрої з батареями, починаючи з найменш заряджених. Insights будує графік одного записаного показника за останню годину, день, тиждень або місяць.

      Є два способи передавання даних. Установіть застосунок TRMNL для Homey (або HomeyScript) і вставте Push URL плагіна. Або підключіть акаунт Homey, щоб TRMNL читав дані з хмари Homey, та виберіть потрібний Homey. Показуйте всі зони чи лише одну кімнату. Цей плагін також забезпечує роботу рецептів Homey у каталозі TRMNL.
    hubspot: |-
      Ваші угоди HubSpot на дисплеї TRMNL ePaper. Підключіть акаунт HubSpot, виберіть воронку продажів і до 3 етапів угод для відстеження.

      Кожен етап отримує окрему колонку зі списком угод, їхніми назвами, сумами та відповідальними. Це швидкий огляд воронки без відкриття CRM. Потрібно більше етапів або друга воронка? Додайте плагін ще раз і об’єднайте їх на одному екрані в комбінацію.
    huckleberry: |-
      День вашої дитини з Huckleberry на дисплеї TRMNL ePaper. Екран показує ім’я й вік дитини, чи вона спить або не спить і відколи, а також наступний денний або нічний сон за SweetSpot. Нижче — останні годування з пляшечки, грудьми, тверда їжа й зміна підгузка, а також запланований розклад дня.

      Увійдіть із тією самою поштою й паролем, що в застосунку Huckleberry, збережіть і виберіть дитину. Офіційного API Huckleberry немає, тому ми входимо так само, як застосунок, і читаємо ті самі дані, які бачите ви. Стежите за двома дітьми? Додайте окремий екземпляр плагіна для кожної й розмістіть їх поруч у комбінації.
    image_display: |-
      Будь-яке зображення з інтернету на дисплеї TRMNL ePaper. Уведіть адресу зображення, і TRMNL перетворить його під ваш екран. Додайте кілька адрес, по одній у рядку, — кожне оновлення показуватиме випадкове зображення. Посилання спільного доступу Google Drive працюють без змін, тож Drive може бути сховищем зображень.

      Показуйте фото, графік чи панель з іншої системи або знімок камери. Заповнюйте екран, уміщуйте зображення повністю з кольоровим тлом навколо або розтягуйте його. Зображення на домашньому сервері із самопідписаним сертифікатом? Можна дозволити TRMNL завантажувати його. Якщо сервер надсилає заголовки ETag або Last-Modified, TRMNL перемальовує екран лише після фактичної зміни зображення.
    kickstarter: |-
      Краудфандингові проєкти, варті уваги, на дисплеї TRMNL ePaper. Кожен проєкт у списку показує назву, короткий опис, відсоток зібраної цільової суми, суму обіцяних внесків у доларах США та країну походження.

      Виберіть Top, щоб бачити активні проєкти, які зібрали найбільше, або Ending Soon — кампанії, що скоро завершуються, якщо хочете встигнути щось підтримати. Це єдине налаштування.
    language_learning: |-
      Слово мовою, яку ви вивчаєте, на дисплеї TRMNL ePaper. Екран показує слово цією мовою, його значення англійською та приклад речення з ним.

      Доступні 13 мов: бразильська португальська, данська, нідерландська, англійська, французька, грецька, італійська, японська, корейська, норвезька, іспанська, шведська й турецька. Кожне оновлення переходить до наступного слова зі списку тисяч повсякденних слів, а TRMNL запам’ятовує вашу позицію. Хочете довше попрацювати з одним словом? Зменште частоту оновлення.
    letterboxd: |-
      Ваш щоденник Letterboxd на дисплеї TRMNL ePaper. Увійдіть через Letterboxd — екран покаже нещодавно записані фільми з датою перегляду, роком виходу, вашою оцінкою в зірках, сердечком для вподобаних і позначкою повторного перегляду. Більші макети додають постер останнього фільму.

      Цікаво, що дивляться інші? Перемкніться в режим Friends, щоб бачити останні записи щоденника й рецензії людей, за якими стежите: з автором запису, оцінкою та постером, якщо є місце.
    lunar_calendar: |-
      Поточний етап місячного циклу на дисплеї TRMNL ePaper. Угорі — фаза Місяця, освітлена частка та вік у днях. Нижче — шкала фаз навколо сьогоднішньої дати, потім наступна фаза, найближча повня й молодик.

      Є одне налаштування: Detailed показує реалістичні зображення Місяця, Simple — лаконічні піктограми. Місцеположення не потрібне. Дати відповідають часовому поясу акаунта.
    lunch_money: |-
      Ваші фінанси Lunch Money на дисплеї TRMNL ePaper. Створіть токен доступу в налаштуваннях розробника Lunch Money, вставте його та виберіть, що показувати.

      Budgets показує витрати поточного місяця за категоріями, від найбільших, і графік порівняння з бюджетом. Виберіть батьківські або дочірні категорії, щоб згруповані витрати не рахувалися двічі. Accounts перелічує залишки пов’язаних рахунків, активи й зобов’язання. Net Worth показує поточні чисті активи, їхню зміну та графік активів і зобов’язань за останні 3, 6, 9 або 12 місяців. Суми наведено в основній валюті Lunch Money.
    mailchimp_analytics: |-
      Статистика вашої аудиторії Mailchimp на дисплеї TRMNL ePaper. Підключіть акаунт Mailchimp і виберіть аудиторію для відстеження.

      Recent Activity показує вгорі надіслані листи й відсоток відкриттів, далі — унікальні відкриття, кліки, постійні й тимчасові відмови доставки, нових підписників і відписки. Growth History зберігає надіслані листи й відсоток відкриттів, а решту замінює графіком кількості підписників за місяцями. Ведете кілька розсилок? Додайте окремий екземпляр плагіна для кожної аудиторії.
    mazevo: |-
      Перетворіть дисплей TRMNL ePaper на табличку кімнати для будь-якого простору, який бронюєте в Mazévo. Одразу видно, чи кімната зайнята, із назвою й часом поточного бронювання, або до якого часу вона вільна. Нижче — решта бронювань на сьогодні.

      Підключіться за допомогою ключа API та URL API Mazévo, що підтримує організаційні й приватні бронювання, або через стрічку iCal календаря Mazévo, яка показує лише назви й час подій. Виберіть кімнату, біля якої встановлено дисплей. Налаштуйте вигляд: замініть назву кімнати власним заголовком, змініть підпис «Доступно», додайте однорядкову примітку внизу, показуйте чи приховуйте завершені бронювання та виберіть 12- або 24-годинний формат. Приватні бронювання показуються як приватні, без назв.
    microsoft_todo: |-
      Ваші завдання Microsoft To Do на дисплеї TRMNL ePaper. Увійдіть через акаунт Microsoft і виберіть список для показу.

      Екран перелічує всі незавершені завдання списку з терміном і коротким уривком приміток. Завершені завдання зникають, тож ви бачите лише те, що залишилося. Можна вирівняти завдання вгорі, по центру або внизу екрана. Маєте робочий список і список покупок? Додайте окремий екземпляр плагіна для кожного й покажіть обидва в комбінації.
    mondrian: |-
      Генеративне мистецтво в стилі Піта Мондріана на дисплеї TRMNL ePaper. Під час кожного рендерингу екран поділяється на випадкову сітку з товстих чорних ліній і заповнених блоків, тож жодні два зображення не будуть однаковими.

      Налаштовувати нічого не потрібно. Додайте плагін до списку відтворення для перепочинку між екранами даних або розмістіть його в комбінації як маленький витвір мистецтва поруч із календарем чи погодою.
    motivational_quote: |-
      Мотиваційна цитата дня на дисплеї TRMNL ePaper. Екран показує цитату великим шрифтом, а нижче — ім’я автора. Цитати надходять із добірки «цитата дня» ZenQuotes, тому змінюються щодня й однакові для всіх.

      Налаштовувати нічого не потрібно. Додайте до списку відтворення або в комбінацію поруч із календарем, щоб мати над чим подумати між зустрічами.
    nano_banana_dashboard: |-
      Ваші дані TRMNL, перетворені на зображення моделями Google Gemini для генерації зображень, відомими як Nano Banana. Виберіть до 3 інших плагінів як джерела даних, і Gemini перетворить їхні дані на сцену: першу шпальту газети, крейдяне меню кафе, центр керування польотами тощо.

      Використовуйте власний ключ API Gemini з Google AI Studio з налаштованою оплатою та виберіть Flash, Flash 2.5 або Pro. Потім налаштуйте результат: додайте власний текст, укажіть потрібні дані, виберіть сцену або Random, додайте побажання щодо стилю та співвідношення сторін. Досвідчені користувачі можуть написати весь запит самостійно. Нове зображення створюється лише після зміни налаштувань або даних.
    netatmo_weather_station: |-
      Показники вашої метеостанції Netatmo на дисплеї TRMNL ePaper. Увійдіть до Netatmo, щоб надати TRMNL доступ лише для читання, потім виберіть станцію та, за бажанням, модуль для показників у приміщенні.

      Режим Basic починається з температури надворі й температурного графіка, далі показує температуру, вологість і CO2 у приміщенні, а також зовнішню вологість, тиск, шум і денний мінімум та максимум. Маєте дощомір або анемометр? Їхні показники теж з’являться. Режим Graph натомість заповнює область одним показником: температурою, вологістю, CO2, шумом, тиском, дощем або вітром. Виберіть Фаренгейти чи Цельсії та, за бажанням, вузли для вітру.
    nextcloud_calendar: |-
      Ваш календар Nextcloud на дисплеї TRMNL ePaper. Надайте доступ до календаря за посиланням у Nextcloud і вставте його (кілька посилань — по одному в рядку) або синхронізуйте з iPhone чи iPad через TRMNL Companion.

      Виберіть макет: план на сьогодні, найближчі дні, звичайний, рухомий, робочий або 3-денний тиждень, звичайна чи рухома місячна сітка або мінімалістичний розклад. Показуйте час і описи подій, використовуйте 12- або 24-годинний формат, кольори календарів і приховування подій із певними словами. Тижневий і місячний вигляди можуть затіняти вихідні, виділяти сьогоднішній день, показувати номери тижнів і лінію поточного часу.
    notion: |-
      Ваші бази даних і сторінки Notion на дисплеї TRMNL ePaper. Підключіть Notion із доступом лише для читання, виберіть доступний TRMNL вміст, а потім одну базу даних або сторінку для показу.

      Для бази даних виберіть властивість заголовка, властивість для великої позначки статусу та властивості для менших підписів або звичайних деталей нижче. Сортуйте за будь-якою властивістю, фільтруйте за синтаксисом Notion (працюють і динамічні дати на кшталт «сьогодні плюс 7»), задавайте кількість елементів і одну чи дві колонки. Для сторінки екран показує вміст послідовно: текст, заголовки, списки, зображення тощо.
    outlook_calendar: |-
      Ваш календар Outlook на дисплеї TRMNL ePaper. Увійдіть через акаунт Microsoft і виберіть календарі для показу. Якщо нічого не вибрати, використовується типовий календар.

      Виберіть макет: план на сьогодні, найближчі дні, тиждень чи робочий тиждень, місячна сітка або мінімалістичний розклад. Показуйте час і описи подій, використовуйте 12- або 24-годинний формат, приховуйте події з певними словами та показуйте лише прийняті запрошення. Тижневий і місячний вигляди можуть затіняти вихідні, виділяти сьогоднішній день і показувати номери тижнів. Якщо ви плануєте день погодинно, лінія поточного часу допоможе не відхилятися від плану.
    parcel: |-
      Ваші доставки із застосунку Parcel на дисплеї TRMNL ePaper. Кожне відправлення показує статус, наприклад «У дорозі» або «Передано кур’єру», назву, останню подію відстеження та очікуваний час: сьогодні, завтра, день тижня або дату.

      Потрібна платна підписка Parcel. Увійдіть на web.parcelapp.net, створіть ключ API та вставте його. Показуйте активні або нещодавні доставки, виберіть стиль Detailed чи Compact, який приховує подію відстеження, та визначте, що робити, коли нічого не їде: показувати порожній екран або пропускати його.
    place_of_the_day: |-
      Щодня нове місце на дисплеї TRMNL ePaper: місто або диво світу. Кожен екран показує назву, регіон і країну, карту вулиць і короткий опис, зазвичай із Вікіпедії. За наявності даних також показуються населення, рік заснування, висота над рівнем моря, площа, місцевий час і координати.

      Налаштовувати нічого не потрібно. Усі користувачі плагіна бачать того самого дня те саме місце, а добірки чергуються між Європою, Америками та рештою світу.
    poetry_today: |-
      Вірш на дисплеї TRMNL ePaper із заголовком угорі та ім’ям поета в кутку. Кожне оновлення навмання вибирає новий вірш із PoetryDB, відкритої колекції класичної поезії.

      Налаштовувати нічого не потрібно: додайте плагін — і готово. Ми вибираємо лише вірші, достатньо короткі для екрана (щонайбільше 24 рядки), тож сонет не обірветься на півдумки. Добре пасує до годинника чи календаря в комбінації, коли хочеться читати щось неквапливіше за вхідну пошту.
    polymarket: |-
      Ринки прогнозів Polymarket на дисплеї TRMNL ePaper. Виберіть тему — екран покаже до 12 відкритих ринків із запитанням, кількістю коментарів і сумою коштів на кожному.

      Теми охоплюють бізнес, попкультуру, спорт, криптовалюти, науку й політику. Акаунт Polymarket не потрібен. Показуються лише активні ринки, які закриються протягом наступних 2 тижнів, тож результати ставок стануть відомі скоро, а не наступного року. Потрібна тема, якої немає у списку? Напишіть підтримці ID тегу Polymarket, і ми додамо її до вашого акаунта.
    postmark_analytics: |-
      Статистика вашої пошти Postmark на дисплеї TRMNL ePaper. Вставте Server API Token із сервера Postmark і виберіть період: 7, 30 або 90 днів.

      Головні числа — надіслані листи та відсоток відкриттів. Нижче — унікальні відкриття, кліки, відмови доставки, помилки, скарги на спам і відсоток відмов доставки. Зручно на столі команди експлуатації чи підтримки: сплеск відмов або скарг буде помітно ще до того, як клієнт запитає, чому не отримав лист для скидання пароля.
    private_plugin: |-
      Створіть власний екран для дисплея TRMNL ePaper. Напишіть його на HTML із шаблонами Liquid і дизайн-фреймворком TRMNL, а потім визначте спосіб отримання даних: TRMNL опитує URL, що повертає JSON, XML або звичайний текст; ваш код надсилає дані на вебхук; ви вводите статичний JSON; або повторно використовуєте дані інших плагінів TRMNL.

      Опитування підтримує GET і POST, власні заголовки, тіло запиту та OAuth для сервісів, що потребують входу. Додайте поля форми, щоб інші могли налаштовувати плагін без зміни коду; перетворюйте дані скриптом на Node, PHP, Python або Ruby, а готовим результатом поділіться як рецептом.
    product_hunt: |-
      Вибрані запуски Product Hunt на дисплеї TRMNL ePaper. Кожен елемент нумерованого списку показує назву, короткий опис і кількість голосів.

      Нічого підключати не потрібно, акаунт теж не потрібен. Додайте плагін — список оновлюватиметься сам. Створюєте власний продукт? Стежте за новими запусками й кількістю голосів, потрібною для помітності, не відкриваючи ще одну вкладку. Плагін уміщується на повному екрані, половині або чверті поруч з іншими плагінами.
    profit_well: |-
      Показники доходу ProfitWell на дисплеї TRMNL ePaper. Вставте токен API ProfitWell — екран покаже сьогоднішні показники акаунта.

      Угорі — новий і загальний регулярний дохід. Нижче — втрачений дохід, активні, нові й втрачені клієнти. Керуєте SaaS-бізнесом? Поставте дисплей там, де бачитимете його щоранку, щоб невдалий день із відтоком клієнтів не загубився на панелі, яку ви забули відкрити.
    proton_calendar: |-
      Ваш Proton Calendar на дисплеї TRMNL ePaper. Є два способи підключення: поділіться календарем Proton за посиланням і вставте адресу .ics у плагін або синхронізуйте з iPhone чи iPad через TRMNL Companion. Турбуєтеся про приватність? Proton дозволяє поділитися посиланням, яке показує лише зайнятість без змісту події.

      Виберіть макет: план на сьогодні, найближчі дні, звичайний, рухомий, робочий або 3-денний тиждень, місячна сітка чи мінімалістичний розклад. Показуйте час і описи подій, використовуйте 12- або 24-годинний формат, приховуйте події з певними словами та починайте тиждень із будь-якого дня. Тижневий і місячний вигляди можуть затіняти вихідні, виділяти сьогоднішній день і показувати номери тижнів.
    purpleair: |-
      Показники датчика PurpleAir на дисплеї TRMNL ePaper. Використовуйте власний датчик або будь-який публічний на карті PurpleAir. Введіть ID датчика й ключ API PurpleAir, а для приватного датчика — ще й ключ читання.

      Виберіть, що показувати. Режим якості повітря показує поточні PM2.5 і PM10 та графік за останні 24 години зі шкалою EPA — від доброго до дуже шкідливого рівня. Режим температури й вологості показує натомість ці два показники у Фаренгейтах або Цельсіях. Ми запитуємо в PurpleAir лише зміни від останнього оновлення, тому безкоштовних кредитів API вистачає надовго.
    readwise: |-
      Ваші виділені уривки Readwise на дисплеї TRMNL ePaper. Отримайте токен доступу в Readwise, вставте його в плагін — і готово.

      Кожне оновлення показує один уривок із щоденного огляду Readwise разом із назвою книги чи статті та автором. Наступне оновлення переходить до наступного уривка. Це спокійний спосіб справді повертатися до збереженого, замість накопичувати його в застосунку, який ніколи не відкриваєте.
    reddit: |-
      Найкращі дописи з улюблених сабредітів на дисплеї TRMNL ePaper. Підключіть акаунт Reddit і вкажіть до 3 сабредітів. Кожен отримає окрему колонку.

      Сортуйте за Hot, New або Top і вибирайте період — від останньої години до всього часу. Закріплені дописи пропускаються, адже рідко змінюються. Показуйте або приховуйте кількість голосів та ім’я автора під заголовком. Скоротіть довгі заголовки до одного рядка, щоб на екрані вмістилося більше дописів.
    redirect: |-
      Інструмент для розробників, які створюють власні зображення. Коли дисплей TRMNL ePaper виходить на зв’язок, ми звертаємося до URL на вашому сервері й передаємо відповідь безпосередньо пристрою: звідки взяти зображення, назву файлу та тривалість сну до наступного виходу на зв’язок.

      Отже, під час кожного звернення ваш сервер визначає, що й коли показувати. Адреса зображення може змінюватися з кожним запитом і навіть бути в локальній мережі. Якщо двічі надіслати ту саму назву файлу, екран не перемальовується — це зменшує мерехтіння й витрату заряду. Ви задаєте тривалість сну, аж до 1 хвилини. Уже використовуєте Alias і хочете більше контролю? Це наступний крок.
    rss_feed: |-
      Будь-яка стрічка RSS або Atom на дисплеї TRMNL ePaper. Вставте адресу стрічки й виберіть макет.

      Featured показує найновіший допис із заголовком, текстом і зображеннями. List — до 8 останніх дописів, кожен із заголовком і коротким викладом звичайним текстом. Стежите за блогом, новинним сайтом, подкастом або форумом, де досі є стрічка? Розмістіть її на стіні. Стрічка на домашньому сервері із самопідписаним сертифікатом? Можна дозволити TRMNL завантажувати її.
    screen_wiper: |-
      Прибирає залишкові зображення на дисплеї TRMNL ePaper. Це слабкі сліди попередніх зображень, які можуть накопичуватися на ePaper. Коли список відтворення доходить до Screen Wiper, пристрій виконує спеціальні цикли перемикання між чорним і білим, а потім переходить до наступного елемента.

      Додайте плагін і збережіть — це все. Залежно від пристрою очищення супроводжується спалахами протягом 30–60 секунд або до 5 хвилин. Заплануйте запуск раз на день чи тиждень, бажано одразу після пробудження. Потрібна прошивка 1.8.14 або новіша.
    screensaver: |-
      Мистецтво для дисплея TRMNL ePaper. Кожне оновлення вибирає випадкове зображення з нашої невеликої бібліотеки заставок: «Мона Ліза», Рим, місії Apollo, космічна станція — усе підготовлено для чіткого показу на ePaper.

      Налаштовувати нічого не потрібно. Додайте до списку відтворення, коли хочете, щоб екран тішив око, а не показував справи, наприклад між зустрічами або вночі. Колекція невелика, але зростає, і ми приймаємо пропозиції. Маєте зображення, яке хотіли б додати? Напишіть на support@trmnl.com.
    screenshot: |-
      Будь-яка загальнодоступна вебсторінка на дисплеї TRMNL ePaper. Вставте адресу — ми завантажимо сторінку й зробимо її знімок. Спортивні результати, панель стану чи шкільне меню вашої дитини — усе підійде.

      Сторінці потрібен токен входу? Додайте HTTP-заголовки. Ми виправляємо відносні посилання на стилі, скрипти й зображення, щоб сторінка виглядала як у браузері (це можна вимкнути). Якщо HTML не змінився, перемальовування пропускається. Для панелей, що завантажують дані через JavaScript, увімкніть постійне оновлення, щоб щоразу отримувати новий знімок. Порада: спочатку встановіть розмір вікна браузера 800x480, щоб побачити те саме, що TRMNL.
    shopify: |-
      Ваші продажі Shopify на дисплеї TRMNL ePaper. Створіть власний застосунок у панелі адміністратора Shopify з доступом лише на читання замовлень, потім вставте його токен доступу й адресу магазину в плагін. Наша довідкова стаття проведе вас через налаштування.

      Виберіть період: останні 7 днів, 30 днів або від початку місяця. Екран показує загальну суму продажів і порівняння з попереднім періодом, замовлення в очікуванні й виконані, середню вартість замовлення та графік щоденних продажів проти попереднього періоду. Суми наведено у валюті магазину. TRMNL читає лише замовлення, нічого іншого в магазині.
    shopping_list: |-
      Ваш список покупок на дисплеї TRMNL ePaper. Введіть товари в плагіні, по одному в рядку, і вони з’являться на екрані як нумерований список.

      Прикріпіть дисплей до холодильника або біля дверей — і наступного разу, коли братимете ключі, згадаєте про зубну пасту. Додавайте або видаляйте товари на панелі керування TRMNL будь-коли: список на екрані оновиться. Ми зберігаємо його в зашифрованому вигляді.
    simple_analytics: |-
      Ваша статистика Simple Analytics на дисплеї TRMNL ePaper. Угорі показано перегляди сторінок, відвідувачів і хвилини на сторінці, а нижче — графік щоденних переглядів.

      Створіть ключ API в налаштуваннях облікового запису Simple Analytics, вставте його та додайте домен свого сайту (без «http»). Виберіть період: 1, 7, 14 або 30 днів. Хочете, щоб графік закінчувався вчорашнім, а не сьогоднішнім днем? Це також можна налаштувати, щоб неповний день не виглядав як різке падіння відвідуваності.
    square_pos: |-
      Ваші продажі Square на дисплеї TRMNL ePaper. Підключіть обліковий запис Square і виберіть до 3 торгових точок. Кожна отримає власний стовпець із загальною сумою платежів угорі та нумерованим списком усіх завершених платежів нижче, із сумою та способом оплати кожного.

      Виберіть період: сьогодні, останні 24 години або останні 7 днів. Керуєте кількома магазинами? Переглядайте їх поруч на одному екрані.
    statuspage: |-
      Сторінки стану сервісів, від яких ви залежите, на дисплеї TRMNL ePaper. Вставте адреси сторінок стану, по одній у рядку, і ми знайдемо RSS- або Atom-стрічку кожної. Це працює зі Statuspage, AWS, Slack, Google Cloud і більшістю інших сервісів.

      Екран поділено на 2 списки. У розділі інцидентів показано останній інцидент кожного сервісу й час, що минув від нього; значок позначає події за останні 24 години. У розділі запланованих робіт показано майбутнє технічне обслуговування та його дату. Якщо сторінка недоступна або не має стрічки, на екрані з’явиться повідомлення про це.
    stock_price: |-
      Ціни на акції, метали й валюти на дисплеї TRMNL ePaper. Введіть до 12 тикерів: для кожного буде показано ціну, назву та денну зміну у відсотках або пунктах. Макет підлаштовується під кількість доданих тикерів.

      Тикери США працюють без змін. Для Канади, Німеччини, Лондона чи Індії додайте позначення біржі (наприклад, SHOP.TSE або INFY.NSE), для валютних пар — суфікс .FX (EURUSD.FX). Також можна відстежувати золото, срібло, платину, паладій і мідь (XAUUSD для золота). Біржові індекси не підтримуються, тому використовуйте ETF, наприклад SPY для S&P 500 (введіть SPX, і ми його запропонуємо). Потрібно понад 12 тикерів? Додайте плагін двічі та об’єднайте їх у комбінацію.
    tempest_weather_station: |-
      Показники вашої метеостанції Tempest на дисплеї TRMNL ePaper. Увійдіть в обліковий запис Tempest, щоб надати TRMNL доступ лише для читання (ми можемо переглядати дані, але не змінювати їх), і виберіть станцію.

      На повному екрані показано поточну температуру, температуру за відчуттям і погодні умови, а також вологість, вітер, опади, УФ-індекс, схід і захід сонця та максимальну й мінімальну температуру на сьогодні й завтра. Виберіть градуси Фаренгейта або Цельсія, одиниці швидкості вітру — милі/год, км/год, вузли чи бали Бофорта — й опади в дюймах, сантиметрах або міліметрах. Маєте кілька станцій? Додайте окремий плагін для кожної та об’єднайте їх на одному екрані в комбінацію.
    the_office: |-
      Випадкова цитата із серіалу «Офіс» на дисплеї TRMNL ePaper поруч із малюнком персонажа, який її промовив. Майкл, Двайт, Джим та інші працівники Dunder Mifflin по черзі додають трохи легкості вашому робочому дню.

      Налаштовувати нічого не потрібно. Додайте плагін, за бажанням дайте йому назву та збережіть. Цитати надходять з Office API від Akash Rajpurohit.
    ticktick: |-
      Ваші завдання TickTick на дисплеї TRMNL ePaper. Підключіть обліковий запис TickTick, а потім виберіть потрібний список або вхідні. Завдання показано з термінами виконання, починаючи з найближчих, а підзавдання — з відступом під головним завданням.

      Виберіть вирівнювання списку: угорі, по центру або внизу відведеного місця. TickTick передає іншим застосункам лише списки завдань, тому календар, звички, Pomodoro та матриця Ейзенхауера залишаються в TickTick.
    todo_list: |-
      Простий список справ на дисплеї TRMNL ePaper. Підключати обліковий запис не потрібно. Введіть поточні справи в розділі «У роботі», по одній у рядку, а завершені за бажанням додайте до розділу «Готово».

      Повертайтеся та переносьте справи з «У роботі» до «Готово» в міру виконання. На екрані залишатимуться обидва списки: що ще треба зробити й що вже зроблено. Кожен пункт підтримує Markdown для жирного шрифту, курсиву тощо; його можна вимкнути, щоб використовувати звичайний текст. Обидва списки зберігаються в зашифрованому вигляді.
    todoist: |-
      Ваші завдання Todoist на дисплеї TRMNL ePaper. Підключіть обліковий запис Todoist, виберіть проєкт або подання «Сьогодні» чи «Майбутнє», і на екрані з’являться завдання з датами виконання.

      Групуйте завдання за датою, кінцевим терміном, пріоритетом або міткою, а сортуйте — за назвою, датою, кінцевим терміном, пріоритетом чи власним порядком. Фільтри звужують список за датою виконання або кінцевим терміном (від сьогодні до наступних 30 днів), пріоритетом, міткою або виконавцем. Добре знаєте запити фільтрів Todoist? Увімкніть режим власного запиту й напишіть свій.
    unsplash: |-
      Випадкове фото з Unsplash на дисплеї TRMNL ePaper. Введіть пошуковий запит, наприклад «space» або «moon», і під час кожного оновлення з’являтиметься нове відповідне фото горизонтальної орієнтації, адаптоване за допомогою дизерингу для ePaper та розгорнуте на весь екран.

      Це єдине налаштування. Виберіть тему, на яку вам приємно дивитися, або додайте плагін кілька разів із різними запитами, щоб список відтворення чергував їх.
    upcoming_movies: |-
      Фільм, на який можна чекати, на дисплеї TRMNL ePaper. Під час кожного оновлення вибирається фільм і показуються його назва, постер, дата виходу та короткий опис. Дані надходять із The Movie Database (TMDB).

      Виберіть свою країну, щоб бачити місцеві прем’єри. Потім виберіть «Незабаром» для фільмів, які виходять сьогодні або пізніше, чи «Зараз у кіно» для тих, що вже вийшли. Допоможе вирішити, що подивитися на вихідних, ще до початку суперечки.
    weather: |-
      Дізнайтеся, яка погода надворі, перш ніж виходити, — метеостанція не потрібна. Знайдіть місто чи поштовий індекс або введіть координати, і дисплей TRMNL ePaper покаже поточну температуру й погодні умови, температуру за відчуттям, вологість, а також максимальну й мінімальну температуру та УФ-індекс на сьогодні й завтра.

      Ви самі вибираєте постачальника даних. Tempest використовує найближчу станцію Tempest або станцію, яку ви виберете на карті Tempest, і додає на повний екран вітер, опади, схід і захід сонця. WeatherAPI — запасний варіант для місць, де поблизу немає станції. Виберіть градуси Фаренгейта або Цельсія, одиниці вимірювання вітру й опадів та підписи прогнозів: «сьогодні» й «завтра» або конкретні дати.
    webhook_image: |-
      Надсилайте власні зображення безпосередньо на дисплей TRMNL ePaper. Додайте плагін, щоб отримати приватну URL-адресу вебхука. Надішліть PNG, JPEG або WebP POST-запитом зі скрипту, завдання cron чи Home Assistant — і зображення з’явиться на екрані. Бережіть цю адресу як пароль: кожен, хто її знає, може змінити зображення на дисплеї.

      TRMNL не обробляє зображення, тому заздалегідь підготуйте його під розмір свого пристрою. Завантаження перевіряються на відповідність розміру й глибині кольору вашого пристрою або вибраної моделі; перевірку можна пропустити, якщо ви впевнені, що пристрій впорається. У комбінації можна заповнити зображенням відведене місце або показати його повністю з фоновим кольором навколо. Доступно до 12 завантажень на годину.
    wiki_random_article: |-
      Вибрана стаття дня з Вікіпедії на дисплеї TRMNL ePaper. Щодня — нова назва статті та короткий опис. Сьогодні це може бути битва, а завтра — жук.

      Налаштовувати нічого не потрібно. Додайте плагін до списку відтворення та дізнавайтеся щось цікаве, поки готується кава. Статті надходять зі щоденної стрічки вибраних статей англомовної Вікіпедії, тому всі бачать ту саму статтю.
    withings: |-
      Ваші дані про здоров’я з Withings на дисплеї TRMNL ePaper. Увійдіть через Withings, щоб надати TRMNL доступ лише для читання, а потім виберіть режим відображення відповідно до свого пристрою. Режим ваги для ваг показує поточну вагу, відсоток жиру й м’язів та зміну за вибраний період із графіком. Режим сну для Sleep Analyzer показує оцінку сну, його тривалість та ефективність із графіком глибокого, швидкого й легкого сну щоночі. Режим активності для носимих пристроїв показує сьогоднішні кроки відносно цілі та графік кроків і сну.

      Виберіть період 7, 30 або 90 днів і відображення ваги у фунтах, кілограмах або стоунах. Показники, введені вручну, не враховуються.
    workflowy: |-
      Ваш список Workflowy на дисплеї TRMNL ePaper. Кожен пункт показано з приміткою під ним у тому самому порядку, що й у Workflowy.

      Для підключення вставте токен API Workflowy. За замовчуванням показується головний список. Потрібен лише один проєкт? Додайте ідентифікатор його пункту, і плагін використовуватиме цей пункт як верхній рівень. Можна показувати до 25 пунктів і вибрати, чи відображати завершені — вони будуть позначені галочкою та перекреслені.
    youtube_analytics: |-
      Статистика вашого каналу YouTube на дисплеї TRMNL ePaper. На початку екрана — перегляди та години перегляду, далі — середня тривалість перегляду, нові підписники, частка переглядів, уподобання, коментарі та поширення.

      Підключіться через обліковий запис Google, якому належить канал (менеджери спільного каналу не можуть його підключити), і виберіть період: 7, 28, 90 або 365 днів. Маєте кілька каналів? Додайте окремий плагін для кожного й дайте їм назви, щоб розрізняти їх.
