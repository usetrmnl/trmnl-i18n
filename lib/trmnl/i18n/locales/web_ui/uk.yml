            question: Can I keep Envoy Visitors at the front desk?
            answer: Yes. Booking reads your Google or Microsoft room calendars directly and needs no Envoy integration. Run Envoy Visitors at reception and Booking at the room doors.
          visitor_management:
            question: Does Booking do visitor management?
            answer: No. Booking has no visitor sign-in, ID scanning or badge printing. Anyone who scans the QR code on a display can book the room from their phone, with no TRMNL account or app.
          platform_fee:
            question: Is there a platform fee?
            answer: No. Booking is $%{price} a month, or $%{annual_price} a year, for each bookable resource shown on a screen. That is the whole software price.
          existing_tablets:
            question: Can I use the tablets I already have?
            answer: Yes. Open any room or collection at its own private URL in a browser, on a tablet, TV or LCD screen. It needs no login or app, and refreshes itself. TRMNL ePaper is optional, and a one-time purchase if you want it.
          power_at_door:
            question: Do TRMNL displays need power at the door?
            answer: No. A TRMNL runs 3 to 6 months per charge at typical refresh rates, and hangs from its hook recess. Recharge it over USB-C a few times a year.
