        try_it_description_html: Install Booking, connect a calendar and put one room on a screen.<br>The first %{days} days are free.
        install_booking: Install Booking
        og_description: Smart ePaper meeting room schedule displays and conference room booking system. Show real-time calendar availability, prevent double-bookings, and book rooms with QR codes.
        faq:
          visitor_account:
            question: Do visitors need a TRMNL account to book?
            answer: No. They scan the QR code on the screen, pick a time and book. The booking goes straight into your calendar.
          calendars:
            question: Which calendars does it work with?
            answer: Google (personal accounts and Workspace), Microsoft (Outlook, Exchange Online rooms and Microsoft Places workspaces) and any iCal feed.
          double_booking:
            question: What if someone books the same room in Outlook at the same time?
            answer: We check your calendar again right before we book, and turn down a booking that overlaps. Your calendar stays the source of truth.
          qr_code_photo:
            question: Can someone book from a photo of the QR code?
            answer: Turn on QR Code Security and the booking link changes every day, so yesterday's photo stops working. Printed codes stop working too, so leave it off if you rely on them.
          screen_updates:
            question: How often does the screen update?
            answer: We redraw each room every five minutes, and the device picks it up at its own refresh rate. Faster refresh uses more battery, so a screen next to a busy room is happiest plugged in.
          tv_or_tablet:
            question: Can I show the schedule on a TV or tablet?
            answer: Yes. Any calendar or collection can also open at its own private URL in a browser, on an LCD screen, TV or tablet. It needs no login and refreshes itself. A room on both a TRMNL and a URL is billed once.
          room_management:
            question: How does an ePaper meeting room schedule display improve conference room management?
            answer: ePaper room displays show live availability, current meeting titles and organizer details without glare or glowing blue light in hallways. Because they run for months on battery or over USB-C, they mount on glass walls and doors without running PoE cables or cutting drywall.
          hallway_display:
            question: Can TRMNL serve as an office hallway display for multiple conference rooms?
            answer: 'Yes. You can group rooms, desks and workspaces into collections: up to %{grid_size} in a grid or %{list_size} in a list on a single screen. Hallway and reception displays give a quick overview of which spaces are free across the entire floor.'
          walk_up_bookings:
            question: How does the conference room reservation system handle walk-up bookings?
            answer: Anyone can scan the on-screen QR code with their phone camera to reserve 15, 30 or 60 minutes instantly. No app installation or TRMNL login is required. The reservation syncs directly with your Google Workspace or Microsoft 365 calendar in real time to prevent double-bookings.
          billing:
            question: How does billing work?
            answer: "$%{price} a month or $%{annual_price} a year for each bookable resource on a screen, after a %{trial_days}-day free trial. A room on three screens counts once. No contract."
          virtual_device:
            question: Can I try it without a TRMNL?
            answer: Yes. Create a free virtual device, install Booking and see your rooms on screen before you buy anything.
        software_application_description: Smart ePaper conference room schedule displays and meeting room booking system for Google Workspace and Microsoft 365.
