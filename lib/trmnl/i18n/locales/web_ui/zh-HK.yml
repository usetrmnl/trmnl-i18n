          front_desk:
            question: Can I keep Envoy Visitors at the front desk?
            answer: Yes. Booking reads your Google or Microsoft room calendars directly and needs no Envoy integration. Run Envoy Visitors at reception and Booking at the room doors.
          visitor_management:
            question: Does Booking do visitor management?
            answer: No. Booking has no visitor sign-in, ID scanning or badge printing. Anyone who scans the QR code on a display can book the room from their phone, with no TRMNL account or app.
