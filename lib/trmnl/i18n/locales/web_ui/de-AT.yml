  integration_overviews:
    alias: |-
      Dein eigenes Bild, auf einem TRMNL ePaper-Display. Alias ist für Leute, die ihre Bildschirme bereits woanders erstellen, etwa mit einem Skript auf einem Heimserver. Füge die vollständige URL des Bildes ein, und dein Gerät ruft es direkt von dieser Adresse ab, sodass auch eine lokale URL wie http://localhost:4567/image.png funktioniert.

      Das Bild muss für ePaper fertig sein: ein 1-Bit-BMP oder ein 1- oder 2-Bit-PNG, in der genauen Größe deines Geräts. Wir konvertieren es nicht für dich (dafür ist Image Display gedacht). Schreibst du dieselbe Datei immer wieder neu? Schalte das Caching aus, und dein Gerät zeichnet sie jedes Mal neu, auch wenn sich der Dateiname nicht geändert hat.
    apple_calendar: |-
      Dein Apple-Kalender, auf einem TRMNL ePaper-Display. Es gibt 3 Wege: füge den Link eines Kalenders ein, den du in iCloud öffentlich gemacht hast, synchronisiere von deinem iPhone oder iPad mit der TRMNL Companion App, oder melde dich mit deiner Apple-ID und einem app-spezifischen Passwort an und wähle, welche iCloud-Kalender gezeigt werden sollen.

      Wähle dann ein Layout: die heutige Agenda, die nächsten paar Tage, eine Woche oder Arbeitswoche, ein Monatsraster oder einen minimalen Zeitplan. Zeige Terminzeiten und Beschreibungen, nutze 12- oder 24-Stunden-Zeit, verstecke Termine mit bestimmten Wörtern darin, und starte deine Woche an einem beliebigen Tag. Eine Linie für die aktuelle Zeit und eine Hervorhebung von heute zeigen dir, wo im Tag du gerade stehst.
    apple_photos: |-
      Fotos aus einem geteilten Apple-Fotos-Album, auf einem TRMNL ePaper-Display. Aktiviere in der Fotos-App „Öffentliche Website“ für ein geteiltes Album, und füge dann den Link des Albums in die Erweiterung ein. Jede Aktualisierung wählt ein zufälliges Foto daraus.

      Wähle Cover, um den ganzen Bildschirm zu füllen (die Ränder können beschnitten werden), oder Contain, um das ganze Foto mit Rand darum zu zeigen. Fotos, die du später zum Album hinzufügst, kommen in die Rotation. TRMNL liest nur dieses eine geteilte Album, nichts anderes aus deiner Bibliothek.
    asana: |-
      Deine Asana-Aufgaben, auf einem TRMNL ePaper-Display. Verbinde dein Asana-Konto, wähle einen Arbeitsbereich, und entscheide dann, welche Abschnitte von „Meine Aufgaben“ gezeigt werden, wie „Heute erledigen“ oder „Später erledigen“. Der Vollbildschirm zeigt 3 Abschnitte nebeneinander; kleinere Layouts zeigen 2.

      Jede Aufgabe zeigt ihren Namen und ihr Fälligkeitsdatum. Sortiere nach Fälligkeitsdatum, A bis Z, oder Asanas eigener Reihenfolge, und zeige Fälligkeitsdaten als „Heute“, „Morgen“ und Wochentagsnamen oder als kurze Datumsangaben. Du kannst auch zeigen, zu welchem Projekt jede Aufgabe gehört, und erledigte Aufgaben einschließen. Projektansichten, geteilte Team-Listen und Unteraufgaben werden nicht unterstützt, nur „Meine Aufgaben“.
    basecamp: |-
      Deine Basecamp-To-dos, auf einem TRMNL ePaper-Display. Verbinde dein Basecamp-Konto, wähle das Konto und das Projekt, und der Bildschirm listet die To-dos aus den To-do-Listen dieses Projekts an einem Ort.

      To-dos werden nach Fälligkeitsdatum sortiert, das nächste zuerst, sodass das, was als Nächstes dran ist, oben steht. Willst du mehr als 1 Projekt beobachten? Füge die Erweiterung einmal pro Projekt hinzu und stelle sie mit einem Mashup nebeneinander auf einen Bildschirm.
    beehiiv: |-
      Statistiken deines neuesten beehiiv-Newsletters, auf einem TRMNL ePaper-Display. Du siehst die Betreffzeile, wie viele Leute ihn erhalten haben, Öffnungen und Öffnungsrate, Klicks und Klickrate, sowie Abmeldungen und Spam-Beschwerden.

      Die Einrichtung dauert eine Minute und braucht keinen Code. Gehe in beehiiv zu Settings, dann Integrations, dann API, erstelle einen API-Schlüssel und kopiere deine Publication ID. Füge beide in die Erweiterung ein und speichere. Betreibst du mehr als 1 Newsletter? Füge die Erweiterung einmal pro Publikation hinzu.
    bible_verses: |-
      Ein zufälliger Bibelvers auf deinem TRMNL ePaper-Display, ein neuer bei jeder Aktualisierung des Bildschirms. Der Vers sitzt mittig auf dem Bildschirm unter einer „Daily Scripture“-Überschrift, mit Buch, Kapitel und Vers darunter.

      Wähle deine Übersetzung: American Standard, King James oder World English Bible. Das ist die einzige Einstellung. Füge sie zu deiner Wiedergabeliste hinzu und lass sie zwischen deinem Kalender und dem Wetter auftauchen.
    bitcoin_wallet_balance: |-
      Der Kontostand einer Bitcoin-Wallet, auf einem TRMNL ePaper-Display. Füge eine öffentliche Wallet-Adresse ein, und der Bildschirm zeigt, was sie in BTC und in US-Dollar enthält, sowie einen Candlestick-Chart des Bitcoin-Preises der letzten 90 Tage.

      Du bekommst außerdem die Preisänderung über 7 und 90 Tage, sodass du auf einen Blick siehst, ob es eine gute Woche war. TRMNL braucht nur die öffentliche Adresse, nie deine Schlüssel. Hältst du mehr als 1 Wallet? Füge die Erweiterung einmal pro Adresse hinzu.
    caldav: |-
      Termine aus fast jedem Kalenderdienst, auf einem TRMNL ePaper-Display. Füge 1 oder mehrere veröffentlichte .ics-Kalenderlinks ein, und füge HTTP-Header hinzu, falls dein Server sie für den Zugriff braucht. Lieber über dein Handy? Synchronisiere Kalender von deinem iPhone oder iPad mit der TRMNL Companion App.

      Wähle dann ein Layout: die heutige Agenda, die nächsten paar Tage, eine Woche oder Arbeitswoche, ein Monatsraster oder einen minimalen Zeitplan. Zeige Terminzeiten und Beschreibungen, nutze 12- oder 24-Stunden-Zeit, verstecke Termine mit bestimmten Wörtern darin, und zeige Kalenderfarben auf den Terminblöcken. Wochen- und Monatsansichten können Wochenenden schattieren, heute hervorheben, Kalenderwochen zeigen und eine Linie bei der aktuellen Zeit ziehen.
    changelog: |-
      Neuigkeiten vom TRMNL-Team, auf deinem TRMNL ePaper-Display. Der Bildschirm listet unsere neuesten Ankündigungen, die neueste zuerst, jede mit Datum und Titel. Der Vollbildschirm fügt unter jeder eine kurze Beschreibung hinzu.

      Es gibt nichts einzurichten. Füge sie zu einer Wiedergabeliste hinzu, und du erfährst von neuen Erweiterungen und Funktionen direkt vom Gerät, ohne E-Mails oder unsere sozialen Netzwerke zu checken.
    chatgpt: |-
      Antworten von ChatGPT, auf einem TRMNL ePaper-Display. Schreibe einmal einen Prompt, und er wird bei jeder Aktualisierung erneut gestellt, sodass du jedes Mal eine neue Antwort bekommst. Denk an einen lustigen Fakt, ein Wort des Tages oder eine tägliche Schreibidee.

      Erstelle einen API-Schlüssel in deinem OpenAI-Konto und füge ihn mit deinem Prompt ein. Wähle ein Modell, und schalte die Websuche für Antworten ein, die aktuelle Informationen brauchen, mit den Quellen unten aufgelistet. Sie läuft mit deinem eigenen API-Schlüssel, sodass die Nutzung auf dein OpenAI-Konto angerechnet wird, und falls du OpenAIs Ratenlimits erreichst, zeigt der Bildschirm deren Fehler.
    clicky: |-
      Deine Clicky-Website-Analysen, auf einem TRMNL ePaper-Display. Der Bildschirm zeigt Seitenaufrufe, Besucher und durchschnittliche Zeit auf der Seite, mit einem Chart der Seitenaufrufe pro Tag darunter.

      Gib die Site-ID und den Site-Key deiner Seite aus Clicky ein, und wähle dann, wie weit zurückgeblickt wird: 1, 7, 14 oder 30 Tage. Hast du mehr als 1 Seite? Füge die Erweiterung einmal pro Seite hinzu und kombiniere sie mit einem Mashup auf einem Bildschirm.
    clock: |-
      Eine Uhr für dein TRMNL ePaper-Display. Wähle analog mit Ziffernblatt und Zeigern, oder digital mit Siebensegment-Ziffern wie eine klassische LCD-Uhr, und lege die angezeigte Zeitzone fest. Sie kann den ganzen Bildschirm füllen, oder die Hälfte oder ein Viertel davon einnehmen.

      Das digitale Ziffernblatt zeigt die 24-Stunden-Zeit. Hast du Kollegen oder Familie in anderen Städten? Füge 1 Uhr pro Zeitzone hinzu. Setze Uhren dann in einen Mashup neben deinen Kalender oder das Wetter, sodass die Zeit genau dort sitzt, wo du schon hinschaust.
    close: |-
      Deine Close-CRM-Pipeline, auf einem TRMNL ePaper-Display. Verbinde dein Close-Konto, und wähle dann bis zu 3 Pipeline-Status zum Beobachten, wie „Active“ oder „Won“. Jeder Status erhält seine eigene Spalte mit Opportunities.

      Jede Opportunity zeigt den Namen des Leads, ihren Wert, und wer in deinem Team sie betreut. Wähle, wie weit zurückgeblickt wird: Opportunities, die in den letzten 7, 14 oder 30 Tagen aktualisiert wurden. Hänge sie an die Wand in der Nähe deines Vertriebsteams, und alle sehen, wo die Deals stehen.
    coinmarketcap: |-
      Live-Kryptopreise von CoinMarketCap, auf einem TRMNL ePaper-Display. Jede Münze zeigt ihr Symbol, ihren Namen, den aktuellen Preis und die Änderung über die letzten 24 Stunden.

      Füge deinen CoinMarketCap-API-Schlüssel hinzu, und gib dann die Symbole ein, die du beobachten möchtest, wie BTC oder ETH. Zeige 1 Münze groß und fett, oder bis zu 12 in einem Raster. Preise werden standardmäßig in US-Dollar angezeigt, oder wähle eine andere Währung wie EUR, GBP, JPY oder ZAR, umgerechnet mit einem höchstens einen Tag alten Wechselkurs.
    convertkit_analytics: |-
      Deine ConvertKit-Newsletter-Zahlen, auf einem TRMNL ePaper-Display. Eine Seite zeigt dein Konto: Abonnentenzahl und verkaufte Produkte. Die andere zeigt die Ergebnisse eines Broadcasts: Empfänger, Öffnungsrate, Klickrate, Klicks, Abmeldungen und Status.

      Füge deinen ConvertKit-API-Schlüssel und das API-Secret ein, und wähle dann einen Rückblick von 7, 30 oder 90 Tagen.
    custom_text: |-
      Deine eigenen Worte, auf einem TRMNL ePaper-Display. Ein Zitat, ein Ziel, eine Erinnerung, Wasser zu trinken. Tippe 1 Satz, oder mehrere, durch Semikolons getrennt, und du bekommst bei jeder Aktualisierung einen zufälligen.

      Markdown funktioniert, sodass du Fett, Kursiv oder eine Liste hinzufügen kannst, oder schalte es aus und zeige den Text genau wie eingegeben. Automatische Schriftskalierung passt die Textgröße an, um den Platz zu füllen, was für längere Passagen passt, oder behalte eine feste Größe. Richte links, mittig oder rechts aus, und füge deine eigene Zeile zur Titelleiste unten hinzu.
    days_left_retirement: |-
      Wie nah du an der Rente bist, auf einem TRMNL ePaper-Display. Gib deinen Geburtstag und das Alter ein, in dem du in Rente gehen möchtest, und der Bildschirm zeigt, wie weit du prozentual fortgeschritten bist, wie viele Wochen übrig sind, und einen Fortschrittsbalken, der sich mit den Jahren füllt.

      Das Zählen in Wochen macht die Zeit greifbar, und genau das ist der Punkt. Nimm sie in deine Wiedergabeliste als sanfte Erinnerung, die Wochen, die du hast, für das zu nutzen, was zählt.
    days_left_until: |-
      Ein Countdown zu jedem Datum, auf einem TRMNL ePaper-Display. Ein Launch, eine Reise, eine Deadline, eine Hochzeit. Lege ein Start- und ein Enddatum fest, und der Bildschirm zeigt die vergangenen Tage, die verbleibenden Tage, und einen Fortschrittsbalken, wie weit du schon gekommen bist.

      Interessiert dich nur 1 Zahl? Verstecke die vergangenen oder die verbleibenden Tage. Zählst du auf mehr als 1 Sache hinunter? Füge die Erweiterung einmal pro Datum hinzu.
    days_left_year: |-
      Das ganze Jahr auf einen Blick, auf einem TRMNL ePaper-Display. Jeder Tag des Jahres ist ein kleines Quadrat, Woche für Woche angeordnet. Vergangene Tage sind schattiert, heute ist durchgehend schwarz, und der Rest steht noch bevor. Über dem Raster stehen 2 Zahlen: vergangene und verbleibende Tage.

      Es gibt nichts einzurichten. Füge sie hinzu und speichere. Sie folgt dem Datum in der Zeitzone deines Kontos und beginnt am 1. Januar neu.
    days_since: |-
      Eine Zählung der Tage seit etwas, das dir wichtig ist, auf einem TRMNL ePaper-Display. Eine Gewohnheit, die du aufgegeben hast, der Tag, an dem du ein Unternehmen gegründet hast, das letzte Mal, dass jemand den Build kaputt gemacht hat. Der Bildschirm zeigt das Startdatum und die Anzahl der vergangenen Tage.

      Wähle das Startdatum und wie es geschrieben wird, von „26. November 2024“ bis 2024-11-26 oder 11/26/2024. Verfolgst du mehr als 1 Sache? Füge die Erweiterung einmal pro Datum hinzu und stelle sie mit einem Mashup auf einen Bildschirm.
    dropbox_photo_album: |-
      Verwandle dein TRMNL ePaper-Display in einen digitalen Bilderrahmen, gefüttert von Dropbox. Verbinde dein Dropbox-Konto, und wir erstellen einen App-Ordner für TRMNL in deinem Apps-Ordner. Lege Fotos dort ab, und jede Aktualisierung zeigt ein zufälliges, an den Bildschirm angepasst.

      TRMNL kann nur Dateien in diesem einen Ordner lesen und teilen, nie den Rest deiner Dropbox. Planst du ein Hochformat-Setup? Lade Hochformat-Fotos hoch, und passe Querformat-Bildschirme zu Querformat-Aufnahmen. Füge jederzeit Fotos hinzu oder entferne sie, und die Rotation folgt.
    eight_sleep: |-
      Deine Eight-Sleep-Daten, auf einem TRMNL ePaper-Display. Wach auf, schau rüber, und sieh, wie die Woche lief: eine Schlafscore-Anzeige für jeden der letzten 7 Tage, plus deinen Wochenscore mit einer einfachen Bewertung von Niedrig bis Gut.

      Daneben stehen deine Wochendurchschnitte für Schlafqualität, Schnarchen, Tiefschlaf, REM, Einschlafzeit und Gesamtschlaf. Die Einrichtung ist nur die E-Mail und das Passwort, die du in der Eight-Sleep-App nutzt. Eight Sleep hat keine offizielle API, also melden wir uns genauso an wie die App und lesen dieselben Zahlen. Diese Erweiterung nimmt den ganzen Bildschirm ein und kann daher nicht in einen Mashup.
    email_meter: |-
      Posteingangs-Analysen für dein Gmail, von Email Meter, auf einem TRMNL ePaper-Display. Sieh, wie viele Nachrichten du an wie viele Empfänger gesendet hast, wie viele du von wie vielen Absendern erhalten hast, und deine durchschnittliche Antwortzeit.

      Wähle ein Zeitfenster der letzten 1, 7 oder 30 Tage. Die Einrichtung braucht einen kleinen Trick: melde dich bei Email Meter an, öffne die Konsole deines Browsers, und kopiere dein Sitzungs-Token mit der Zeile, die das Einstellungsformular dir gibt (kein Programmieren nötig). Email Meter lässt dieses Token ablaufen, wenn deine Sitzung endet. Wenn der Bildschirm sagt, es wurde abgelehnt, hole ein frisches und füge es ein.
    enphase: |-
      Dein Enphase-Solarsystem, auf einem TRMNL ePaper-Display. Verbinde dein Enphase-Konto, wähle dein System, und der Bildschirm zeigt die heutige Produktionskurve, eine große Hauptzahl, und die Zeit, zu der dein System zuletzt gemeldet hat.

      Diese Hauptzahl wählst du: heute produziert, verbraucht, importiert oder exportiert, Netto-Import oder -Export, Spitzenleistung, was du gerade produzierst, Solaranteil, Netzabhängigkeit, Lebenszeitproduktion, oder Batterie. Wähle dann, welche weiteren Werte danebenstehen. Kleinere Layouts zeigen die ersten paar, die passen. Kein Verbrauchszähler installiert? Werte, die dein System nicht melden kann, werden übersprungen, nicht als null angezeigt.
    ethereum_wallet_balance: |-
      Der Kontostand deiner Ethereum-Wallet, auf einem TRMNL ePaper-Display. Füge eine öffentliche Wallet-Adresse ein, und der Bildschirm zeigt, was sie in US-Dollar wert ist, wie viel ETH sie enthält, und wie sich der ETH-Preis über die letzten 7 und 90 Tage bewegt hat, mit einem 90-Tage-Preischart.

      Nur die öffentliche Adresse wird eingegeben. Keine Schlüssel, keine Anmeldung, nichts, das dein Geld bewegen kann. Beobachtest du mehr als 1 Wallet? Füge die Erweiterung einmal pro Adresse hinzu.
    etsy: |-
      Die Verkäufe deines Etsy-Shops, auf einem TRMNL ePaper-Display. Verbinde dein Etsy-Konto, wähle deinen Shop, und sieh Gesamtverkäufe, durchschnittlichen Bestellwert, und wie viele Bestellungen offen oder erfüllt sind.

      Ein Chart stellt tägliche Verkäufe gegen den Zeitraum davor, sodass du auf einen Blick weißt, ob diese Woche besser läuft als die letzte. Wähle die letzten 7, 30 oder 90 Tage, oder den Monat bis heute. Stornierte Bestellungen werden ausgelassen, und noch nicht bezahlte Bestellungen zählen nicht zu den Verkäufen.
    fastmail_calendar: |-
      Dein Fastmail-Kalender, auf einem TRMNL ePaper-Display. Veröffentliche in Fastmail den Kalender über seine Einstellungen für Bearbeiten & Teilen, mit vollen Terminangaben oder nur frei/belegt, und füge den Link in die Erweiterung ein (tausche „webcal“ gegen „https“). Hast du mehr als 1 Kalender? Füge 1 Link pro Zeile hinzu. Lieber über dein Handy? Synchronisiere stattdessen von deinem iPhone oder iPad mit der TRMNL Companion App.

      Wähle dann ein Layout: die heutige Agenda, die nächsten paar Tage, eine Woche oder Arbeitswoche, ein Monatsraster oder einen minimalen Zeitplan. Zeige Terminzeiten und Beschreibungen, nutze 12- oder 24-Stunden-Zeit, zeige Kalenderfarben, und verstecke Termine mit bestimmten Wörtern darin. Wochen- und Monatsansichten können Wochenenden schattieren, heute hervorheben und Kalenderwochen zeigen.
    fera: |-
      Deine Fera-Bewertungen, auf einem TRMNL ePaper-Display. Oben: deine durchschnittliche Bewertung, Gesamtzahl der Bewertungen, der Anteil verifizierter, und wie viele Produkte Bewertungen haben. Darunter deine neuesten Bewertungen mit Sternen, Überschriften und Text.

      Verbinde dein Fera-Konto und wähle, welche Bewertungen gezeigt werden: genehmigt (Standard), wartet auf Genehmigung, wartet auf Aktualisierung, abgelehnt, oder wartend. TRMNL liest nur deine Bewertungen und kann nichts bearbeiten. Du kannst sie jederzeit von der Fera-Seite aus trennen.
    gaffa: |-
      Deine eigene Nachrichten-Titelseite, auf einem TRMNL ePaper-Display, erstellt von Gaffas KI. Gib ihr die Adresse einer Nachrichtenseite, und Gaffa liest die Seite, wählt die wichtigsten Geschichten, und schreibt für jede eine kurze Zusammenfassung. Du bekommst eine nummerierte Liste von Schlagzeilen mit 1 oder 2 Zeilen Kontext.

      Steuere die Zusammenfassungen mit deinem eigenen Prompt, wie „Fokus auf globale Ereignisse, Clickbait überspringen“, und tausche die Titelleisten-Bezeichnung gegen deine eigene. Gaffas kostenlose Testphase deckt die ersten 6 Monate ab. Danach füge deinen eigenen Gaffa-API-Schlüssel ein, um weiterzumachen.
    github_commit_graph: |-
      Dein GitHub-Beitragsdiagramm, auf einem TRMNL ePaper-Display. Gib deinen GitHub-Benutzernamen ein (ohne @), und der Bildschirm zeichnet das vergangene Jahr an Aktivität als Raster aus Quadraten, dunkler an den Tagen, an denen du mehr getan hast.

      Daneben: Gesamtbeiträge im letzten Jahr, deine längste und aktuelle Serie, dein aktivster Tag, und dein Durchschnitt pro Tag. Nichts zu verbinden und kein Token nötig, nur der Benutzername. Willst du auch das Diagramm eines Teamkollegen? Füge die Erweiterung mit ihrem Benutzernamen erneut hinzu.
    github_commits: |-
      Die neuesten Commits an jedes GitHub-Repository, auf einem TRMNL ePaper-Display. Jede Zeile zeigt die Commit-Nachricht, wer sie geschrieben hat, Datum und Uhrzeit, und den kurzen Commit-Hash.

      Gib das Repository als org/repo ein, oder füge einfach seinen GitHub-Link ein. Lass den Branch leer, um dem Standard-Branch zu folgen, oder benenne einen zum Beobachten. Öffentliche Repositories brauchen nichts weiter. Für ein privates Repository wechsle die Sichtbarkeit auf privat und füge ein fein abgestuftes Token mit Lesezugriff auf den Inhalt des Repositorys hinzu. Hakt GitHub, bleibt die letzte gute Liste auf dem Bildschirm.
    github_contributor_summary: |-
      Wer an deinem GitHub-Repository mitwirkt, auf einem TRMNL ePaper-Display. Eine Tabelle listet jeden Mitwirkenden mit seinem Namen, seinen Commits der letzten Woche und seinen Lebenszeit-Commits, sodass du auf einen Blick siehst, wer aktiv ist.

      Gib das Repository als benutzername/repository ein, und füge ein fein abgestuftes Zugriffstoken aus deinen GitHub-Einstellungen hinzu. Lesezugriff auf Repository-Metadaten ist alles, was nötig ist. Das Token wird auf GitHub nur einmal angezeigt, also kopiere es direkt in TRMNL. Verfolgst du mehr als 1 Repository? Füge die Erweiterung einmal pro Repository hinzu.
    google_analytics: |-
      Deine Google-Analytics-Zahlen, auf einem TRMNL ePaper-Display. Sieh Seitenaufrufe, Sitzungen, Besucher und durchschnittliche Sitzungsdauer, mit einem Chart der täglichen Seitenaufrufe darunter.

      Verbinde dein Google-Konto, gib die Property-ID der Seite ein, die du beobachten möchtest, und wähle einen Rückblick von 7, 30 oder 90 Tagen. Die Daten können bis heute oder bis gestern laufen. Wähle gestern, und der Chart fällt am Ende nicht ab, nur weil heute noch nicht vorbei ist. Beobachtest du mehr als 1 Seite? Füge die Erweiterung einmal pro Property hinzu.
    google_calendar: |-
      Dein Google Kalender, auf einem TRMNL ePaper-Display. Melde dich mit Google an, wähle die Kalender, die dir wichtig sind, und fertig. Hast du ein Arbeits- und ein privates Konto? Verbinde mehr als ein Google-Konto und stelle ihre Kalender auf denselben Bildschirm.

      Wähle dann ein Layout, das zu deiner Planung passt: die heutige Agenda, die nächsten paar Tage, eine Woche oder Arbeitswoche, ein Monatsraster, oder einen minimalen Zeitplan. Zeige Terminzeiten und Beschreibungen, nutze 12- oder 24-Stunden-Zeit, verstecke Termine mit bestimmten Wörtern darin, oder zeige nur Termine, die du angenommen hast. Du kannst eine Linie hinzufügen, die die aktuelle Zeit markiert, und Wochen- und Monatsansichten können auch Wochenenden schattieren, heute hervorheben, und Kalenderwochen zeigen.
    google_drive_photos: |-
      Verwandle einen Google-Drive-Ordner in einen Bilderrahmen für dein TRMNL ePaper-Display. Jede Aktualisierung wählt ein zufälliges Bild aus dem Ordner: JPEG, PNG, GIF, BMP, WebP oder TIFF.

      Keine Google-Anmeldung nötig. Teile den Ordner mit der in den Einstellungen gezeigten TRMNL-E-Mail-Adresse, als Betrachter, und füge dann den Link des Ordners ein. TRMNL sieht nur, was du teilst. Fotos direkt in diesem Ordner kommen in die Rotation, Unterordner nicht. Wähle Cover, um den Bildschirm zu füllen (Ränder können beschnitten werden), oder Contain, um das ganze Bild mit Rand darum zu zeigen.
    google_photos: |-
      Fotos aus deiner Google-Fotos-Bibliothek, auf einem TRMNL ePaper-Display. Verbinde dein Google-Konto, und wähle dann die Fotos, die du möchtest, in Googles eigener Fotoauswahl von Hand aus. Jede Aktualisierung zeigt ein zufälliges davon.

      TRMNL sieht nur die Fotos, die du ausgewählt hast, nichts anderes aus deiner Bibliothek. Wähle Cover, um den Bildschirm zu füllen (Ränder können beschnitten werden), oder Contain, um das ganze Foto mit Rand darum zu zeigen. Google beendet diesen Zugriff nach 7 Tagen, sodass du von Zeit zu Zeit erneut auswählst. Die Einstellungsseite zeigt, wann er abläuft.
    google_tasks: |-
      Deine Google Tasks, auf einem TRMNL ePaper-Display. Verbinde dein Google-Konto, wähle eine Aufgabenliste, und der Bildschirm zeigt, was noch offen ist, mit Fälligkeitsdaten. Erledigte Aufgaben bleiben außen vor.

      Sortiere nach Fälligkeitsdatum, oder behalte die Reihenfolge, die du in der App festgelegt hast. Unteraufgaben stehen direkt unter ihrer übergeordneten Aufgabe, eingerückt, sodass du sie unterscheiden kannst. Du kannst die Liste auch oben, mittig oder unten in ihrem Bereich ausrichten. Hast du eine Arbeits- und eine private Liste? Füge die Erweiterung einmal pro Liste hinzu und stelle sie nebeneinander in einen Mashup.
    gumroad_analytics: |-
      Deine Gumroad-Verkäufe, auf einem TRMNL ePaper-Display. 2 große Zahlen: wie viele Verkäufe du gemacht hast und was sie wert waren.

      Verbinde dein Gumroad-Konto und wähle einen Rückblickzeitraum von 7, 30 oder 90 Tagen. Das ist die ganze Einrichtung. Willst du diese Woche und dieses Quartal nebeneinander? Füge die Erweiterung zweimal hinzu, einmal mit 7 Tagen und einmal mit 90. Stell sie irgendwohin, wo du sie bei der Arbeit siehst, und lass die Zahlen dich ehrlich halten.
    hacker_news: |-
      Was die Tech-Community gerade liest, auf einem TRMNL ePaper-Display. Der Bildschirm listet Hacker-News-Geschichten in Reihenfolge, jede mit Titel, Stimmenzahl und wer sie gepostet hat. Auf dem Vollbildschirm fließen sie in 2 Spalten.

      Die Einrichtung ist 1 Wahl. Top Stories zeigt die Geschichten, die gerade am höchsten bei Hacker News stehen. Show HN zeigt Dinge, die Leute gebaut haben und die du ausprobieren sollst (wir lassen das Präfix „Show HN:“ bei den Titeln weg, du weißt es ja schon). Stell sie in einen Mashup, und sie füllt die Hälfte oder ein Viertel des Bildschirms.
    home_assistant_screenshot: |-
      Deine Home-Assistant-Dashboards, auf einem TRMNL ePaper-Display. Diese Erweiterung läuft zusammen mit dem TRMNL-HA-Add-on, das deine Dashboards innerhalb deines eigenen Netzwerks fotografiert, sie für ePaper vorbereitet, und sie an eine private Webhook-URL sendet, die die Erweiterung dir gibt. Nichts greift von außen in dein Netzwerk ein.

      Installiere das Add-on aus dem Home-Assistant-Add-on-Store, oder betreibe es als eigenen Container, falls du Home Assistant in Docker nutzt. Erstelle im Add-on einen Zeitplan, wähle deine Geräte-Voreinstellung, und füge die Webhook-URL ein. Wähle dann in TRMNL, ob das Bild seinen Platz füllt oder in voller Größe angezeigt wird, wenn es sich den Bildschirm mit anderen Erweiterungen teilt, und welche Farbe leeren Platz um es herum füllt.
    homey: |-
      Dein Homey-Smart-Home, auf einem TRMNL ePaper-Display. Overview führt mit Messwerten wie Strom, Temperatur und Feuchtigkeit, listet aktive Alarme, und zeigt dann deine Geräte. Batteries listet jedes batteriebetriebene Gerät, das leerste zuerst. Insights zeichnet einen aufgezeichneten Messwert über die letzte Stunde, den letzten Tag, die letzte Woche oder den letzten Monat.

      Es gibt 2 Wege, Daten zu übertragen. Installiere die TRMNL-App für Homey (oder ein HomeyScript) und füge die Push-URL der Erweiterung ein. Oder verknüpfe dein Homey-Konto, sodass TRMNL aus Homeys Cloud liest, und wähle dann, welches Homey gezeigt wird. Zeige jede Zone, oder nur einen Raum. Diese Erweiterung betreibt auch die Homey-Blaupausen im TRMNL-Katalog.
    hubspot: |-
      Deine HubSpot-Deals, auf einem TRMNL ePaper-Display. Verbinde dein HubSpot-Konto, wähle eine Vertriebspipeline, und wähle dann bis zu 3 Deal-Phasen zum Beobachten.

      Jede Phase erhält ihre eigene Spalte mit ihren Deals nach Namen, mit Deal-Betrag und Besitzer. Es ist ein schneller Überblick, wo die Pipeline steht, ohne das CRM zu öffnen. Willst du mehr Phasen, oder eine zweite Pipeline? Füge die Erweiterung erneut hinzu und kombiniere sie mit einem Mashup auf einem Bildschirm.
    huckleberry: |-
      Der Tag deines Babys aus Huckleberry, auf einem TRMNL ePaper-Display. Der Bildschirm zeigt den Namen und das Alter deines Kindes, ob es schläft oder wach ist und seit wann, und das nächste SweetSpot-Nickerchen oder die Schlafenszeit. Darunter folgen die letzte Flasche, Stillen, feste Nahrung und Windel, sowie der geplante Tagesablauf.

      Melde dich mit derselben E-Mail und demselben Passwort an, die du in der Huckleberry-App nutzt, speichere, und wähle dann, welches Kind gezeigt wird. Huckleberry hat keine offizielle API, also melden wir uns genauso an wie die App und lesen dieselben Daten, die sie dir zeigt. Verfolgst du 2 Kinder? Füge die Erweiterung einmal pro Kind hinzu und stelle sie nebeneinander in einen Mashup.
    image_display: |-
      Jedes Bild im Web, auf einem TRMNL ePaper-Display. Gib eine Bildadresse ein, und TRMNL wandelt es passend zu deinem Bildschirm um. Füge weitere Adressen hinzu, 1 pro Zeile, und du bekommst bei jeder Aktualisierung eine zufällige. Google-Drive-Share-Links funktionieren direkt, sodass Drive dein Bild-Host sein kann.

      Nutze es für ein Foto, einen Chart oder ein Dashboard, das ein anderes System ausspuckt, oder einen Kamera-Schnappschuss. Fülle den Bildschirm, passe ihn mit einer Hintergrundfarbe drumherum ein, oder strecke ihn, um ihn zu füllen. Hostest du auf einem Heimserver mit selbstsigniertem Zertifikat? Lass TRMNL es trotzdem abrufen. Und sendet dein Server ETag- oder Last-Modified-Header, zeichnet TRMNL nur neu, wenn sich das Bild tatsächlich ändert.
    kickstarter: |-
      Crowdfunding-Projekte, die einen Blick wert sind, auf einem TRMNL ePaper-Display. Jedes Projekt auf der Liste zeigt seinen Namen, einen kurzen Teaser, wie viel Prozent seines Ziels es bereits erreicht hat, den zugesagten Betrag in US-Dollar, und das Land, aus dem es kommt.

      Wähle Top, um die laufenden Projekte zu sehen, die am meisten eingesammelt haben, oder Ending Soon für Kampagnen, die bald schließen, falls du etwas unterstützen willst, bevor die Zeit abläuft. Das ist die einzige Einstellung.
    language_learning: |-
      Ein Wort in der Sprache, die du lernst, auf einem TRMNL ePaper-Display. Der Bildschirm zeigt das Wort in dieser Sprache, was es auf Englisch bedeutet, und einen Beispielsatz, der es verwendet.

      Wähle aus 13 Sprachen: brasilianisches Portugiesisch, Dänisch, Niederländisch, Englisch, Französisch, Griechisch, Italienisch, Japanisch, Koreanisch, Norwegisch, Spanisch, Schwedisch oder Türkisch. Jede Aktualisierung bringt dich zum nächsten Wort in einer Liste von Tausenden Alltagswörtern, und TRMNL merkt sich deinen Platz. Willst du länger bei 1 Wort bleiben? Stelle eine langsamere Aktualisierungsrate ein.
    letterboxd: |-
      Dein Letterboxd-Tagebuch, auf einem TRMNL ePaper-Display. Melde dich mit Letterboxd an, und der Bildschirm listet die Filme, die du zuletzt eingetragen hast, mit dem Datum, an dem du geschaut hast, dem Erscheinungsjahr, deiner Sternebewertung, einem Herz, falls es dir gefallen hat, und einem Rewatch-Tag. Größere Layouts fügen das Poster deines neuesten Films hinzu.

      Neugierig, was alle anderen gerade schauen? Wechsle in den Friends-Modus für aktuelle Tagebucheinträge und Rezensionen von den Leuten, denen du folgst, jede mit wer es eingetragen hat, ihrer Bewertung, und dem Poster, wo Platz ist.
    lunar_calendar: |-
      Wo der Mond in seinem Zyklus steht, auf einem TRMNL ePaper-Display. Der Bildschirm führt mit der aktuellen Phase, wie viel vom Mond beleuchtet ist, und seinem Alter in Tagen. Darunter läuft eine Zeitleiste der Phasen rund um heute mit ihren Daten, dann die nächste Phase, der nächste Vollmond und der nächste Neumond.

      Es gibt 1 Einstellung: Detailed zeichnet realistische Mondbilder, und Simple nutzt klare Symbole. Kein Standort nötig. Daten folgen der Zeitzone deines Kontos.
    lunch_money: |-
      Deine Lunch-Money-Finanzen, auf einem TRMNL ePaper-Display. Erstelle ein Zugriffstoken in Lunch Moneys Entwicklereinstellungen, füge es ein, und wähle dann, was du sehen möchtest.

      Budgets zeigt die bisherigen Ausgaben dieses Monats pro Kategorie, die größte zuerst, mit einem Chart der Ausgaben gegen dein Budget. Wähle übergeordnete oder untergeordnete Kategorien, damit gruppierte Ausgaben nicht doppelt gezählt werden. Accounts listet die Kontostände deiner verknüpften Konten und Vermögenswerte, Verbindlichkeiten eingeschlossen. Net Worth zeigt, wo du heute stehst, wie viel sich das geändert hat, und einen Chart der Vermögenswerte und Verbindlichkeiten über die letzten 3, 6, 9 oder 12 Monate. Beträge werden in deiner Lunch-Money-Hauptwährung angezeigt.
    mailchimp_analytics: |-
      Deine Mailchimp-Zielgruppenstatistiken, auf einem TRMNL ePaper-Display. Verbinde dein Mailchimp-Konto und wähle die Zielgruppe, die du beobachten möchtest.

      Recent Activity stellt gesendete E-Mails und Öffnungsrate nach oben, dann eindeutige Öffnungen, Klicks, harte und weiche Bounces, neue Abonnenten und Abmeldungen. Growth History behält gesendete E-Mails und Öffnungsrate, und tauscht den Rest gegen einen Chart deiner Abonnentenzahl Monat für Monat. Betreibst du mehr als 1 Newsletter? Füge die Erweiterung einmal pro Zielgruppe hinzu.
    mazevo: |-
      Verwandle ein TRMNL ePaper-Display in ein Raumschild für jeden Raum, den du in Mazévo buchst. Auf einen Blick sagt es, ob der Raum belegt ist, mit dem Namen und der Zeit der aktuellen Buchung, oder dass er verfügbar ist und bis wann. Der Rest der heutigen Buchungen steht darunter.

      Verbinde dich mit einem Mazévo-API-Schlüssel und einer API-URL, die Organisations- und private Buchungen unterstützt, oder mit dem iCal-Feed eines Mazévo-Kalenders, der nur Terminnamen und -zeiten zeigt. Wähle den Raum, vor dem die Anzeige hängt. Dann mach sie zu deiner: tausche den Raumnamen gegen deine eigene Überschrift, ändere das „Available“-Label, füge unten eine einzeilige Notiz hinzu, zeige oder verstecke bereits beendete Buchungen, und nutze 12- oder 24-Stunden-Zeit. Private Buchungen werden als privat gezeigt, ohne Namen.
    microsoft_todo: |-
      Deine Microsoft-To-Do-Aufgaben, auf einem TRMNL ePaper-Display. Melde dich mit deinem Microsoft-Konto an, und wähle die Liste, die gezeigt werden soll.

      Der Bildschirm listet jede unerledigte Aufgabe darauf, mit ihrem Fälligkeitsdatum und einer kurzen Vorschau etwaiger Notizen. Erledigte Aufgaben fallen weg, sodass du nur siehst, was noch übrig ist. Du kannst Aufgaben auch oben, mittig oder unten im Bildschirm ausrichten. Hast du eine Arbeitsliste und eine Einkaufsliste? Füge die Erweiterung einmal pro Liste hinzu und zeige beide in einem Mashup.
    mondrian: |-
      Generative Kunst im Stil von Piet Mondrian, auf einem TRMNL ePaper-Display. Jedes Mal, wenn der Bildschirm gezeichnet wird, teilt er sich in ein zufälliges Raster aus dicken schwarzen Linien und gefüllten Blöcken, sodass keine 2 Darstellungen gleich aussehen.

      Es gibt nichts einzurichten. Füge sie zu einer Wiedergabeliste hinzu für eine Pause zwischen deinen Datenbildschirmen, oder setze sie als kleines Kunstwerk neben deinen Kalender oder das Wetter in einen Mashup.
    motivational_quote: |-
      Ein motivierendes Zitat für den Tag, auf einem TRMNL ePaper-Display. Der Bildschirm zeigt das Zitat in großer Schrift mit dem Namen des Autors darunter. Zitate kommen von ZenQuotes' Zitat des Tages, ändern sich also täglich, und alle sehen dasselbe.

      Es gibt nichts einzurichten. Füge sie zu einer Wiedergabeliste hinzu, oder stell sie neben deinen Kalender in einen Mashup, als etwas zum Nachdenken zwischen Meetings.
    nano_banana_dashboard: |-
      Deine TRMNL-Daten, neu gezeichnet als Bild von Googles Gemini-Bildmodellen (den mit dem Spitznamen Nano Banana). Wähle bis zu 3 deiner anderen Erweiterungen als Datenquellen, und Gemini verwandelt ihre Daten in eine Szene: eine Zeitungs-Titelseite, eine Café-Kreidetafel-Speisekarte, einen Kontrollraum, und mehr.

      Du bringst deinen eigenen Gemini-API-Schlüssel aus Google AI Studio mit, mit eingerichteter Abrechnung, und wählst Flash, Flash 2.5 oder Pro. Gestalte sie dann: füge deinen eigenen Text hinzu, lege fest, welche Daten im Vordergrund stehen, wähle eine Szene oder Random, füge Stilhinweise hinzu, und stelle das Seitenverhältnis ein. Power-User können den ganzen Prompt selbst schreiben. Ein neues Bild wird nur erstellt, wenn sich deine Einstellungen oder Daten ändern.
    netatmo_weather_station: |-
      Messwerte deiner Netatmo-Wetterstation, auf einem TRMNL ePaper-Display. Melde dich bei Netatmo an, um TRMNL Lesezugriff zu geben, und wähle dann deine Station und, falls du möchtest, welches Modul die Innenwerte liefert.

      Basic führt mit der Außentemperatur und einem Temperaturchart, dann Innentemperatur, Feuchtigkeit und CO2, sowie Außenfeuchtigkeit, Luftdruck, Lärm und das Tagestief und -hoch. Hast du den Regen- oder Windmesser? Diese Messwerte tauchen dann auch auf. Graph füllt den Platz mit nur 1 Messwert: Temperatur, Feuchtigkeit, CO2, Lärm, Luftdruck, Regen oder Wind. Wähle Fahrenheit oder Celsius, und Knoten für Wind, falls bevorzugt.
    nextcloud_calendar: |-
      Dein Nextcloud-Kalender, auf einem TRMNL ePaper-Display. Teile deinen Kalender in Nextcloud als Link und füge ihn ein (weitere hinzufügen, 1 pro Zeile), oder synchronisiere von deinem iPhone oder iPad mit der TRMNL Companion App.

      Wähle dann ein Layout: die heutige Agenda, die nächsten paar Tage, eine Woche, eine rollierende Woche, Arbeitswoche oder 3-Tage-Woche, ein Monats- oder rollierendes Monatsraster, oder einen minimalen Zeitplan. Zeige Terminzeiten und Beschreibungen, nutze 12- oder 24-Stunden-Zeit, zeige Kalenderfarben, und verstecke Termine mit bestimmten Wörtern darin. Wochen- und Monatsansichten können Wochenenden schattieren, heute hervorheben, Kalenderwochen zeigen, und eine Linie bei der aktuellen Zeit ziehen.
    notion: |-
      Deine Notion-Datenbanken und -Seiten, auf einem TRMNL ePaper-Display. Verbinde Notion mit Lesezugriff, wähle, welche Inhalte TRMNL sehen darf, und wähle dann 1 Datenbank oder 1 Seite zum Anzeigen.

      Bei einer Datenbank wählst du, welche Eigenschaft der Titel ist, welche als großes Status-Badge gezeigt wird, und welche als kleinere Labels oder einfache Details darunter erscheinen. Sortiere nach jeder Eigenschaft, filtere mit Notions eigener Filtersyntax (dynamische Daten wie „heute plus 7“ funktionieren auch), lege fest, wie viele Einträge gezeigt werden, und nutze 1 oder 2 Spalten. Bei einer Seite zeigt der Bildschirm ihren Inhalt in Reihenfolge: Text, Überschriften, Listen, Bilder und mehr.
    outlook_calendar: |-
      Dein Outlook-Kalender, auf einem TRMNL ePaper-Display. Melde dich mit deinem Microsoft-Konto an und wähle, welche Kalender gezeigt werden. Lässt du es leer, nutzen wir deinen Standardkalender.

      Wähle ein Layout: die heutige Agenda, die nächsten paar Tage, eine Woche oder Arbeitswoche, ein Monatsraster, oder einen minimalen Zeitplan. Zeige Terminzeiten und Beschreibungen, nutze 12- oder 24-Stunden-Zeit, verstecke Termine mit bestimmten Wörtern darin, und zeige nur Termine, die du angenommen hast. Wochen- und Monatsansichten können Wochenenden schattieren, heute hervorheben, und Kalenderwochen zeigen. Und planst du deinen Tag Stunde für Stunde, hält dich eine Linie für die aktuelle Zeit ehrlich.
    parcel: |-
      Deine Paketlieferungen aus der Parcel-App, auf einem TRMNL ePaper-Display. Jede Lieferung zeigt ihren Status, wie unterwegs oder zur Zustellung, ihren Namen, das letzte Tracking-Ereignis, und wann sie erwartet wird: heute, morgen, ein Wochentag oder ein Datum.

      Du brauchst ein kostenpflichtiges Parcel-Abo. Melde dich auf web.parcelapp.net an, erstelle einen API-Schlüssel, und füge ihn ein. Zeige aktive oder aktuelle Lieferungen, wähle den Detailed- oder den Compact-Stil, der das Tracking-Ereignis weglässt, und entscheide, was passiert, wenn nichts unterwegs ist: den leeren Bildschirm zeigen, oder ihn überspringen.
    place_of_the_day: |-
      Ein neuer Ort auf deinem TRMNL ePaper-Display, jeden Tag: eine Stadt oder ein Weltwunder. Jeder Bildschirm zeigt den Namen des Ortes, Region und Land, eine Karte seiner Straßen, und eine kurze Beschreibung, meist aus Wikipedia. Wenn die Daten existieren, bekommst du auch Fakten wie Bevölkerung, Gründungsjahr, Höhenlage, Fläche, Ortszeit und Koordinaten.

      Es gibt nichts einzurichten. Alle mit der Erweiterung sehen an einem bestimmten Tag denselben Ort, und die Auswahl rotiert zwischen Europa, Amerika und dem Rest der Welt.
    poetry_today: |-
      Ein Gedicht auf deinem TRMNL ePaper-Display, mit dem Titel oben und dem Namen des Dichters in der Ecke. Jede Aktualisierung zieht zufällig ein neues aus PoetryDB, einer öffentlichen Sammlung klassischer Gedichte.

      Es gibt nichts einzurichten. Füge die Erweiterung hinzu, und du bist fertig. Wir wählen nur Gedichte, die kurz genug für den Bildschirm sind (höchstens 24 Zeilen), sodass du kein halbes Sonett mittendrin abgeschnitten bekommst. Gut neben einer Uhr oder einem Kalender in einem Mashup, wenn du etwas Langsameres lesen möchtest als deinen Posteingang.
    polymarket: |-
      Polymarket-Prognosemärkte, auf einem TRMNL ePaper-Display. Wähle ein Thema, und der Bildschirm listet bis zu 12 offene Märkte darin, jeder mit seiner Frage, wie viele Kommentare er hat, und wie viel Geld darauf steht.

      Themen umfassen Business, Popkultur, Sport, Krypto, Wissenschaft und Politik. Kein Polymarket-Konto nötig. Wir zeigen nur Märkte, die noch aktiv sind und innerhalb der nächsten 2 Wochen schließen, sodass du Wetten siehst, die bald entschieden werden, nicht solche, die bis nächstes Jahr laufen. Willst du ein Thema, das nicht in der Liste ist? Schreib dem Support mit der Polymarket-Tag-ID, und wir fügen es deinem Konto hinzu.
    postmark_analytics: |-
      Deine Postmark-E-Mail-Statistiken, auf einem TRMNL ePaper-Display. Füge ein Server-API-Token aus deinem Postmark-Server ein, und wähle, wie weit zurückgeblickt wird: 7, 30 oder 90 Tage.

      Die großen Zahlen sind gesendete E-Mails und Öffnungsrate. Darunter bekommst du eindeutige Öffnungen, Klicks, Bounces, Fehler, Spam-Beschwerden und Bounce-Rate. Praktisch auf einem Schreibtisch in einem Ops- oder Support-Team, sodass ein Anstieg bei Bounces oder Spam-Beschwerden auffällt, bevor ein Kunde fragt, warum sein Passwort-Reset nie angekommen ist.
    private_plugin: |-
      Baue deinen eigenen Bildschirm für ein TRMNL ePaper-Display. Schreibe ihn in HTML mit Liquid-Templates und dem TRMNL-Design-Framework, und entscheide dann, wie Daten dort hinkommen: TRMNL fragt eine URL ab, die JSON, XML oder Klartext zurückgibt, dein eigener Code sendet Daten an einen Webhook, du gibst statisches JSON ein, oder du nutzt Daten deiner anderen TRMNL-Erweiterungen wieder.

      Polling unterstützt GET oder POST, eigene Header, einen Request-Body, und OAuth für Dienste, bei denen du dich anmelden musst. Füge eigene Formularfelder hinzu, damit andere Leute deine Erweiterung konfigurieren können, ohne Code zu berühren, wandle die Daten mit einem Skript in Node, PHP, Python oder Ruby um, und wenn es fertig ist, teile sie als Blaupause.
    product_hunt: |-
      Product Hunts vorgestellte Launches, auf einem TRMNL ePaper-Display. Jeder zeigt seinen Namen, einen kurzen Slogan, und seine Stimmenzahl, in einer nummerierten Liste.

      Es gibt nichts zu verbinden und kein Konto nötig. Füge die Erweiterung hinzu, und die Liste hält sich selbst aktuell. Baust du selbst etwas? Behalte im Auge, was gerade startet (und wie viele Stimmen es braucht, um aufzufallen), ohne einen weiteren Tab zu öffnen. Sie passt auf einen Vollbildschirm, die Hälfte, oder ein Viertel neben deinen anderen Erweiterungen.
    profit_well: |-
      Deine ProfitWell-Umsatzzahlen, auf einem TRMNL ePaper-Display. Füge dein ProfitWell-API-Token ein, und der Bildschirm zeigt die heutigen Zahlen aus deinem Konto.

      Oben: neue wiederkehrende Umsätze und Gesamt-wiederkehrende Umsätze. Darunter: verlorene Umsätze, aktive Kunden, neue Kunden und verlorene Kunden. Betreibst du ein SaaS-Geschäft? Stell sie dorthin, wo du sie jeden Morgen siehst, damit sich ein schlechter Kündigungstag nicht in einem Dashboard versteckt, das du vergessen hast zu öffnen.
    proton_calendar: |-
      Dein Proton-Kalender, auf einem TRMNL ePaper-Display. Es gibt 2 Wege: teile deinen Proton-Kalender als Link und füge diese .ics-Adresse in die Erweiterung ein, oder synchronisiere von deinem iPhone oder iPad mit der TRMNL Companion App. Sorgen um die Privatsphäre? Proton lässt dich einen Link teilen, der nur zeigt, dass du beschäftigt bist, nicht worum es im Termin geht.

      Wähle dann ein Layout: die heutige Agenda, die nächsten paar Tage, eine Woche, eine rollierende Woche, Arbeitswoche oder 3-Tage-Woche, ein Monatsraster, oder einen minimalen Zeitplan. Zeige Terminzeiten und Beschreibungen, nutze 12- oder 24-Stunden-Zeit, verstecke Termine mit bestimmten Wörtern darin, und starte deine Woche an einem beliebigen Tag. Wochen- und Monatsansichten können Wochenenden schattieren, heute hervorheben, und Kalenderwochen zeigen.
    purpleair: |-
      Messwerte eines PurpleAir-Sensors, auf einem TRMNL ePaper-Display. Nutze deinen eigenen Sensor oder einen öffentlichen auf der PurpleAir-Karte. Gib seine Sensor-ID und einen PurpleAir-API-Schlüssel ein, sowie einen Lese-Schlüssel, falls der Sensor privat ist.

      Wähle, was gezeigt wird. Air quality zeigt aktuelles PM2.5 und PM10, mit einem Chart der letzten 24 Stunden, markiert gegen die EPA-Luftqualitätsstufen, von Good bis Very Unhealthy. Temperature and humidity zeigt stattdessen diese beiden, in Fahrenheit oder Celsius. Wir fragen PurpleAir nur nach dem, was sich seit der letzten Aktualisierung geändert hat, sodass deine kostenlosen API-Guthaben lange reichen.
    readwise: |-
      Deine Readwise-Highlights, auf einem TRMNL ePaper-Display. Hol dir ein Zugriffstoken von Readwise, füge es in die Erweiterung ein, und fertig.

      Jede Aktualisierung zeigt 1 Highlight aus deinem täglichen Readwise-Rückblick, mit dem Titel des Buchs oder Artikels, aus dem es stammt, und dem Autor. Die nächste Aktualisierung geht zum nächsten weiter. Es ist ein stiller Weg, die Passagen, die du gespeichert hast, wirklich noch einmal zu besuchen, statt sie in einer App anzusammeln, die du nie öffnest.
    reddit: |-
      Top-Beiträge aus deinen bevorzugten Subreddits, auf einem TRMNL ePaper-Display. Verbinde dein Reddit-Konto, und liste dann bis zu 3 Subreddits auf. Jeder bekommt seine eigene Spalte.

      Sortiere nach Hot, New oder Top, und wähle das Zeitfenster, von der letzten Stunde bis zur gesamten Zeit. Angepinnte Beiträge werden übersprungen, da sie sich selten ändern. Zeige die Stimmenzahl und den Benutzernamen des Posters unter jedem Titel, oder verstecke sie. Kürze lange Titel auf 1 Zeile, und du passt mehr Beiträge auf den Bildschirm.
    redirect: |-
      Ein Werkzeug für Entwickler, die ihre eigenen Bilder erstellen. Wenn dein TRMNL ePaper-Display sich meldet, rufen wir eine URL auf deinem Server auf und geben ihre Antwort direkt an das Gerät weiter: wo das Bild zu holen ist, ein Dateiname, und wie lange es schlafen soll, bis es sich wieder meldet.

      Das bedeutet, dein Server entscheidet bei jedem Check-in, was gezeigt wird und wann. Die Bildadresse kann sich bei jeder Anfrage ändern, und kann sogar in deinem lokalen Netzwerk liegen. Sende denselben Dateinamen zweimal, und der Bildschirm zeichnet nicht neu, was Flackern und Akku spart. Die Schlafzeit liegt bei dir, bis hinunter zu 1 Minute. Nutzt du schon Alias und willst mehr Kontrolle? Das ist der nächste Schritt.
    rss_feed: |-
      Jeder RSS- oder Atom-Feed, auf einem TRMNL ePaper-Display. Füge die Adresse des Feeds ein und wähle ein Layout.

      Featured zeigt den neuesten Beitrag, mit Titel, Text und Bildern. List zeigt bis zu 8 aktuelle Beiträge, jeder mit Titel und einer kurzen Klartext-Zusammenfassung. Folgst du einem Blog, einer Nachrichtenseite, einem Podcast oder einem Forum, das noch einen Feed hat? Hänge ihn an die Wand. Betreibst du den Feed auf einem Heimserver mit selbstsigniertem Zertifikat? Lass TRMNL ihn trotzdem abrufen.
    screen_wiper: |-
      Räumt Ghosting auf deinem TRMNL ePaper-Display auf. Ghosting ist der schwache Rest alter Bilder, den ePaper mit der Zeit ansammeln kann. Erreicht dein Gerät Screen Wiper in seiner Wiedergabeliste, läuft eine spezielle Reihe von Zyklen, die den Bildschirm zwischen Schwarz und Weiß umschalten, und macht dann mit dem nächsten Eintrag weiter.

      Füge die Erweiterung hinzu und speichere. Das war's. Je nach Gerät blinkt das Wischen 30 bis 60 Sekunden, oder bis zu 5 Minuten. Nutze den Zeitplaner, um es einmal täglich oder einmal pro Woche laufen zu lassen, idealerweise direkt nachdem dein Gerät aus dem Schlaf aufwacht. Es braucht Firmware 1.8.14 oder neuer.
    screensaver: |-
      Kunst für dein TRMNL ePaper-Display. Jede Aktualisierung wählt ein zufälliges Bild aus unserer kleinen Bildschirmschoner-Bibliothek: denk an die Mona Lisa, Rom, die Apollo-Missionen und eine Raumstation, alle so aufbereitet, dass sie auf ePaper scharf aussehen.

      Es gibt nichts einzurichten. Füge sie zu deiner Wiedergabeliste hinzu, wenn der Bildschirm gut aussehen statt geschäftig wirken soll, wie zwischen Meetings oder über Nacht. Die Sammlung ist klein, wächst aber, und wir nehmen Einsendungen an. Hast du ein Bild, das du gern darin sehen würdest? Schreib an support@trmnl.com.
    screenshot: |-
      Jede öffentliche Webseite, auf einem TRMNL ePaper-Display. Füge die Adresse ein, und wir holen die Seite und nehmen sie als Bild auf. Eine Sportergebnis-Seite, ein Statusboard, das Mittagsmenü deines Kindes, alles erlaubt.

      Braucht die Seite ein Login-Token? Füge HTTP-Header hinzu. Wir reparieren relative Links zu Stylesheets, Skripten und Bildern, sodass die Seite so aussieht wie in deinem Browser (du kannst das abschalten). Hat sich das HTML der Seite nicht geändert, überspringen wir das Neuzeichnen. Lädt ein Dashboard seine Daten per JavaScript, schalte „Immer aktualisieren“ ein, um jedes Mal eine neue Aufnahme zu bekommen. Tipp: Stell deinen Browser zuerst auf 800x480, um zu sehen, was TRMNL sieht.
    shopify: |-
      Deine Shopify-Verkäufe, auf einem TRMNL ePaper-Display. Erstelle eine individuelle App in deinem Shopify-Admin mit nur Lesezugriff auf Bestellungen, und füge dann ihr Zugriffstoken und die Adresse deines Shops in die Erweiterung ein. Unser Hilfeartikel führt dich durch.

      Wähle einen Rückblickzeitraum: die letzten 7 Tage, die letzten 30 Tage, oder den Monat bis heute. Der Bildschirm zeigt Gesamtverkäufe und wie sie sich mit dem Zeitraum davor vergleichen, offene und erfüllte Bestellungen, durchschnittlichen Bestellwert, und einen Chart der täglichen Verkäufe gegen den vorherigen Zeitraum. Beträge werden in der Währung deines Shops angezeigt. TRMNL liest nur Bestellungen, nichts anderes in deinem Shop.
    shopping_list: |-
      Deine Einkaufsliste, auf einem TRMNL ePaper-Display. Tippe deine Artikel in die Erweiterung, 1 pro Zeile, und sie erscheinen als nummerierte Liste auf dem Bildschirm.

      Kleb sie an den Kühlschrank oder die Tür, und das nächste Mal, wenn du deine Schlüssel greifst, erinnerst du dich an die Zahnpasta. Füge Artikel jederzeit von deinem TRMNL-Dashboard hinzu oder entferne sie, und die Liste auf dem Bildschirm aktualisiert sich mit. Wir speichern die Liste verschlüsselt.
    simple_analytics: |-
      Deine Simple-Analytics-Statistiken, auf einem TRMNL ePaper-Display. Der Bildschirm zeigt Seitenaufrufe, Besucher und Minuten auf der Seite oben, mit einem Chart der täglichen Seitenaufrufe darunter.

      Erstelle einen API-Schlüssel in deinen Simple-Analytics-Kontoeinstellungen, füge ihn ein, und gib die Domain deiner Website ein (ohne „http“). Wähle dann einen Rückblick von 1, 7, 14 oder 30 Tagen. Soll der Chart gestern statt heute enden? Stell das auch ein, damit ein halbfertiger Tag nicht so aussieht, als wäre der Traffic eingebrochen.
    square_pos: |-
      Deine Square-Verkäufe, auf einem TRMNL ePaper-Display. Verbinde dein Square-Konto und wähle bis zu 3 Standorte. Jeder bekommt seine eigene Spalte mit Gesamtzahlungen oben und einer nummerierten Liste jeder abgeschlossenen Zahlung darunter, mit Betrag und Zahlungsart.

      Wähle, wie weit zurückgeblickt wird: heute, die letzten 24 Stunden, oder die letzten 7 Tage. Betreibst du mehrere Filialen? Sieh sie alle nebeneinander auf einem Bildschirm.
    statuspage: |-
      Die Statusseiten der Dienste, auf die du dich verlässt, auf einem TRMNL ePaper-Display. Füge die Adressen der Statusseiten ein, 1 pro Zeile, und wir finden den RSS- oder Atom-Feed jeder Seite für dich. Das funktioniert mit Statuspage, AWS, Slack, Google Cloud und den meisten anderen.

      Der Bildschirm teilt sich in 2 Listen. Incidents zeigt den letzten Vorfall jedes Dienstes und wie lange er zurückliegt, mit einem Symbol, das alles aus den letzten 24 Stunden markiert. Scheduled zeigt anstehende Wartungsarbeiten und ihr Datum. Ist eine Seite nicht erreichbar oder hat keinen Feed, sagt der Bildschirm das, statt still zu bleiben.
    stock_price: |-
      Aktien-, Metall- und Währungskurse, auf einem TRMNL ePaper-Display. Gib bis zu 12 Ticker ein, und jeder zeigt seinen Kurs, Namen und die tägliche Änderung, in Prozent oder Punkten. Das Layout passt sich an, wie viele du hinzufügst.

      US-Ticker funktionieren direkt. Füge eine Börse für Kanada, Deutschland, London oder Indien hinzu (wie SHOP.TSE oder INFY.NSE), nutze das Suffix .FX für Währungspaare (EURUSD.FX), oder verfolge Gold, Silber, Platin, Palladium und Kupfer (XAUUSD für Gold). Marktindizes werden nicht unterstützt, nutze stattdessen einen ETF wie SPY für den S&P 500 (gib SPX ein, und wir schlagen ihn vor). Brauchst du mehr als 12? Füge die Erweiterung zweimal hinzu und kombiniere sie in einem Mashup.
    tempest_weather_station: |-
      Messwerte deiner eigenen Tempest-Wetterstation, auf einem TRMNL ePaper-Display. Melde dich bei deinem Tempest-Konto an, um TRMNL Lesezugriff zu geben (wir können schauen, nicht anfassen), und wähle dann die Station, die gezeigt wird.

      Der Vollbildschirm hat die aktuelle Temperatur, das Gefühlte, und die Bedingungen, zusammen mit Feuchtigkeit, Wind, Niederschlag, UV, Sonnenauf- und -untergang, sowie das heutige und morgige Hoch und Tief. Wähle Fahrenheit oder Celsius, Wind in Einheiten wie mph, km/h, Knoten oder Beaufort, und Niederschlag in Zoll, Zentimetern oder Millimetern. Hast du mehr als 1 Station? Füge die Erweiterung einmal pro Station hinzu und kombiniere sie mit einem Mashup auf einem Bildschirm.
    the_office: |-
      Ein zufälliges Zitat aus The Office, auf einem TRMNL ePaper-Display, neben einer Zeichnung der Figur, die es gesagt hat. Michael, Dwight, Jim und der Rest von Dunder Mifflin machen abwechselnd deinen Arbeitstag ein bisschen leichter.

      Es gibt nichts einzurichten. Füge die Erweiterung hinzu, benenne sie, wenn du möchtest, und speichere. Zitate kommen von Akash Rajpurohits Office API.
    ticktick: |-
      Deine TickTick-Aufgaben, auf einem TRMNL ePaper-Display. Verbinde dein TickTick-Konto, und wähle dann die Liste, die du sehen möchtest, oder deinen Posteingang. Aufgaben zeigen mit ihren Fälligkeitsdaten, sortiert nach dem, was zuerst fällig ist, und Unteraufgaben stehen eingerückt unter ihrer übergeordneten Aufgabe.

      Wähle, ob die Liste oben, mittig oder unten in ihrem Bereich ausgerichtet ist. TickTick teilt nur Aufgabenlisten mit anderen Apps, sodass Kalender, Gewohnheiten, Pomodoro und die Eisenhower-Matrix in TickTick bleiben.
    todo_list: |-
      Eine einfache Todo-Liste, auf einem TRMNL ePaper-Display. Kein Konto zu verbinden. Tippe, worauf du gerade arbeitest, in Doing, 1 Eintrag pro Zeile, und füge erledigte Einträge zu Done hinzu, wenn du möchtest.

      Komm zurück und verschiebe Einträge nach und nach von Doing nach Done, und der Bildschirm behält beide Listen im Blick: was noch übrig ist, und was du schon geschafft hast. Markdown funktioniert in jedem Eintrag, sodass du Fett, Kursiv und mehr hinzufügen kannst, oder schalte es für reinen Text aus. Beide Listen werden verschlüsselt gespeichert.
    todoist: |-
      Deine Todoist-Aufgaben, auf einem TRMNL ePaper-Display. Verbinde dein Todoist-Konto, wähle ein Projekt oder die Ansicht Heute oder Demnächst, und der Bildschirm listet deine Aufgaben mit ihren Fälligkeitsdaten.

      Gruppiere Aufgaben nach Datum, Deadline, Priorität oder Label, und sortiere nach Name, Datum, Deadline, Priorität oder deiner eigenen manuellen Reihenfolge. Filter grenzen die Liste nach Fälligkeitsdatum oder Deadline ein (von heute bis zu den nächsten 30 Tagen), nach Priorität, nach Label, oder danach, wem die Aufgabe zugewiesen ist. Schon sicher mit Todoist-Filterabfragen? Schalte den eigenen Abfragemodus ein und schreib deine eigene.
    unsplash: |-
      Ein zufälliges Foto von Unsplash, auf einem TRMNL ePaper-Display. Gib einen Suchbegriff wie „space“ oder „moon“ ein, und jede Aktualisierung zieht ein neues passendes Landschaftsfoto, für ePaper gerastert und über den ganzen Bildschirm gezeigt.

      Das ist die einzige Einstellung. Wähle ein Thema, das du gern ansiehst, oder füge die Erweiterung mehrmals mit verschiedenen Suchbegriffen hinzu und lass deine Wiedergabeliste zwischen ihnen rotieren.
    upcoming_movies: |-
      Ein Film, auf den man sich freuen kann, auf einem TRMNL ePaper-Display. Jede Aktualisierung wählt einen Film und zeigt Titel, Poster, Erscheinungsdatum und eine kurze Zusammenfassung. Filmdaten kommen von The Movie Database (TMDB).

      Wähle dein Land, damit du siehst, was in deiner Nähe erscheint. Wähle dann Upcoming für Filme, die heute oder später starten, oder Now Playing für schon laufende. Gut, um die Frage „Was sollen wir dieses Wochenende sehen?“ zu klären, bevor die Diskussion überhaupt beginnt.
    weather: |-
      Wisse, wie es draußen ist, bevor du losgehst, ohne Wetterstation. Suche eine Stadt oder Postleitzahl, oder gib Koordinaten ein, und dein TRMNL ePaper-Display zeigt die aktuelle Temperatur und Bedingungen, das Gefühlte, Feuchtigkeit, sowie das heutige und morgige Hoch, Tief und UV.

      Du wählst den Datenanbieter. Tempest nutzt die nächste Tempest-Station, oder eine, die du auf der Tempest-Karte auswählst, und fügt dem Vollbildschirm Wind, Niederschlag, Sonnenauf- und -untergang hinzu. WeatherAPI ist die Rückfalllösung für Orte ohne Station in der Nähe. Stelle Fahrenheit oder Celsius ein, wähle Wind- und Niederschlagseinheiten, und beschrifte Vorhersagen mit „heute“ und „morgen“ oder mit echten Daten.
    webhook_image: |-
      Sende deine eigenen Bilder direkt an ein TRMNL ePaper-Display. Füge die Erweiterung hinzu, und du bekommst eine private Webhook-URL. Sende per POST ein PNG, JPEG oder WebP von einem Skript, einem Cronjob oder Home Assistant, und dieses Bild erscheint auf deinem Bildschirm. Behandle die URL wie ein Passwort, denn jeder, der sie hat, kann deine Anzeige ändern.

      TRMNL verarbeitet das Bild nicht, also passe es vorher für dein Gerät an. Uploads werden gegen die Größe und Farbtiefe deines Geräts geprüft, oder ein von dir gewähltes Modell, und du kannst diese Prüfung überspringen, wenn du weißt, dass dein Gerät es verarbeiten kann. In einem Mashup füllst du den Platz, oder zeigst das ganze Bild mit einer Hintergrundfarbe darum. Du bekommst bis zu 12 Uploads pro Stunde.
    wiki_random_article: |-
      Wikipedias vorgestellter Artikel des Tages, auf einem TRMNL ePaper-Display. Du bekommst den Titel des Artikels und eine kurze Zusammenfassung, jeden Tag eine neue. Manche Tage geht es um eine Schlacht, manche um einen Käfer.

      Es gibt nichts einzurichten. Füge sie zu deiner Wiedergabeliste hinzu und entdecke etwas Interessantes, während dein Kaffee zieht. Artikel kommen aus dem täglichen Feed der vorgestellten Artikel der englischen Wikipedia, sodass alle denselben sehen.
    withings: |-
      Deine Withings-Gesundheitsdaten, auf einem TRMNL ePaper-Display. Melde dich bei Withings an, um TRMNL Lesezugriff zu geben, und wähle dann einen Anzeigemodus, der zu deinem Gerät passt. Weight, für Waagen, zeigt dein aktuelles Gewicht, Körperfett- und Muskelanteil, und deine Änderung über den Zeitraum, mit einem Chart. Sleep, für den Sleep Analyzer, zeigt deinen Schlafscore, geschlafene Stunden und Effizienz, mit einem Chart für Tief-, REM- und Leichtschlaf jede Nacht. Activity, für Wearables, zeigt die heutigen Schritte gegen dein Ziel, mit einem Chart für Schritte und Schlaf.

      Schau 7, 30 oder 90 Tage zurück, und zeige Gewicht in Pfund, Kilogramm oder Stone. Von Hand eingegebene Werte werden ausgelassen.
    workflowy: |-
      Deine Workflowy-Liste, auf einem TRMNL ePaper-Display. Jeder Eintrag zeigt sich mit seiner Notiz darunter, in derselben Reihenfolge, in der du sie in Workflowy führst.

      Füge dein Workflowy-API-Token ein, um dich zu verbinden. Standardmäßig siehst du deine Home-Liste. Willst du nur 1 Projekt? Füge dessen Item-ID hinzu, und die Erweiterung behandelt diesen Eintrag als oberste Ebene. Zeige bis zu 25 Einträge, und wähle, ob erledigte Einträge auch erscheinen (sie bekommen ein Häkchen und eine Durchstreichung).
    youtube_analytics: |-
      Deine YouTube-Kanalstatistiken, auf einem TRMNL ePaper-Display. Views und angesehene Stunden führen den Bildschirm an, gefolgt von durchschnittlicher Ansehdauer, gewonnenen Abonnenten, View-Through-Rate, Likes, Kommentaren und Shares.

      Verbinde dich mit dem Google-Konto, dem dein Kanal gehört (Verwalter eines geteilten Kanals können ihn nicht verbinden), und wähle dann einen Rückblick von 7, 28, 90 oder 365 Tagen. Betreibst du mehr als 1 Kanal? Füge die Erweiterung einmal pro Kanal hinzu und benenne jede, damit du sie unterscheiden kannst.
    linkedin_page: |-
      Die Statistiken deiner LinkedIn-Unternehmensseite, auf einem TRMNL ePaper-Display. Sieh Follower, neue Follower, Impressionen, Klicks, Engagement-Rate, Reaktionen, Kommentare und Shares, mit einem täglichen Chart der von dir gewählten Kennzahl.

      Verbinde das LinkedIn-Konto, das Admin der Seite ist, wähle die Seite, und wähle dann einen Rückblick von 7, 30 oder 90 Tagen. LinkedIn meldet diese Zahlen mit 2 Tagen Verzögerung, sodass der Bildschirm vor 2 Tagen endet. Betreibst du mehr als 1 Seite? Füge die Erweiterung einmal pro Seite hinzu.
