      landing:
        meta_title: Meeting Room Schedule Display & Conference Room Booking System
        ical_feeds: iCal feeds
        testimonials:
          almond_board: At the Almond Board of California, we do meetings. LOTS of meetings! Booking made it incredibly simple to put useful signage right outside our conference room doors, making it a breeze for guests to find the appropriate meeting room. Ryan and his team have been fantastic!
          valley_legal: We use TRMNL screens outside our conference rooms to show live bookings, while our lobby displays update themselves with the day’s schedule and signage. It looks professional and runs without anyone touching it.
          red_online_marketing: We use TRMNL Booking to manage availability for our 4 meeting rooms. After about 15 minutes of setup, it just works. And the battery lasts for months.
          valley_matter: 'TRMNL gave Valley Matter the missing piece: a calm, always-on office display. Our firms can push court calendars, room bookings, and lobby signage straight to TRMNL screens: no extra apps and nothing to babysit.'
          design911: Bought TRMNL for work calendar display... I was amazed at the level of help I got to make it work. Impressed!
          coastal_advisory: Fantastic platform - simple to implement with its native integration to M365
        hero_desktop_alt: TRMNL ePaper conference room schedule display mounted outside an office meeting room
        hero_mobile_alt: Meeting room booking system interface and ePaper office hallway display
        eyebrow: Meeting Room Schedule Displays & Booking
        title: See what's free. Book it in seconds.
        subtitle: TRMNL turns your Google Workspace or Microsoft 365 calendars into quiet, wireless ePaper signage for conference rooms, meeting rooms and office hallways. Scan a QR code for instant walk-up room reservations, no app or account required.
        try_free: Try it free for %{days} days
        problem_eyebrow: Here's the thing
        problem_title: Your calendar is the source of truth.
        problem_calendar: It knows which room is free, who has the van, and whether that desk by the window is taken. But it's all in Google or Outlook, behind a login nobody opens on the way down the hall.
        problem_knocking: So people knock, peek through the glass, or book a room and never show up. Booking puts the schedule on an ePaper screen you can read from across the room.
        works_with: Works with
        management_eyebrow: Conference room management
        management_title: Calm ePaper built for modern workplace displays.
        management_description: Traditional conference room displays rely on glowing tablets with tangled power cables, constant charging and high subscription fees. TRMNL offers a simple, low-power solution designed for modern office management systems.
        wireless_title: Wireless hallway mounting
        wireless_description: Mount directly on glass walls, conference room doors or drywall without drilling or PoE cabling. The long battery life keeps signage visible for months between charges.
        glare_title: Zero glare, 180° visibility
        glare_description: Crisp ePaper screens read like printed signs from across the hall under bright office fluorescent lights or direct sunlight, with zero distracting blue light.
        ghost_meetings_title: Stop ghost meetings
        ghost_meetings_description: Free up empty rooms with easy check-ins and on-the-spot mobile reservations, ensuring your meeting room booking system stays in sync with real-world room usage.
        displays_eyebrow: Meeting room displays
        displays_title: Spot availability from across the hall.
        displays_description: 'Booking makes things simple: see the current meeting, when it ends, who booked it and attendance details, without opening a phone. Our battery-friendly ePaper screens update every few minutes to keep office room booking accurate.'
        displays_alt: TRMNL meeting room schedule display showing occupied status and current meeting details
        walk_up_eyebrow: Booking on the spot
        walk_up_title: Scan to instantly reserve from any phone.
        walk_up_description: Scan the on-screen QR code, pick a time slot or future date, and the room is yours. Zero friction, no logins, and no apps to download. Bookings sync instantly with Google or Microsoft calendars to prevent double bookings.
        walk_up_alt: Conference room reservation system walk-up QR code booking screen on mobile
        hallway_eyebrow: Office hallway display
        hallway_title: Multiple room schedules on one screen.
        hallway_description: Show every meeting room, conference room, hot desk or vehicle on a single display. Group resources into collections of up to %{grid_size} in a grid or %{list_size} in a list. One QR code lets visitors choose which space to reserve.
        hallway_alt: Multi-room office hallway display showing conference room availability grid
        browser_eyebrow: Any screen with a browser
        browser_title: Already have a TV or tablet? Use it too.
        browser_description: Open any room or collection at its own private URL on an LCD screen, TV or tablet. You're only billed once for the room, not the number of displays.
        browser_alt: Meeting room schedule open in a browser on a tablet, with the booking QR code
        how_it_works_eyebrow: How it works
        how_it_works_title: Get up and running in minutes.
        how_it_works_description: Three steps, no sales call.
        connect_title: Connect your calendars
        connect_description: Google Workspace, Microsoft 365 or any iCal feed. Conference rooms and meeting spaces come over with their building, floor and seat count in one click. Exclude private executive calendars.
        customize_title: Customize your room displays
        customize_description: Add your company logo, rename meeting rooms, choose 12- or 24-hour scheduling and enable light or dark mode. Set rules for how far ahead a resource can be booked.
        deploy_title: Deploy to your building
        deploy_description: Mount a TRMNL display outside doors or group multiple conference rooms into a collection dashboard for common or high traffic areas.
        case_study_eyebrow: Case study
        case_study_title: From a DIY hack to a managed room display.
        case_study_description: Code Orange, a software studio in Amsterdam, swapped a homebrew Raspberry Pi sign for Booking. Their Google Workspace rooms stay the source of truth, and walk-up QR booking covers the guests who can't see their calendar.
        customers_eyebrow: Customers
        customers_title: In the hallways of real offices.
        customers_description: Law firms, agencies, and boardrooms run their meeting rooms with TRMNL Booking.
        pricing_eyebrow: Pricing
        pricing_title: "%{price}/month/resource. No contracts or hidden charges."
        pricing_per_resource: We're not the first to sell room signs. But TRMNL sets up in minutes, doesn't require a signature, and you pay for each bookable resource on a screen, not for each device. A room on three screens is still one room.
        pricing_plans: "%{monthly_price} a month, or %{annual_price} a year. Every plan starts with a %{days}-day free trial."
        pricing_hardware_html: |-
          Need screens? TRMNL X and OG are a one-time purchase, with %{volume_link}. And the list of
          %{devices_link} keeps growing.
        pricing_volume_link: volume discounts for teams
        pricing_devices_link: supported third-party devices
        compare_pricing: Compare pricing with ...
        compare_pricing_with: Compare pricing with %{name} →
        compare_tablets: tablets
        try_it_title: Try it on your busiest room.
        try_it_description_html: Install Booking, connect a calendar and put one room on a screen.<br>The first %{days} days are free.
        install_booking: Install Booking
        og_description: Smart ePaper meeting room schedule displays and conference room booking system. Show real-time calendar availability, prevent double-bookings, and book rooms with QR codes.
        faq:
          visitor_account:
            question: Do visitors need a TRMNL account to book?
            answer: No. They scan the QR code on the screen, pick a time and book. The booking goes straight into your calendar.
          calendars:
            question: Which calendars does it work with?
            answer: Google (personal accounts and Workspace), Microsoft (Outlook, Exchange Online rooms and Microsoft Places workspaces) and any iCal feed.
          double_booking:
            question: What if someone books the same room in Outlook at the same time?
            answer: We check your calendar again right before we book, and turn down a booking that overlaps. Your calendar stays the source of truth.
          qr_code_photo:
            question: Can someone book from a photo of the QR code?
            answer: Turn on QR Code Security and the booking link changes every day, so yesterday's photo stops working. Printed codes stop working too, so leave it off if you rely on them.
          screen_updates:
            question: How often does the screen update?
            answer: We redraw each room every five minutes, and the device picks it up at its own refresh rate. Faster refresh uses more battery, so a screen next to a busy room is happiest plugged in.
          tv_or_tablet:
            question: Can I show the schedule on a TV or tablet?
            answer: Yes. Any calendar or collection can also open at its own private URL in a browser, on an LCD screen, TV or tablet. It needs no login and refreshes itself. A room on both a TRMNL and a URL is billed once.
          room_management:
            question: How does an ePaper meeting room schedule display improve conference room management?
            answer: ePaper room displays show live availability, current meeting titles and organizer details without glare or glowing blue light in hallways. Because they run for months on battery or over USB-C, they mount on glass walls and doors without running PoE cables or cutting drywall.
          hallway_display:
            question: Can TRMNL serve as an office hallway display for multiple conference rooms?
            answer: 'Yes. You can group rooms, desks and workspaces into collections: up to %{grid_size} in a grid or %{list_size} in a list on a single screen. Hallway and reception displays give a quick overview of which spaces are free across the entire floor.'
          walk_up_bookings:
            question: How does the conference room reservation system handle walk-up bookings?
            answer: Anyone can scan the on-screen QR code with their phone camera to reserve 15, 30 or 60 minutes instantly. No app installation or TRMNL login is required. The reservation syncs directly with your Google Workspace or Microsoft 365 calendar in real time to prevent double-bookings.
          billing:
            question: How does billing work?
            answer: "$%{price} a month or $%{annual_price} a year for each bookable resource on a screen, after a %{trial_days}-day free trial. A room on three screens counts once. No contract."
          virtual_device:
            question: Can I try it without a TRMNL?
            answer: Yes. Create a free virtual device, install Booking and see your rooms on screen before you buy anything.
        software_application_description: Smart ePaper conference room schedule displays and meeting room booking system for Google Workspace and Microsoft 365.
