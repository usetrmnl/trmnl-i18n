            question: How long does the battery last on a TRMNL display?
            answer: 3 to 6 months per charge at typical refresh rates. Faster refresh uses more battery, so a display next to a busy room can stay plugged in over USB-C.
          screen_updates:
            question: How quickly does a new booking show on the screen?
            answer: In a browser, within a minute. On ePaper, we redraw each room every five minutes, and the device shows it at its own refresh rate.
          booking_at_display:
            question: Can people book a room at the display?
            answer: Anyone who scans the QR code on the screen can book from their phone, with no TRMNL account or app. It works the same on ePaper and on tablets. The booking goes straight into your calendar.
          mdm:
            question: Do TRMNL displays need MDM?
            answer: No. A TRMNL runs only TRMNL firmware. It pulls its screen from our server and cannot be accessed remotely. You manage it from the TRMNL dashboard.
          several_screens:
            question: Does a room cost more on several screens?
            answer: No. Booking is $%{price} a month, or $%{annual_price} a year, for each bookable resource. A room on an ePaper display and on a tablet counts once.
