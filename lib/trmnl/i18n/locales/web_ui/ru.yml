      write: Change your devices, playlists, plugin settings and markup
      content: Change your markup, plugin settings, playlists and mashups, install recipes and push images
      devices: Change your device settings and identify a device
      delete: Delete plugin settings and playlist items, and clear a device playlist
      openid: Sign you in
      email: See your email address
      profile: See and change your name, time zone and display settings
      apps: Install apps and manage them, including fleet pushes and room bookings; removing an installation, calendar, collection or integration needs delete
    authorizations:
      new:
        can_reach: 'It can reach:'
        none_ticked: Tick at least one thing it may do, or choose Don't allow.
        title: Connect an app to your account
        prompt: "%{client_name} wants to use your TRMNL account."
        able_to: 'It will be able to:'
        returns_to: You return to %{host} after you choose.
      buttons:
        authorize: Allow
        deny: Don't allow
