            question: Jak często ekrany się aktualizują?
            answer: W przeglądarce w ciągu minuty. Na TRMNL ponownie renderujemy każdą salę co pięć minut, a ekran zmienia się także przy rozpoczęciu lub zakończeniu spotkania.
          volume_discounts:
            question: Czy oferujecie rabaty ilościowe?
