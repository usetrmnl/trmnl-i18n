        faq:
          trial:
            question: Can I try Booking before I pay?
            answer: 'Yes. Installing Booking and connecting your calendars costs nothing. Your %{trial_days}-day free trial starts when you put your first room on a screen: we ask for a card then, and charge nothing until the trial ends. Cancel before then and you pay nothing.'
          minimum_rooms:
            question: Is there a minimum number of rooms?
            answer: No. Start with one room on one screen. There is no minimum team size and no minimum term.
          display_limit:
            question: Is there a limit on displays?
            answer: 'No. Show a room on as many screens as you like: TRMNL ePaper at the door, tablets, TVs and hallway screens. A room counts once, however many screens show it.'
          screen_updates:
            question: How often do the screens update?
            answer: In a browser, within a minute. On a TRMNL, we redraw each room every five minutes, and the screen also changes when a meeting starts or ends.
          volume_discounts:
            question: Do you offer volume discounts?
            answer: 'Booking costs the same for every room: $%{price} a month, or $%{annual_price} a year. TRMNL displays cost less from %{minimum} devices, and less again as you buy more.'
          cancel:
            question: Can I cancel at any time?
            answer: Yes. There is no contract and no cancellation fee. When you uninstall Booking, your subscription ends with the period you paid for.
          room_definition:
            question: What counts as a room?
            answer: 'Any calendar you show on a screen: a meeting room, a desk, a parking space or a vehicle. A calendar you connect but do not show costs nothing.'
          hardware:
            question: Do I need TRMNL hardware?
            answer: No. Booking also runs on tablets, TVs and any screen with a browser. TRMNL ePaper is a one-time purchase, if you want it.
