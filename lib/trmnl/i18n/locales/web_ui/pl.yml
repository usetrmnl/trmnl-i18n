          own_tablets_body: 'Użyj ich z Booking: otwórz adres URL sali w przeglądarce. Dodaj wyświetlacze ePaper przy drzwiach bez gniazdka.'
        try_booking_description: Utwórz bezpłatne urządzenie wirtualne, podłącz jeden kalendarz i przetestuj ekran sali przed zakupem sprzętu. Każdy plan zaczyna się od bezpłatnego okresu próbnego trwającego %{trial_days} dni.
        disclaimer_sources: Sprzedajemy TRMNL. Informacje o tabletach i amerykańskie ceny katalogowe na tej stronie pochodzą z publicznych stron Apple i Samsung, sprawdzonych %{date}.
        disclaimer_estimates: Ceny obudów to ceny katalogowe Compulocks. Koszty instalacji są szacunkowe i zależą od budynku oraz regionu.
        disclaimer_trademarks: iPad jest znakiem towarowym Apple Inc. Galaxy Tab jest znakiem towarowym Samsung. Android jest znakiem towarowym Google LLC.
        disclaimer_affiliation: TRMNL nie jest powiązany z Apple, Samsung ani Google.
        og_description: 'Porównaj iPady i tablety z Androidem z wyświetlaczami ePaper TRMNL w zastosowaniu jako wyświetlacze sal konferencyjnych: zasilanie, montaż, zarządzanie urządzeniami i całkowity koszt. TRMNL Booking działa na wszystkich trzech rodzajach urządzeń.'
        faq:
          existing_tablets:
            question: Czy mogę używać posiadanych tabletów?
            answer: Tak. Otwórz dowolną salę lub kolekcję pod jej prywatnym adresem URL w przeglądarce tabletu. Nie wymaga logowania ani aplikacji i odświeża się automatycznie. Aby pozostawić stronę na ekranie, użyj Dostępu nadzorowanego na iPadzie lub przypinania aplikacji na Androidzie.
          battery:
            question: Jak długo wyświetlacz TRMNL działa na baterii?
            answer: 4 to 8 months per charge at the default 15-minute refresh. Faster refresh uses more battery, so a display next to a busy room can stay plugged in over USB-C.
          screen_updates:
            question: Jak szybko nowa rezerwacja pojawi się na ekranie?
            answer: W przeglądarce w ciągu minuty. Na ePaper generujemy obraz każdej sali co pięć minut, a urządzenie wyświetla go zgodnie z własną częstotliwością odświeżania.
          booking_at_display:
            question: Czy można rezerwować salę przy wyświetlaczu?
            answer: Każdy, kto zeskanuje kod QR na ekranie, może dokonać rezerwacji za pomocą telefonu, bez konta ani aplikacji TRMNL. Działa to tak samo na ePaper i tabletach. Rezerwacja trafia bezpośrednio do Twojego kalendarza.
          mdm:
            question: Czy wyświetlacze TRMNL wymagają MDM?
            answer: Nie. TRMNL działa wyłącznie na firmware TRMNL. Pobiera obraz z naszego serwera i nie można uzyskać do niego zdalnego dostępu. Zarządzasz nim z pulpitu TRMNL.
          several_screens:
            question: Czy wyświetlanie sali na kilku ekranach kosztuje więcej?
            answer: Nie. Booking kosztuje $%{price} miesięcznie lub $%{annual_price} rocznie za każdy zasób dostępny do rezerwacji. Sala wyświetlana na ekranie ePaper i tablecie jest rozliczana tylko raz.
