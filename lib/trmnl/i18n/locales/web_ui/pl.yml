          title: Informacje w tle, bez bezmyślnego przewijania
          body: 'Na stoliku kawowym: wieczorne nagłówki, odtwarzana muzyka i jutrzejsza pogoda — informacje na pierwszy rzut oka, bez wciągania w niekończący się strumień treści.'
