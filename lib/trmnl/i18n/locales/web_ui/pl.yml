  pages:
    flash_firmware:
      linux_warning: Flashowanie z Linuksa często kończy się niepowodzeniem, ponieważ Chrome nie może otworzyć portu szeregowego. Dodaj użytkownika do grupy dialout (sudo usermod -aG dialout $USER), wyloguj się i zaloguj ponownie, a następnie spróbuj jeszcze raz. Jeśli to nie pomoże, użyj Chrome lub Edge na komputerze Mac albo z Windows.
      serial_failure:
        guide_link: Zobacz instrukcję trybu flashowania
        port_unavailable: Nie udało się otworzyć portu szeregowego. Przewód USB-C może służyć tylko do ładowania albo urządzenie nie jest w trybie flashowania.
        reset_refused: Urządzenie nie weszło w tryb flashowania, więc reset się nie powiódł. Powtórz krok 3 i spróbuj ponownie.
      meta_title_custom: Wgraj niestandardowy firmware
      meta_title: Wgraj firmware
      title: Asystent wgrywania firmware'u
      subtitle: Zaktualizuj firmware urządzenia jednym kliknięciem, bez programowania.
      powered_by_html: Obsługiwane przez %{link}.
      step_1: Krok 1 — Wybierz urządzenie
      loading: Wczytywanie, proszę czekać...
      select_file_html: Wybierz plik firmware'u <code>.bin</code> do wgrania.
      version_prompt_html: Oraz %{link}, którą chcesz zainstalować
      firmware_version: wersję firmware'u
      please_select: Wybierz...
      step_2: Krok 2 — Podłącz urządzenie
      plug_in: Podłącz urządzenie do komputera przewodem USB-C. Jeśli masz oryginalny przewód TRMNL, świetnie się do tego nadaje.
      step_3: Krok 3 — Przejdź do trybu wgrywania firmware'u
      select_model_first: Wybierz powyżej model urządzenia, aby wyświetlić instrukcję.
      og_flash_off: Wyłącz urządzenie, ustawiając przełącznik zasilania w pozycji OFF
      og_flash_hold: Przytrzymując okrągły przycisk, przestaw przełącznik zasilania w pozycję ON
      og_flash_release: Zwolnij okrągły przycisk
      here: tutaj
      x_flash_html: Zapoznaj się z instrukcją Model X > „Flashing / Boot Mode” %{link}.
      diy_kit_flash: Naciśnij i przytrzymaj przycisk Key 3 przez około 5 sekund.
      xiao_flash: Naciśnij przycisk Reset, zwolnij go, a następnie naciśnij i przytrzymaj przycisk Boot przez 5 sekund.
      e100x_flash: Naciśnij i przytrzymaj jednocześnie oba przyciski nawigacyjne (lewy i prawy) przez 2 sekundy.
      e1003_flash_html: Zobacz instrukcję w centrum pomocy Seeed Studio %{link}.
      x4_wake: Jeśli używasz domyślnego firmware'u X4 lub Crosspoint, wybudź urządzenie.
      x4_reset: Jeśli używasz już firmware'u TRMNL, przytrzymaj przycisk Reset urządzenia X4 przez 3 sekundy.
      x4_note_html: "<strong>Uwaga</strong>: X4 pozostaje w trybie wgrywania firmware'u tylko przez kilka sekund. Wykonaj krok 4 natychmiast po przytrzymaniu przycisku Reset, w przeciwnym razie trzeba będzie ponowić próbę."
      step_4: Krok 4 — Wgraj firmware
      click_connect: Kliknij poniższy przycisk „Connect”
      select_serial: Wybierz z listy „USB JTAG/serial...”
      select_install: Wybierz „Install” z wyświetlonego menu
      wait_install: Poczekaj, aż urządzenie zainstaluje firmware (może to potrwać minutę lub dwie)
      confirmation: W wyświetlonym menu powinien pojawić się komunikat potwierdzający
      step_5: Krok 5 — Uruchom ponownie urządzenie
      og_restart_off: Wyłącz urządzenie, ustawiając przełącznik zasilania w pozycji OFF
      og_restart_wait: Odczekaj około 15 sekund
      og_restart_on: Przestaw przełącznik zasilania w pozycję ON
      x_restart_html: Twój X może zacząć działać bez żadnej interakcji. Jeśli tak się nie stanie, zobacz instrukcję Model X > „Soft Reset” %{link}.
      troubleshooting: Rozwiązywanie problemów
      open_error: 'Jeśli w kroku 4 wystąpi błąd „Failed to execute ''open'' on ''SerialPort''”:'
      charge_only_cable: przewód USB-C może obsługiwać jedynie ładowanie (bez transmisji danych)
      not_flashing_mode: urządzenie może jeszcze nie być w trybie wgrywania firmware'u.
      repeat_step_html: Powtórz krok 3 lub zapoznaj się z %{link}, aby poznać inne opcje.
      this_guide: tym poradnikiem
      init_failure_html: Jeśli pojawi się komunikat „Failed to initialize. Try resetting your device or holding the BOOT button while clicking INSTALL”, urządzenie nie jest w trybie wgrywania firmware'u. Powtórz krok 3 lub zapoznaj się z %{link}, aby poznać inne opcje.
      og_description: Zaktualizuj firmware urządzenia jednym kliknięciem.
      x_first_start: Nie odłączaj przewodu USB-C. Podczas pierwszego uruchomienia X może przez około 75 sekund wyświetlać „Flashing modem firmware...”. Gdy pojawi się komunikat „Device is ready to ship!”, odłącz przewód, a następnie podłącz go ponownie, aby skonfigurować Wi-Fi.
      x_still_in_flashing_mode: Jeśli ekran nie zmieni się w ciągu 2 minut, X nadal jest w trybie wgrywania firmware'u. Pozostaw przewód podłączony i kliknij poniższy przycisk.
      x_restart_button: Uruchom ponownie mojego X
      x_restart_sent: Wysłano polecenie restartu. Ekran zmieni się w ciągu kilku sekund.
