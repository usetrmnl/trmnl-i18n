        title: Rozwiązanie klasy enterprise bez korporacyjnego bełkotu.
      faq:
        title: Najczęściej zadawane pytania
        entries:
          battery_life:
            answer: 'Przy odświeżaniu co 15 minut: OG około 4 miesięcy, TRMNL X około 4 (8 z powiększoną baterią), 4-kolorowy OG około 2. Częstsze odświeżanie przyspiesza rozładowanie. Ładowanie USB-C; X ma ładowarkę magnetyczną.'
            question: Jak długo naprawdę wytrzymują baterie?
          custom_branding:
            answer: TRMNL X nie ma oznaczeń marki z przodu (logo jest tylko z tyłu). Przy większych zamówieniach OG możemy omówić niestandardowe kolory obudów. Napisz na biz@trmnl.com.
            question: Czy możemy otrzymać własne oznaczenia marki?
          manage_devices:
            answer: Każde urządzenie jest powiązane z kontem. Kupujesz hurtowo? Aplikacja Preload instaluje Twoje pluginy na każdym urządzeniu z zamówienia przy jego przypisaniu. Funkcje zarządzania wieloma urządzeniami pojawią się w 2026 r.
            question: Jak zarządzać wieloma urządzeniami?
          purchase_orders:
            answer: Tak. Akceptujemy zamówienia zakupu (PO) powyżej %{minimum}. Przyjmujemy również formularze zwolnienia podatkowego dla zamówień instytucji edukacyjnych i organizacji non-profit.
            question: Czy akceptujecie zamówienia zakupu (PO)?
          security:
            answer: Urządzenia wykorzystują jednokierunkową komunikację typu pull (wyłącznie od urządzenia do serwera). Wygenerowane treści nie są trwale przechowywane na urządzeniach. Dostępny jest samodzielny hosting zapewniający pełną kontrolę nad danymi.
            question: Co z bezpieczeństwem?
          self_host:
            answer: Tak. BYOS pozwala uruchomić TRMNL całkowicie we własnej infrastrukturze. Firmware open source i implementacje serwera w Ruby, Pythonie, PHP, Node i Elixirze. Pełna dokumentacja na docs.trmnl.com.
            question: Czy możemy hostować wszystko samodzielnie?
          shutdown:
            answer: Udostępniamy kod źródłowy wszystkiego. To nasza deklaracja Unbrickable Pledge. Twoje urządzenia będą działać zawsze. Deklaracja jest zarchiwizowana w Wayback Machine, abyśmy mogli zostać rozliczeni z obietnicy.
            question: Co się stanie, jeśli TRMNL zakończy działalność?
          warranty:
            answer: Roczna gwarancja na wady sprzętowe. Ale jeśli coś się zepsuje z naszej winy, naprawimy to niezależnie od daty zakupu. Tak po prostu działamy.
            question: Jaka jest gwarancja?
