      faq:
        title: Frequently asked questions
        entries:
          battery_life:
            answer: 'At a 15-minute refresh: OG about 4 months, TRMNL X about 4 (8 with the extended battery), 4-color OG about 2. Faster refresh drains faster. USB-C charging; the X has a magnetic charger.'
            question: How long do batteries actually last?
          custom_branding:
            answer: TRMNL X has no branding on the front (logo on back only). For larger OG orders we can discuss custom enclosure colors. Email biz@trmnl.com.
            question: Can we get custom branding?
          manage_devices:
            answer: Each device links to an account. Buying in bulk? The Preload app installs your plugins on every device in an order when it is claimed. Multi-device dashboard features coming in 2026.
            question: How do I manage multiple devices?
          purchase_orders:
            answer: Yes. POs accepted for orders over %{minimum}. We also accept tax-exempt forms for EDU/non-profit orders.
            question: Do you accept purchase orders?
          security:
            answer: Devices leverage one-way 'pull' communication (device to server only). No persistent storage of rendered content on devices. Self-hosting options available for complete data control.
            question: What about security?
          self_host:
            answer: Yes. BYOS (Bring Your Own Server) lets you run TRMNL entirely on your infrastructure. Open source firmware + server clients in Ruby, Python, PHP, Node, Elixir. Full docs at docs.trmnl.com.
            question: Can we self-host everything?
          shutdown:
            answer: We open source everything. That's the Unbrickable Pledge. Your devices keep working, forever. It's archived on the Wayback Machine to keep us accountable.
            question: What if TRMNL shuts down?
          warranty:
            answer: 1 year warranty on hardware defects. But honestly, if something breaks and it's our fault, we'll make it right regardless of when you bought it. That's just how we operate.
            question: What's the warranty?
