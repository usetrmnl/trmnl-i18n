      landing:
        meta_title: Wyświetlacze harmonogramów sal spotkań i system rezerwacji sal konferencyjnych
        ical_feeds: Kanały iCal
        testimonials:
          almond_board: W Almond Board of California organizujemy spotkania. MNÓSTWO spotkań! Booking niezwykle ułatwił umieszczenie przydatnych oznaczeń tuż za drzwiami sal konferencyjnych, dzięki czemu goście bez trudu znajdują odpowiednią salę. Ryan i jego zespół są fantastyczni!
          valley_legal: Używamy ekranów TRMNL przed salami konferencyjnymi do wyświetlania aktualnych rezerwacji, a ekrany w holu samodzielnie aktualizują harmonogram dnia i oznakowanie. Wygląda to profesjonalnie i działa bez ingerencji kogokolwiek.
          red_online_marketing: Korzystamy z TRMNL Booking do zarządzania dostępnością naszych 4 sal spotkań. Po około 15 minutach konfiguracji wszystko po prostu działa. Bateria wystarcza na miesiące.
          valley_matter: 'TRMNL dał Valley Matter brakujący element: spokojny, stale działający wyświetlacz biurowy. Nasze kancelarie mogą przesyłać kalendarze sądowe, rezerwacje sal i oznakowanie holu bezpośrednio na ekrany TRMNL — bez dodatkowych aplikacji i bez konieczności nadzorowania.'
          design911: Kupiliśmy TRMNL do wyświetlania kalendarza w pracy... Zdumiał mnie poziom pomocy, jaką otrzymaliśmy, aby wszystko działało. Jestem pod wrażeniem!
          coastal_advisory: Fantastyczna platforma — prosta we wdrożeniu dzięki natywnej integracji z M365
        hero_desktop_alt: Wyświetlacz e-papierowy TRMNL z harmonogramem sali konferencyjnej zamontowany przed salą spotkań
        hero_mobile_alt: Interfejs systemu rezerwacji sal i e-papierowy wyświetlacz na korytarzu biura
        eyebrow: Wyświetlacze harmonogramów i rezerwacja sal spotkań
        title: Sprawdź, co jest wolne. Zarezerwuj w kilka sekund.
        subtitle: TRMNL przekształca kalendarze Google Workspace lub Microsoft 365 w dyskretne, bezprzewodowe oznakowanie e-papierowe sal konferencyjnych, sal spotkań i korytarzy biurowych. Zeskanuj kod QR, aby natychmiast zarezerwować salę na miejscu, bez aplikacji i konta.
        try_free: Wypróbuj bezpłatnie przez %{days} dni
        problem_eyebrow: Sedno sprawy
        problem_title: Twój kalendarz jest źródłem prawdy.
        problem_calendar: Wie, która sala jest wolna, kto korzysta z samochodu i czy biurko przy oknie jest zajęte. Ale wszystko znajduje się w Google lub Outlooku, za ekranem logowania, którego nikt nie otwiera w drodze korytarzem.
        problem_knocking: Ludzie więc pukają, zaglądają przez szybę lub rezerwują salę i nie przychodzą. Booking wyświetla harmonogram na ekranie e-papierowym, czytelnym z drugiego końca pomieszczenia.
        works_with: Współpracuje z
        management_eyebrow: Zarządzanie salami konferencyjnymi
        management_title: Dyskretny e-papier stworzony z myślą o nowoczesnym miejscu pracy.
        management_description: Tradycyjne wyświetlacze sal konferencyjnych to świecące tablety, plączące się przewody zasilające, ciągłe ładowanie i wysokie opłaty subskrypcyjne. TRMNL oferuje proste, energooszczędne rozwiązanie dla nowoczesnych systemów zarządzania biurem.
        wireless_title: Bezprzewodowy montaż na korytarzu
        wireless_description: Zamontuj bezpośrednio na szklanych ścianach, drzwiach sal konferencyjnych lub płytach gipsowo-kartonowych bez wiercenia i okablowania PoE. Długi czas pracy baterii zapewnia widoczność oznakowania przez miesiące między ładowaniami.
        glare_title: Brak odblasków, widoczność 180°
        glare_description: Wyraźne ekrany e-papierowe są czytelne jak drukowane tabliczki z drugiego końca korytarza, przy jasnym świetle biurowych świetlówek lub bezpośrednim słońcu, bez rozpraszającego niebieskiego światła.
        ghost_meetings_title: Koniec z rezerwacjami widmo
        ghost_meetings_description: Zwalniaj puste sale dzięki łatwemu potwierdzaniu obecności i mobilnym rezerwacjom na miejscu, aby system rezerwacji odpowiadał rzeczywistemu wykorzystaniu sal.
        displays_eyebrow: Wyświetlacze sal spotkań
        displays_title: Sprawdź dostępność z drugiego końca korytarza.
        displays_description: 'Booking upraszcza sprawę: zobacz trwające spotkanie, godzinę jego zakończenia, organizatora i uczestników bez sięgania po telefon. Nasze energooszczędne ekrany e-papierowe aktualizują się co kilka minut, aby zapewnić aktualność rezerwacji sal.'
        displays_alt: Wyświetlacz TRMNL z harmonogramem sali spotkań pokazujący zajętość i szczegóły trwającego spotkania
        walk_up_eyebrow: Rezerwacja na miejscu
        walk_up_title: Zeskanuj i natychmiast zarezerwuj z dowolnego telefonu.
        walk_up_description: Zeskanuj kod QR na ekranie, wybierz przedział czasowy lub przyszłą datę, a sala jest Twoja. Bez komplikacji, logowania i pobierania aplikacji. Rezerwacje natychmiast synchronizują się z kalendarzami Google lub Microsoft, zapobiegając podwójnym rezerwacjom.
        walk_up_alt: Mobilny ekran rezerwacji sal konferencyjnych na miejscu za pomocą kodu QR
        hallway_eyebrow: Wyświetlacz na korytarzu biura
        hallway_title: Harmonogramy wielu sal na jednym ekranie.
        hallway_description: Wyświetl wszystkie sale spotkań, sale konferencyjne, współdzielone biurka lub pojazdy na jednym ekranie. Grupuj zasoby w kolekcje do %{grid_size} w siatce lub %{list_size} na liście. Jeden kod QR pozwala gościom wybrać miejsce do zarezerwowania.
        hallway_alt: Wyświetlacz na korytarzu biura pokazujący dostępność wielu sal konferencyjnych w siatce
        browser_eyebrow: Dowolny ekran z przeglądarką
