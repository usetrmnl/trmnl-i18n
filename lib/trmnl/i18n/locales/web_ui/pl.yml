        disclaimer_sources: Sprzedajemy TRMNL. Informacje o Envoy i amerykańskie ceny katalogowe na tej stronie pochodzą z publicznej strony Envoy, sprawdzonej %{date}.
        disclaimer_prices: Ceny modułów Envoy nie obejmują opłaty za platformę, której Envoy nie publikuje. Sprzęt, podatki i wysyłka są rozliczane osobno, o ile nie podano inaczej.
        disclaimer_trademark: Envoy jest znakiem towarowym należącym do jego właściciela. TRMNL nie jest powiązany z Envoy.
        og_description: 'Porównaj platformę Envoy z TRMNL Booking: aktualne harmonogramy sal i rezerwacje na miejscu za pomocą kodu QR w jednej jawnej cenie, na wyświetlaczu ePaper TRMNL lub posiadanym ekranie.'
        faq:
          front_desk:
            question: Czy mogę nadal korzystać z Envoy Visitors w recepcji?
            answer: Tak. Booking odczytuje bezpośrednio kalendarze sal Google lub Microsoft i nie wymaga integracji z Envoy. Korzystaj z Envoy Visitors w recepcji, a z Booking przy drzwiach sal.
          visitor_management:
            question: Czy Booking obsługuje zarządzanie gośćmi?
            answer: Nie. Booking nie oferuje rejestracji gości, skanowania dokumentów tożsamości ani drukowania identyfikatorów. Każdy, kto zeskanuje kod QR na wyświetlaczu, może zarezerwować salę za pomocą telefonu, bez konta ani aplikacji TRMNL.
          platform_fee:
            question: Czy obowiązuje opłata za platformę?
            answer: Nie. Booking kosztuje $%{price} miesięcznie lub $%{annual_price} rocznie za każdy zasób dostępny do rezerwacji i wyświetlany na ekranie. To pełny koszt oprogramowania.
          existing_tablets:
            question: Czy mogę używać posiadanych tabletów?
            answer: Tak. Otwórz dowolną salę lub kolekcję pod jej prywatnym adresem URL w przeglądarce na tablecie, telewizorze lub ekranie LCD. Nie wymaga logowania ani aplikacji i odświeża się automatycznie. Wyświetlacz ePaper TRMNL jest opcjonalny i stanowi jednorazowy zakup.
          power_at_door:
            question: Czy wyświetlacze TRMNL wymagają zasilania przy drzwiach?
            answer: No. A TRMNL runs 4 to 8 months per charge at the default 15-minute refresh, and hangs from its hook recess. Recharge it over USB-C a few times a year.
          switch:
            question: Czy mogę przejść z Envoy bez przenoszenia danych?
            answer: Tak. Booking odczytuje te same kalendarze sal Google lub Microsoft, więc rezerwacje pozostają na swoim miejscu. Możesz korzystać z obu rozwiązań do końca umowy z Envoy.
          calendars:
            question: Jakie kalendarze są obsługiwane?
            answer: Google (konta osobiste i Workspace), Microsoft (Outlook, sale Exchange Online i przestrzenie robocze Microsoft Places) oraz dowolny kanał iCal.
