        case_study_description: Code Orange, studio programistyczne z Amsterdamu, zastąpiło własnoręcznie zbudowaną tablicę z Raspberry Pi aplikacją Booking. Kalendarze sal Google Workspace pozostają źródłem prawdy, a rezerwacje na miejscu przez QR obsługują gości bez dostępu do kalendarza.
