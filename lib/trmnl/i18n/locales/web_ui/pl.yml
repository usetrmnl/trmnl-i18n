          title: Poranne centrum dowodzenia
          body: 'Nad blatem, przy którym pijesz kawę: dzisiejszy plan, lista zakupów uzupełniana przez wszystkich i pomysł na kolację.'
        office:
          room: Domowe biuro
          title: Bądź na bieżąco z pracą jednym spojrzeniem
          body: 'Tuż obok monitora: następne spotkanie, dzisiejsze zadania, proces wdrożenia i lista obserwowanych pozycji — bez otwierania kolejnej karty przeglądarki.'
        bedroom:
          room: Sypialnia
          title: Obudź się z myślą o nowym dniu, a nie o telefonie
          body: 'Na komodzie naprzeciwko łóżka: pierwsze jutrzejsze wydarzenie, poranna prognoza i spokojna myśl na dzień — aby pierwszą rzeczą, po którą sięgasz, nie był ekran.'
