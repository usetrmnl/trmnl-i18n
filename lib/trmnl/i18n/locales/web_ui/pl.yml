        faq:
          trial:
            question: Czy mogę wypróbować Booking przed zapłatą?
            answer: 'Tak. Instalacja Booking i połączenie kalendarzy nic nie kosztują. Bezpłatny okres próbny trwający %{trial_days} dni rozpoczyna się, gdy wyświetlisz pierwszą salę na ekranie: wtedy poprosimy o kartę i nie pobierzemy opłat do końca okresu próbnego. Anuluj wcześniej, a nic nie zapłacisz.'
          minimum_rooms:
            question: Czy obowiązuje minimalna liczba sal?
            answer: Nie. Zacznij od jednej sali na jednym ekranie. Nie ma minimalnej wielkości zespołu ani minimalnego okresu subskrypcji.
          display_limit:
            question: Czy liczba wyświetlaczy jest ograniczona?
            answer: 'Nie. Wyświetlaj salę na dowolnej liczbie ekranów: TRMNL e-papier przy drzwiach, tabletach, telewizorach i ekranach korytarzowych. Sala liczy się raz, niezależnie od liczby wyświetlających ją ekranów.'
