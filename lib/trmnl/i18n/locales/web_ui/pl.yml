        faq:
          enterprise_wifi:
            question: Will it work on enterprise Wi-Fi?
            answer: TRMNL OG, and TRMNL X on 2.4 GHz, join WPA2-Enterprise (802.1X) networks. Check the EAP method, certificate needs and network policy with the customer's IT team before you deploy.
          gateway:
            question: Is a local gateway required?
            answer: No. Each display connects straight to the Wi-Fi network. There is no hub or bridge to install.
          permissions:
            question: Who sets up calendar and network access?
            answer: The customer's IT administrator approves the calendar connection and the Wi-Fi access. The partner and the customer agree on who does each step for each project.
          battery:
            question: How long does the battery last?
            answer: 3 to 6 months per charge at typical refresh rates. Faster refresh uses more battery, so a display next to a busy room can stay plugged in over USB-C.
          dealer:
            question: Can an office furniture dealer sell it?
            answer: Yes, as a referral or with assisted resale, where a qualified technician does the IT setup. We agree on terms and onboarding with each partner.
          mdm:
            question: Do TRMNL displays need MDM?
            answer: No. A TRMNL runs only TRMNL firmware. It pulls its screen from our server and cannot be accessed remotely. You manage it from the TRMNL dashboard.
          mounting:
            question: How does the display mount?
            answer: It hangs from its hook recess, with no cable to the door.
        pages:
          general:
            title: 'Partner with TRMNL Booking: Meeting Room Displays Without Cables'
            og_description: 'For AV integrators, IT service providers and workplace dealers: battery-powered ePaper room displays that connect straight to Wi-Fi and show your customers'' Google or Microsoft room calendars.'
            eyebrow: For AV integrators · IT service providers · Workplace dealers
            headline: Add meeting-room scheduling without adding cables.
            subhead: Offer your customers ePaper room displays that run on batteries, connect straight to Wi-Fi and show their existing Google or Microsoft calendars. From small offices to enterprise workplaces, show room availability without running power or Ethernet to every door.
            opportunity_title: Room scheduling shouldn't trigger an infrastructure project.
            opportunity_problem: A powered panel at every door can mean new electrical or network runs, work with facilities, and disruption in occupied or leased offices.
            opportunity_answer: Your customers still want an at-a-glance room schedule that matches the calendars they already use. A standard display that goes up without wiring is an easy add-on to conference-room upgrades, office moves and managed workplace services.
          integrators:
            name: AV & UC integrators
            partner_type: AV integrator
            title: Meeting Room Displays for AV & UC Integrators
            og_description: 'Add battery-powered ePaper room scheduling displays to your AV projects: no new power or network runs, on the customer''s Wi-Fi and their Google or Microsoft room calendars.'
            eyebrow: For AV & UC integrators
            headline: Add room scheduling to every AV project, without new cable runs.
            subhead: Put a battery-powered ePaper schedule at each meeting room door. It connects straight to the customer's Wi-Fi and shows their Google or Microsoft room calendars, so a retrofit needs no new power or network run to the door.
            opportunity_title: Retrofits shouldn't stall on a cable run.
            opportunity_problem: A powered panel at the door can add an electrician, a low-voltage run and facilities sign-off to a room refresh. Finished walls, glass and leased offices make that harder.
            opportunity_answer: A battery display lets you add scheduling to the room AV quote without a separate infrastructure job.
            outcome: Complete more room projects with a low-infrastructure scheduling option, particularly retrofits and glass or finished-wall spaces.
            bundle: Room AV, scheduling displays, installation and first-line service.
            roles: You install and commission. Customer IT approves network and calendar access. We take escalations.
            model_title: Resell & install
            model_description: You quote the hardware and project services. We support the product and its integrations.
          services:
            name: MSPs & IT service providers
            partner_type: MSP / IT service provider
            title: Meeting Room Displays for MSPs & IT Service Providers
            og_description: 'Add battery-powered ePaper meeting room displays to your managed services: WPA2-Enterprise Wi-Fi, Google Workspace and Microsoft 365 room calendars, and no MDM.'
            eyebrow: For MSPs & IT service providers
            headline: Add meeting-room displays to your managed services.
            subhead: Your customers already trust you with their Wi-Fi and their Google Workspace or Microsoft 365. Booking puts their room calendars on battery-powered ePaper displays that join WPA2-Enterprise networks and need no MDM.
            opportunity_title: A workplace product that fits the services you already run.
            opportunity_problem: Room displays usually mean tablets to enroll, lock down and keep powered, or panels that need new cabling.
            opportunity_answer: Booking displays connect straight to the network you manage and read the calendars you already administer, so they fit into your onboarding, provisioning and support.
            outcome: Add a tangible workplace product to your managed Wi-Fi and calendar services.
            bundle: Displays, network onboarding, calendar setup and optional managed support.
            roles: You own provisioning and Tier 1 support. We give Tier 2 and Tier 3 help.
            model_title: Managed-service bundle
            model_description: You combine display deployment with a service or support agreement.
          workspace:
            name: Furniture & workplace dealers
            partner_type: Furniture / workplace dealer
            title: Meeting Room Displays for Furniture & Workplace Dealers
            og_description: Finish every meeting room you furnish with a battery-powered ePaper schedule at the door. No cabling work, and the calendar setup is a separate IT handoff.
            eyebrow: For furniture & workplace dealers
            headline: Finish every meeting room with a schedule at the door.
            subhead: Add a battery-powered ePaper room display to each furniture or fit-out project. You sell and mount it, with no cabling work. The customer's IT team or an IT partner connects it to their calendars.
            opportunity_title: A finished room should show when it's free.
            opportunity_problem: New and redesigned meeting spaces open with no clear way to see who has the room, and a powered panel brings electricians and IT into your project.
            opportunity_answer: A battery display goes up with the furniture. The digital setup is a separate handoff, so your team never manages network or calendar access.
            outcome: Make every newly furnished or redesigned meeting space easier to use, without managing cabling work.
            bundle: Conference-room furniture, displays, physical mounting and an IT handoff.
            roles: You sell and mount. Customer IT, an MSP or we handle the digital setup.
            model_title: Referral & specification
            model_description: You introduce Booking, and optionally supply mounting and installation labor. Technical setup is handled separately.
