          cancel:
            question: Czy mogę anulować w dowolnym momencie?
            answer: Tak. Nie ma umowy ani opłaty za anulowanie. Po odinstalowaniu Booking subskrypcja kończy się wraz z opłaconym okresem.
          room_definition:
            question: Co liczy się jako sala?
            answer: 'Dowolny kalendarz wyświetlany na ekranie: sala spotkań, biurko, miejsce parkingowe lub pojazd. Połączony, ale niewyświetlany kalendarz nic nie kosztuje.'
          hardware:
            question: Czy potrzebuję sprzętu TRMNL?
            answer: Nie. Booking działa także na tabletach, telewizorach i dowolnym ekranie z przeglądarką. TRMNL e-papier to opcjonalny jednorazowy zakup.
