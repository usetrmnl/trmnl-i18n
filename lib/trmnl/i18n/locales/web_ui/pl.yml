        install_booking: Zainstaluj Booking
        og_description: Inteligentne wyświetlacze e-papierowe harmonogramów sal i system rezerwacji sal konferencyjnych. Wyświetlaj dostępność z kalendarza w czasie rzeczywistym, zapobiegaj podwójnym rezerwacjom i rezerwuj sale kodami QR.
        faq:
          visitor_account:
            question: Czy goście potrzebują konta TRMNL do rezerwacji?
            answer: Nie. Skanują kod QR na ekranie, wybierają termin i rezerwują. Rezerwacja trafia bezpośrednio do Twojego kalendarza.
          calendars:
            question: Z jakimi kalendarzami współpracuje?
            answer: Google (konta osobiste i Workspace), Microsoft (Outlook, sale Exchange Online i przestrzenie robocze Microsoft Places) oraz dowolny kanał iCal.
          double_booking:
            question: Co, jeśli ktoś w tym samym czasie zarezerwuje tę samą salę w Outlooku?
            answer: Sprawdzamy kalendarz ponownie tuż przed rezerwacją i odrzucamy nakładające się terminy. Twój kalendarz pozostaje źródłem prawdy.
          qr_code_photo:
            question: Czy można zarezerwować salę na podstawie zdjęcia kodu QR?
            answer: Włącz zabezpieczenie kodu QR, a link rezerwacji będzie zmieniał się codziennie, więc wczorajsze zdjęcie przestanie działać. Wydrukowane kody także przestaną działać, dlatego pozostaw tę opcję wyłączoną, jeśli z nich korzystasz.
          screen_updates:
            question: Jak często ekran się aktualizuje?
            answer: Renderujemy każdą salę ponownie co pięć minut, a urządzenie pobiera obraz zgodnie z własnym interwałem odświeżania. Częstsze odświeżanie zużywa więcej baterii, więc ekran obok obleganej sali najlepiej pozostawić podłączony do zasilania.
          tv_or_tablet:
            question: Czy mogę wyświetlać harmonogram na telewizorze lub tablecie?
            answer: Tak. Każdy kalendarz lub kolekcję można również otworzyć pod prywatnym adresem URL w przeglądarce na ekranie LCD, telewizorze lub tablecie. Nie wymaga logowania i sam się odświeża. Sala wyświetlana na TRMNL i pod adresem URL jest rozliczana raz.
          room_management:
            question: Jak e-papierowy wyświetlacz harmonogramu poprawia zarządzanie salami konferencyjnymi?
            answer: Wyświetlacze e-papierowe pokazują bieżącą dostępność, tytuły trwających spotkań i dane organizatorów bez odblasków i świecącego niebieskiego światła na korytarzach. Ponieważ działają miesiącami na baterii lub z zasilaniem USB-C, można je montować na szklanych ścianach i drzwiach bez prowadzenia przewodów PoE i wycinania otworów w ścianach.
          hallway_display:
            question: Czy TRMNL może służyć jako wyświetlacz korytarzowy dla wielu sal konferencyjnych?
            answer: 'Tak. Możesz grupować sale, biurka i przestrzenie robocze w kolekcje: do %{grid_size} w siatce lub %{list_size} na liście na jednym ekranie. Wyświetlacze na korytarzu i w recepcji dają szybki przegląd wolnych miejsc na całym piętrze.'
          walk_up_bookings:
            question: Jak system rezerwacji sal konferencyjnych obsługuje rezerwacje na miejscu?
            answer: Każdy może zeskanować kod QR na ekranie aparatem telefonu, aby natychmiast zarezerwować 15, 30 lub 60 minut. Nie trzeba instalować aplikacji ani logować się do TRMNL. Rezerwacja synchronizuje się bezpośrednio z kalendarzem Google Workspace lub Microsoft 365 w czasie rzeczywistym, zapobiegając podwójnym rezerwacjom.
          billing:
            question: Jak działa rozliczanie?
            answer: "$%{price} miesięcznie lub $%{annual_price} rocznie za każdy wyświetlany zasób podlegający rezerwacji, po bezpłatnym okresie próbnym trwającym %{trial_days} dni. Sala na trzech ekranach liczy się raz. Bez umowy."
          virtual_device:
            question: Czy mogę wypróbować bez TRMNL?
            answer: Tak. Utwórz bezpłatne urządzenie wirtualne, zainstaluj Booking i zobacz swoje sale na ekranie przed zakupem czegokolwiek.
