          battery:
            question: Jak długo działa bateria?
            answer: 4 to 8 months per charge at the default 15-minute refresh. Faster refresh uses more battery, so a display next to a busy room can stay plugged in over USB-C.
          dealer:
            question: Czy sprzedawca mebli biurowych może go sprzedawać?
            answer: Tak, w ramach polecenia lub wspomaganej odsprzedaży, gdzie konfigurację IT wykonuje wykwalifikowany technik. Uzgadniamy warunki i wdrożenie z każdym partnerem.
          mdm:
            question: Czy wyświetlacze TRMNL wymagają MDM?
            answer: Nie. TRMNL działa wyłącznie na firmware TRMNL. Pobiera ekran z naszego serwera i nie można uzyskać do niego zdalnego dostępu. Zarządzasz nim z pulpitu TRMNL.
          mounting:
            question: Jak zamontować wyświetlacz?
            answer: Wiesza się go za pomocą otworu montażowego, bez przewodu do drzwi.
