        customize_title: Dostosuj wyświetlacze sal
        customize_description: Dodaj logo firmy, zmień nazwy sal spotkań, wybierz 12- lub 24-godzinny format i włącz jasny lub ciemny motyw. Ustal zasady dotyczące tego, z jakim wyprzedzeniem można rezerwować zasoby.
