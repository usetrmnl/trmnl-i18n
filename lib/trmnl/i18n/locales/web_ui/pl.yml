          title: Ostatnie spojrzenie przed wyjściem
          body: 'Przy drzwiach, obok kluczy: najbliższy odjazd, czas dojazdu i informacja, czy przyda się kurtka — trzy rzeczy sprawdzane przed wyjściem.'
