  integration_overviews:
    alias: |-
      Tu propia imagen en una pantalla TRMNL de tinta electrónica. Alias está pensado para quienes ya generan sus pantallas en otro lugar, como un script en un servidor doméstico. Pega la URL completa de la imagen y el dispositivo la obtendrá directamente de esa dirección. También sirve una URL local como http://localhost:4567/image.png.

      La imagen debe estar preparada para tinta electrónica: BMP de 1 bit o PNG de 1 o 2 bits, con las dimensiones exactas de tu dispositivo. No la convertimos por ti (para eso está Image Display). Si sobrescribes el mismo archivo, desactiva la caché para que el dispositivo vuelva a dibujarlo cada vez aunque no cambie su nombre.
    apple_calendar: |-
      Tu calendario de Apple en una pantalla TRMNL de tinta electrónica. Puedes añadirlo de tres formas: pegando el enlace de un calendario público de iCloud, sincronizando desde tu iPhone o iPad mediante TRMNL Companion o iniciando sesión con tu Apple ID y una contraseña específica de aplicación para elegir qué calendarios de iCloud mostrar.

      Después, elige un diseño: agenda de hoy, próximos días, semana completa o laboral, cuadrícula mensual u horario minimalista. Muestra horas y descripciones de eventos, elige entre 12 y 24 horas, oculta eventos que contengan ciertas palabras y decide qué día empieza la semana. Una línea con la hora actual y el resaltado de hoy ayudan a situarte.
    apple_photos: |-
      Fotografías de un álbum compartido de Fotos de Apple en una pantalla TRMNL de tinta electrónica. Activa «Sitio web público» en la aplicación Fotos para ese álbum y pega su enlace en el plugin. Cada actualización elige una foto aleatoria.

      Selecciona «Cubrir» para llenar toda la pantalla, aunque se recorten los bordes, o «Contener» para mostrar la foto completa con márgenes. Las fotos que añadas al álbum entrarán en la rotación. TRMNL solo lee ese álbum compartido, no el resto de tu fototeca.
    asana: |-
      Tus tareas de Asana en una pantalla TRMNL de tinta electrónica. Conecta Asana, elige un espacio de trabajo y selecciona qué secciones de «Mis tareas» mostrar, como «Hacer hoy» o «Hacer después». En pantalla completa caben tres secciones una junto a otra; en los diseños pequeños, dos.

      Cada tarea muestra su nombre y vencimiento. Ordénalas por fecha, alfabéticamente o según Asana, y muestra el vencimiento como «Hoy», «Mañana», el día de la semana o una fecha corta. También puedes ver el proyecto e incluir tareas completadas. Solo admite «Mis tareas», no vistas de proyecto, listas compartidas ni subtareas.
    basecamp: |-
      Tus tareas pendientes de Basecamp en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta, selecciona un proyecto y reúne las tareas de sus listas en una sola pantalla.

      Las tareas se ordenan por fecha de vencimiento, con las más próximas primero. Para seguir varios proyectos, añade el plugin una vez por proyecto y colócalos juntos en un mashup.
    beehiiv: |-
      Estadísticas de tu último boletín de beehiiv en una pantalla TRMNL de tinta electrónica: asunto, destinatarios, aperturas y porcentaje de apertura, clics y porcentaje de clics, bajas y avisos de spam.

      La configuración es sencilla y no requiere código. En beehiiv, ve a Ajustes > Integraciones > API, crea una clave de API y copia el ID de tu publicación. Pega ambos datos en el plugin y guarda. Si gestionas varios boletines, añade el plugin una vez por publicación.
    bible_verses: |-
      Un versículo bíblico aleatorio en tu pantalla TRMNL de tinta electrónica, diferente con cada actualización. Aparece centrado bajo el título «Lectura del día», seguido del libro, capítulo y versículo.

      Elige una traducción: American Standard, King James o World English Bible. Es el único ajuste. Añade el plugin a tu lista de reproducción para alternarlo con el calendario o el tiempo.
    bitcoin_wallet_balance: |-
      El saldo de una cartera de Bitcoin en una pantalla TRMNL de tinta electrónica. Introduce una dirección pública y verás su saldo en BTC y dólares estadounidenses, junto a un gráfico de velas del precio de Bitcoin de los últimos 90 días.

      También se muestra la variación del precio en 7 y 90 días. TRMNL solo necesita la dirección pública, nunca tus claves. Si tienes varias carteras, añade el plugin una vez por dirección.
    caldav: |-
      Eventos de casi cualquier servicio de calendario en una pantalla TRMNL de tinta electrónica. Pega uno o varios enlaces públicos a calendarios .ics y añade cabeceras HTTP si tu servidor las necesita. También puedes sincronizar calendarios desde un iPhone o iPad mediante TRMNL Companion.

      Elige agenda diaria, próximos días, semana completa o laboral, cuadrícula mensual u horario minimalista. Configura horas y descripciones, formato de 12 o 24 horas, palabras para ocultar eventos y colores de los calendarios. Las vistas semanal y mensual permiten sombrear fines de semana, resaltar hoy, mostrar números de semana y marcar la hora actual.
    changelog: |-
      Novedades del equipo TRMNL en tu pantalla de tinta electrónica. Se muestran los anuncios más recientes primero, con su fecha y título. La pantalla completa añade una breve descripción.

      No necesita configuración. Añádelo a tu lista de reproducción para conocer las novedades y los nuevos plugins sin tener que consultar el correo ni las redes sociales.
    chatgpt: |-
      Respuestas de ChatGPT en una pantalla TRMNL de tinta electrónica. Escribe unas instrucciones que se repetirán en cada actualización para obtener una respuesta nueva: curiosidades, una palabra del día o ideas para escribir.

      Crea una clave de API en tu cuenta de OpenAI y pégala junto con las instrucciones. Elige un modelo y activa la búsqueda web si necesitas información actual; las fuentes aparecerán al pie. Se utiliza tu propia clave, por lo que el consumo se factura en tu cuenta de OpenAI y, si alcanzas los límites de solicitudes, la pantalla mostrará el error correspondiente.
    clicky: |-
      Las estadísticas de tu web de Clicky en una pantalla TRMNL de tinta electrónica: páginas vistas, visitantes, tiempo medio por página y un gráfico de visitas por día.

      Introduce el ID y la clave de tu sitio de Clicky y elige si consultar los últimos 1, 7, 14 o 30 días. Para seguir varios sitios, añade un plugin por sitio y combínalos en un mashup.
    clock: |-
      Un reloj para tu pantalla TRMNL de tinta electrónica. Elige un reloj analógico con esfera y agujas o uno digital con números de siete segmentos, como los LCD clásicos, y configura la zona horaria. Puede ocupar toda la pantalla, la mitad o un cuarto.

      El reloj digital muestra la hora en formato de 24 horas. Si tienes familiares o compañeros en otras ciudades, añade un reloj por zona horaria y colócalos en un mashup junto al calendario o al tiempo.
    close: |-
      Tu embudo de ventas de Close CRM en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta de Close y selecciona hasta tres estados para seguir, como «Activo» o «Ganado». Cada estado tiene su propia columna de oportunidades.

      Cada oportunidad muestra el nombre del contacto, su valor y la persona responsable de tu equipo. Elige las oportunidades actualizadas en los últimos 7, 14 o 30 días. Coloca la pantalla cerca de tu equipo comercial para que todos sepan cómo van las ventas.
    coinmarketcap: |-
      Precios de criptomonedas de CoinMarketCap en tiempo real en una pantalla TRMNL de tinta electrónica. Cada moneda muestra su símbolo, nombre, precio y variación de las últimas 24 horas.

      Añade tu clave de API de CoinMarketCap y los símbolos que quieras seguir, como BTC o ETH. Puedes destacar una moneda o mostrar hasta 12 en cuadrícula. Los precios se muestran en dólares estadounidenses de forma predeterminada, pero puedes elegir EUR, GBP, JPY o ZAR, con tipos de cambio de menos de un día.
    convertkit_analytics: |-
      Las estadísticas de tu boletín de ConvertKit en una pantalla TRMNL de tinta electrónica. A un lado se muestran los suscriptores y productos vendidos; al otro, los resultados de un envío: destinatarios, tasas de apertura y clics, clics, bajas y estado.

      Pega tu clave de API y secreto de ConvertKit y elige consultar los últimos 7, 30 o 90 días.
    custom_text: |-
      Tus propias palabras en una pantalla TRMNL de tinta electrónica: una cita, un objetivo o un recordatorio para beber agua. Escribe una frase o varias separadas por punto y coma y se mostrará una aleatoria en cada actualización.

      Admite Markdown para negrita, cursiva y listas; también puedes desactivarlo para mostrar el texto tal cual. El tamaño de letra se puede adaptar al espacio disponible, útil para textos largos, o mantenerse fijo. Alinea el texto a la izquierda, al centro o a la derecha y añade una frase a la barra de título inferior.
    days_left_retirement: |-
      Cuánto te queda para jubilarte en una pantalla TRMNL de tinta electrónica. Introduce tu fecha de nacimiento y la edad a la que quieres jubilarte. Verás el porcentaje transcurrido, las semanas que faltan y una barra de progreso que avanza con los años.

      Contar las semanas hace que el tiempo resulte más tangible. Añádelo a tu lista de reproducción como recordatorio de dedicar el tiempo a lo importante.
    days_left_until: |-
      Una cuenta atrás hasta cualquier fecha en una pantalla TRMNL de tinta electrónica: un lanzamiento, un viaje, una entrega o una boda. Establece una fecha de inicio y otra de fin y verás los días transcurridos, los que quedan y una barra de progreso.

      Si solo quieres un número, oculta los días transcurridos o los restantes. Para seguir varias fechas, añade el plugin una vez por cada una.
    days_left_year: |-
      Todo el año de un vistazo en una pantalla TRMNL de tinta electrónica. Cada día aparece como un pequeño cuadrado organizado por semanas. Los días pasados están sombreados, hoy se marca en negro y el resto queda pendiente. Encima se muestran los días transcurridos y los que faltan.

      No necesitas configurar nada: añádelo y guarda. Utiliza la zona horaria de tu cuenta y vuelve a empezar cada 1 de enero.
    days_since: |-
      Cuenta los días transcurridos desde una fecha importante en una pantalla TRMNL de tinta electrónica: un hábito que dejaste, el inicio de tu empresa o el último fallo de una compilación. Se muestran la fecha de inicio y los días transcurridos.

      Elige la fecha y su formato, por ejemplo «26 de noviembre de 2024», 2024-11-26 o 11/26/2024. Para seguir varias fechas, añade un plugin por fecha y combínalos en un mashup.
    dropbox_photo_album: |-
      Convierte tu pantalla TRMNL de tinta electrónica en un marco digital conectado a Dropbox. Conecta tu cuenta y crearemos una carpeta para TRMNL dentro de Aplicaciones. Añade fotos y cada actualización mostrará una aleatoria, ajustada a la pantalla.

      TRMNL solo puede leer y compartir archivos de esa carpeta, nunca del resto de Dropbox. Para pantallas verticales, sube fotos verticales; para las horizontales, fotos apaisadas. Puedes añadir o quitar fotos cuando quieras y la rotación se actualizará.
    eight_sleep: |-
      Tus datos de Eight Sleep en una pantalla TRMNL de tinta electrónica. Cada mañana podrás ver la puntuación de sueño de los últimos siete días y la media semanal, con una valoración de baja a buena.

      También se muestran las medias semanales de calidad de sueño, ronquidos, sueño profundo, REM, tiempo para conciliar el sueño y tiempo total dormido. Solo necesitas el correo y la contraseña de Eight Sleep. Como no tiene API oficial, accedemos igual que su aplicación. Este plugin ocupa toda la pantalla y no admite mashups.
    email_meter: |-
      Estadísticas de tu bandeja de Gmail mediante Email Meter en una pantalla TRMNL de tinta electrónica: mensajes enviados y sus destinatarios, recibidos y sus remitentes, y tiempo medio de respuesta.

      Consulta los últimos 1, 7 o 30 días. Para configurarlo, inicia sesión en Email Meter, abre la consola del navegador y copia el token de sesión con la instrucción que aparece en los ajustes (no necesitas programar). El token caduca al terminar la sesión; cuando se rechace, copia otro y pégalo.
    enphase: |-
      Tu sistema solar Enphase en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta, selecciona la instalación y verás la curva de producción de hoy, una cifra principal y la hora de la última comunicación.

      Elige la cifra principal: energía producida, consumida, importada o exportada hoy, balance neto, potencia máxima, producción actual, autoconsumo solar, dependencia de la red, producción histórica o batería. Selecciona después las demás métricas que quieras mostrar. En diseños pequeños aparecen las que quepan primero. Si no tienes medidor de consumo, se omiten las cifras que el sistema no puede proporcionar, en lugar de mostrarlas a cero.
    ethereum_wallet_balance: |-
      El saldo de tu cartera Ethereum en una pantalla TRMNL de tinta electrónica. Introduce la dirección pública para ver su valor en dólares estadounidenses, la cantidad de ETH, la variación del precio en 7 y 90 días y un gráfico de los últimos 90 días.

      Solo se utiliza la dirección pública: sin claves, sin iniciar sesión y sin posibilidad de mover fondos. Para seguir varias carteras, añade el plugin una vez por dirección.
    etsy: |-
      Las ventas de tu tienda de Etsy en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta, selecciona la tienda y consulta las ventas totales, el importe medio de los pedidos y cuántos están pendientes o completados.

      Un gráfico compara las ventas diarias con el periodo anterior. Elige los últimos 7, 30 o 90 días o lo transcurrido del mes. Se excluyen los pedidos cancelados, y los que aún no se han pagado no cuentan como ventas.
    fastmail_calendar: |-
      Tu calendario de Fastmail en una pantalla TRMNL de tinta electrónica. Publica el calendario desde sus ajustes «Editar y compartir», con todos los detalles o solo disponibilidad, y pega el enlace (cambia «webcal» por «https»). Para varios calendarios, introduce un enlace por línea. También puedes sincronizar desde iPhone o iPad mediante TRMNL Companion.

      Elige agenda de hoy, próximos días, semana completa o laboral, cuadrícula mensual u horario minimalista. Configura horas y descripciones, formato de 12 o 24 horas, palabras para ocultar eventos y colores. Las vistas semanal y mensual permiten sombrear fines de semana, resaltar hoy y mostrar números de semana.
    fera: |-
      Tus reseñas de Fera en una pantalla TRMNL de tinta electrónica. Arriba aparecen la valoración media, el total de reseñas, el porcentaje de verificadas y el número de productos reseñados. Debajo verás las últimas reseñas con estrellas, títulos y texto.

      Conecta tu cuenta de Fera y elige cuáles mostrar: aprobadas (predeterminado), pendientes de aprobación, de actualización, rechazadas o pendientes. TRMNL solo lee las reseñas, no puede modificarlas. Puedes desconectarlo desde Fera cuando quieras.
    gaffa: |-
      Tu propia portada de noticias en una pantalla TRMNL de tinta electrónica, creada con la IA de Gaffa. Introduce la dirección de cualquier medio y Gaffa leerá la página, elegirá las principales noticias y redactará un breve resumen de cada una. Aparecerá una lista numerada de titulares con una o dos líneas de contexto.

      Personaliza los resúmenes con instrucciones como «prioriza las noticias internacionales y evita los titulares sensacionalistas», y cambia el título de la pantalla. La prueba gratuita de Gaffa cubre los seis primeros meses. Después, añade tu propia clave de API de Gaffa.
    github_commit_graph: |-
      Tu gráfico de contribuciones de GitHub en una pantalla TRMNL de tinta electrónica. Introduce tu nombre de usuario de GitHub (sin @) para ver el último año de actividad en una cuadrícula cuyos días son más oscuros cuanto más hayas contribuido.

      También aparecen el total de contribuciones del año, las rachas más larga y actual, el día más activo y la media diaria. No necesitas conectar ninguna cuenta ni usar un token, solo el nombre de usuario. Para ver el gráfico de un compañero, añade el plugin con su nombre.
    github_commits: |-
      Los últimos commits de cualquier repositorio de GitHub en una pantalla TRMNL de tinta electrónica. Cada línea muestra el mensaje, el autor, la fecha, la hora y el hash abreviado.

      Introduce «organización/repositorio» o pega su enlace de GitHub. Deja la rama vacía para seguir la predeterminada o escribe otra para seguirla. Los repositorios públicos no necesitan nada más. Para uno privado, selecciona visibilidad privada y añade un token de acceso granular con permiso de lectura del contenido. Si GitHub falla temporalmente, se conserva la última lista correcta.
    github_contributor_summary: |-
      Descubre quién contribuye a tu repositorio de GitHub en una pantalla TRMNL de tinta electrónica. Una tabla muestra el nombre de usuario de cada colaborador, sus commits de la última semana y el total histórico.

      Introduce «usuario/repositorio» y un token de acceso granular creado en los ajustes de GitHub. Solo necesita permiso de lectura de metadatos. GitHub muestra el token una sola vez, así que cópialo directamente a TRMNL. Para varios repositorios, añade el plugin una vez por cada uno.
    google_analytics: |-
      Tus estadísticas de Google Analytics en una pantalla TRMNL de tinta electrónica: páginas vistas, sesiones, visitantes, duración media de la sesión y gráfico diario de páginas vistas.

      Conecta Google, introduce el ID de propiedad del sitio y elige los últimos 7, 30 o 90 días. Puedes incluir hoy o terminar ayer para evitar que el gráfico caiga al final por tratarse de un día aún incompleto. Para seguir varios sitios, añade el plugin por cada propiedad.
    google_calendar: |-
      Tu Google Calendar en una pantalla TRMNL de tinta electrónica. Inicia sesión con Google y selecciona los calendarios. Puedes conectar varias cuentas, por ejemplo la personal y la del trabajo, para ver sus eventos juntos.

      Elige agenda de hoy, próximos días, semana completa o laboral, cuadrícula mensual u horario minimalista. Muestra horas y descripciones, elige 12 o 24 horas, oculta eventos que contengan ciertas palabras o muestra solo los que hayas aceptado. También puedes marcar la hora actual; las vistas semanal y mensual permiten sombrear fines de semana, resaltar hoy y mostrar números de semana.
    google_drive_photos: |-
      Convierte una carpeta de Google Drive en un marco de fotos para tu pantalla TRMNL de tinta electrónica. Cada actualización muestra una imagen aleatoria de la carpeta: JPEG, PNG, GIF, BMP, WebP o TIFF.

      No necesitas iniciar sesión con Google. Comparte la carpeta con la dirección de correo de TRMNL indicada en los ajustes, con permiso de lector, y pega el enlace. TRMNL solo accederá a lo que compartas. Las fotos de esa carpeta entran en la rotación, pero no las de subcarpetas. Selecciona «Cubrir» para llenar la pantalla recortando los bordes o «Contener» para mostrar la foto completa con márgenes.
    google_photos: |-
      Fotos de tu biblioteca de Google Fotos en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta de Google y elige manualmente las fotos en el selector de Google. Cada actualización mostrará una de ellas al azar.

      TRMNL solo puede ver las fotos que hayas elegido, no el resto de tu biblioteca. Selecciona «Cubrir» para llenar la pantalla recortando los bordes o «Contener» para mostrar la foto completa con márgenes. Google caduca ese acceso a los siete días, así que tendrás que volver a elegirlas periódicamente. Los ajustes indican cuándo caduca.
    google_tasks: |-
      Tus tareas de Google Tasks en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta de Google, elige una lista y verás las tareas pendientes con sus fechas de vencimiento. Las completadas no aparecen.

      Ordénalas por fecha o conserva el orden de la aplicación. Las subtareas aparecen debajo de su tarea principal, con sangría. Puedes alinear la lista arriba, al centro o abajo. Para mostrar una lista personal y otra de trabajo, añade el plugin por separado y combínalas en un mashup.
    gumroad_analytics: |-
      Tus ventas de Gumroad en una pantalla TRMNL de tinta electrónica. Dos cifras principales: cuántas ventas has realizado y cuánto dinero han generado.

      Conecta Gumroad y elige consultar los últimos 7, 30 o 90 días. No necesitas más configuración. Si quieres comparar esta semana y este trimestre, añade el plugin dos veces, con intervalos de 7 y 90 días. Coloca la pantalla donde puedas seguir tus resultados mientras trabajas.
    hacker_news: |-
      Las noticias tecnológicas que la comunidad está leyendo ahora en una pantalla TRMNL de tinta electrónica. Se muestran las publicaciones de Hacker News por orden, con título, votos y autor. La pantalla completa las distribuye en dos columnas.

      Solo tienes que elegir una opción: «Top Stories», con las noticias mejor clasificadas ahora mismo, o «Show HN», con proyectos que la comunidad ha creado y quiere enseñar. En este último caso se elimina el prefijo «Show HN:» de los títulos. En un mashup ocupa la mitad o un cuarto de la pantalla.
    home_assistant_screenshot: |-
      Tus paneles de Home Assistant en una pantalla TRMNL de tinta electrónica. Este plugin funciona con el complemento TRMNL HA, que captura tus paneles dentro de tu propia red, prepara las imágenes para tinta electrónica y las envía a una URL de webhook privada. No se accede a tu red desde fuera.

      Instala el complemento desde la tienda de Home Assistant o ejecútalo en un contenedor si usas Docker. Configura un horario, el modelo de dispositivo y la URL de webhook. En TRMNL, elige si la imagen debe ocupar todo su espacio o mostrarse entera en pantallas compartidas, así como el color del fondo sobrante.
    homey: |-
      Tu hogar inteligente Homey en una pantalla TRMNL de tinta electrónica. La vista general muestra mediciones de energía, temperatura y humedad, alarmas activas y dispositivos. La vista de pilas lista los dispositivos de menor a mayor carga. Insights representa una medición de la última hora, día, semana o mes.

      Puedes obtener los datos de dos maneras: instala la aplicación TRMNL para Homey (o HomeyScript) y pega la URL Push del plugin; o vincula tu cuenta para que TRMNL lea desde la nube de Homey y selecciona el dispositivo. Muestra todas las zonas o solo una habitación. Este plugin también alimenta las recetas Homey del catálogo de TRMNL.
    hubspot: |-
      Tus oportunidades de HubSpot en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta, elige un embudo de ventas y selecciona hasta tres fases que quieras seguir.

      Cada fase tiene una columna con el nombre, importe y responsable de las oportunidades. Así puedes ver de un vistazo el estado de las ventas sin abrir el CRM. Para seguir más fases u otro embudo, añade el plugin de nuevo y combínalos en un mashup.
    huckleberry: |-
      El día a día de tu bebé desde Huckleberry en una pantalla TRMNL de tinta electrónica. Se muestra su nombre y edad, si está dormido o despierto y desde cuándo, y la próxima siesta o hora de dormir sugerida por SweetSpot. También aparecen la última toma de biberón, lactancia, sólidos y cambio de pañal, junto al horario previsto del día.

      Inicia sesión con las mismas credenciales de Huckleberry y selecciona al niño. Al no existir una API oficial, accedemos como lo hace su aplicación y leemos los mismos datos. Para seguir a dos niños, añade el plugin por separado y combínalos en un mashup.
    image_display: |-
      Cualquier imagen de internet en una pantalla TRMNL de tinta electrónica. Introduce la URL y TRMNL la convertirá al formato de tu pantalla. Puedes añadir varias direcciones, una por línea, y mostrar una aleatoria en cada actualización. Los enlaces compartidos de Google Drive también funcionan directamente.

      Utilízalo para fotos, gráficos, paneles de otro sistema o capturas de cámaras. Puedes cubrir toda la pantalla, ajustar la imagen con un fondo o estirarla. También admite servidores domésticos con certificados autofirmados. Si el servidor envía las cabeceras ETag o Last-Modified, TRMNL solo volverá a dibujar la imagen cuando cambie.
    kickstarter: |-
      Proyectos de financiación colectiva interesantes en una pantalla TRMNL de tinta electrónica. Cada proyecto de Kickstarter muestra nombre, descripción corta, porcentaje conseguido, importe recaudado en dólares y país de origen.

      Selecciona «Top» para ver los proyectos activos que más han recaudado o «Ending Soon» para ver las campañas que están a punto de terminar. Es el único ajuste.
    language_learning: |-
      Una palabra en el idioma que estás aprendiendo en una pantalla TRMNL de tinta electrónica. Se muestra la palabra, su significado en inglés y una frase de ejemplo.

      Elige entre trece idiomas: portugués brasileño, danés, neerlandés, inglés, francés, griego, italiano, japonés, coreano, noruego, español, sueco o turco. Cada actualización avanza a la siguiente palabra de una lista de miles de términos cotidianos y TRMNL guarda tu progreso. Para estudiar una palabra durante más tiempo, reduce la frecuencia de actualización.
    letterboxd: |-
      Tu diario de Letterboxd en una pantalla TRMNL de tinta electrónica. Inicia sesión y verás las películas registradas recientemente con fecha de visionado, año de estreno, valoración en estrellas, un corazón si te gustaron y una marca si las has vuelto a ver. Los diseños grandes añaden el cartel de la última película.

      ¿Quieres saber qué ven tus amigos? Cambia al modo «Amigos» para ver entradas y reseñas recientes de las personas a las que sigues, con su nombre, valoración y cartel cuando haya espacio.
    lunar_calendar: |-
      La fase de la Luna en una pantalla TRMNL de tinta electrónica. La pantalla muestra la fase actual, el porcentaje iluminado y su edad en días. Debajo aparece una cronología de fases cercanas a hoy, con sus fechas, seguida de la próxima fase, la próxima luna llena y la próxima luna nueva.

      Solo hay un ajuste: «Detallado» dibuja imágenes realistas de la Luna y «Sencillo» utiliza iconos. No necesita ubicación. Las fechas siguen la zona horaria de tu cuenta.
    lunch_money: |-
      Tus finanzas de Lunch Money en una pantalla TRMNL de tinta electrónica. Crea un token de acceso en los ajustes para desarrolladores de Lunch Money, pégalo y elige qué mostrar.

      «Presupuestos» muestra los gastos del mes por categoría, de mayor a menor, y un gráfico comparado con el presupuesto. Elige categorías principales o secundarias para no contabilizar dos veces los gastos agrupados. «Cuentas» muestra saldos de cuentas, activos y pasivos. «Patrimonio neto» muestra el valor actual, su variación y un gráfico de activos y pasivos de los últimos 3, 6, 9 o 12 meses. Los importes utilizan la moneda principal de Lunch Money.
    mailchimp_analytics: |-
      Las estadísticas de tus contactos de Mailchimp en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta y elige la audiencia que quieras seguir.

      «Actividad reciente» muestra correos enviados y tasa de apertura, seguidos de aperturas únicas, clics, rebotes permanentes y temporales, nuevas suscripciones y bajas. «Historial de crecimiento» conserva los correos enviados y la tasa de apertura y sustituye el resto por un gráfico mensual de suscriptores. Para varios boletines, añade el plugin una vez por audiencia.
    mazevo: |-
      Convierte una pantalla TRMNL de tinta electrónica en un cartel de sala para espacios reservados con Mazévo. Muestra si la sala está ocupada, con el nombre y la hora de la reserva actual, o si está libre y hasta cuándo. Debajo aparecen las demás reservas de hoy.

      Conecta una clave y una URL de API de Mazévo, que admite reservas de la organización y privadas, o un feed iCal, que solo muestra nombres y horarios. Selecciona la sala e introduce un título personalizado, cambia la etiqueta «Disponible», añade una nota al pie, oculta o muestra reservas finalizadas y elige formato de 12 o 24 horas. Las reservas privadas se identifican como tales sin mostrar nombres.
    microsoft_todo: |-
      Tus tareas de Microsoft To Do en una pantalla TRMNL de tinta electrónica. Inicia sesión con Microsoft y selecciona la lista.

      Se muestran las tareas pendientes con vencimiento y un resumen de sus notas. Las completadas desaparecen de la pantalla. Puedes alinear las tareas arriba, al centro o abajo. Para mostrar la lista de trabajo y la de la compra, añade el plugin dos veces y combínalas en un mashup.
    mondrian: |-
      Arte generativo al estilo de Piet Mondrian en una pantalla TRMNL de tinta electrónica. Cada vez que se dibuja, la pantalla se divide en una cuadrícula aleatoria de líneas negras gruesas y bloques de color. No hay dos imágenes iguales.

      No necesita configuración. Añádelo a una lista de reproducción para alternarlo con tus datos o colócalo en un mashup como una pequeña obra de arte junto al calendario o al tiempo.
    motivational_quote: |-
      Una cita motivadora diaria en una pantalla TRMNL de tinta electrónica. Aparece con letra grande y el nombre del autor debajo. Las frases provienen de la cita del día de ZenQuotes, así que cambian diariamente y todos ven la misma.

      No necesita configuración. Añádelo a tu lista de reproducción o a un mashup junto al calendario para tener algo en lo que pensar entre reuniones.
    nano_banana_dashboard: |-
      Tus datos de TRMNL convertidos en imágenes por los modelos Gemini de Google, conocidos como Nano Banana. Selecciona hasta tres plugins como fuentes de datos y Gemini los transformará en una escena: la portada de un periódico, una pizarra de cafetería, una sala de control y más.

      Necesitas tu propia clave de API de Gemini desde Google AI Studio, con facturación activada, y elegir Flash, Flash 2.5 o Pro. Personaliza el texto, los datos prioritarios, la escena (o elige aleatoria), las notas de estilo y la relación de aspecto. También puedes escribir todas las instrucciones. Solo se genera una nueva imagen cuando cambian los datos o los ajustes.
    netatmo_weather_station: |-
      Lecturas de tu estación meteorológica Netatmo en una pantalla TRMNL de tinta electrónica. Inicia sesión en Netatmo para conceder acceso de solo lectura y elige la estación y, si quieres, el módulo de mediciones interiores.

      El modo básico destaca la temperatura exterior y su gráfico, seguido de temperatura interior, humedad y CO2, además de humedad exterior, presión, ruido y valores mínimo y máximo del día. Si tienes pluviómetro o anemómetro, también aparecerán sus datos. El modo gráfico muestra una sola métrica: temperatura, humedad, CO2, ruido, presión, lluvia o viento. Elige grados Celsius o Fahrenheit y, si lo prefieres, nudos para el viento.
    nextcloud_calendar: |-
      Tu calendario de Nextcloud en una pantalla TRMNL de tinta electrónica. Comparte un enlace del calendario desde Nextcloud y pégalo (uno por línea si tienes varios) o sincroniza desde iPhone o iPad mediante TRMNL Companion.

      Elige agenda de hoy, próximos días, semana completa, móvil o laboral, semana de tres días, cuadrícula mensual o mensual móvil, u horario minimalista. Muestra horas y descripciones, formato de 12 o 24 horas y colores de calendarios, y oculta eventos por palabras. Las vistas semanal y mensual pueden sombrear fines de semana, destacar hoy, mostrar números de semana y marcar la hora actual.
    notion: |-
      Tus bases de datos y páginas de Notion en una pantalla TRMNL de tinta electrónica. Conecta Notion con permiso de solo lectura, elige qué contenidos puede ver TRMNL y selecciona una base de datos o una página.

      En una base de datos, elige qué propiedad será el título, cuál aparecerá como etiqueta grande de estado y cuáles se mostrarán como etiquetas pequeñas o detalles. Ordena y filtra con la sintaxis de Notion (también admite fechas dinámicas como «hoy más 7 días»), establece el número de elementos y elige una o dos columnas. En una página se muestran sus contenidos en orden: texto, encabezados, listas, imágenes y más.
    outlook_calendar: |-
      Tu calendario de Outlook en una pantalla TRMNL de tinta electrónica. Inicia sesión con Microsoft y selecciona los calendarios. Si no eliges ninguno, se utilizará el predeterminado.

      Elige agenda de hoy, próximos días, semana completa o laboral, cuadrícula mensual u horario minimalista. Muestra horas y descripciones, usa 12 o 24 horas, oculta eventos que contengan ciertas palabras y muestra solo los aceptados. Las vistas semanal y mensual permiten sombrear fines de semana, destacar hoy y mostrar números de semana. Una línea con la hora actual te ayuda a seguir una agenda organizada por horas.
    parcel: |-
      Tus envíos de la aplicación Parcel en una pantalla TRMNL de tinta electrónica. Cada paquete muestra su estado, como en tránsito o en reparto, nombre, último seguimiento y entrega prevista: hoy, mañana, un día de la semana o una fecha.

      Necesitas una suscripción de pago a Parcel. Inicia sesión en web.parcelapp.net, crea una clave de API y pégala. Muestra envíos activos o recientes, elige el estilo detallado o compacto (sin el último evento de seguimiento) y decide qué hacer cuando no haya envíos: mostrar la pantalla vacía u omitirla.
    place_of_the_day: |-
      Un lugar nuevo cada día en tu pantalla TRMNL de tinta electrónica: una ciudad o una maravilla del mundo. Aparecen su nombre, región, país, mapa de calles y una breve descripción, normalmente de Wikipedia. Cuando existen datos, también muestra población, año de fundación, altitud, superficie, hora local y coordenadas.

      No necesita configuración. Todos los usuarios del plugin ven el mismo lugar cada día, alternando entre Europa, América y el resto del mundo.
    poetry_today: |-
      Un poema en tu pantalla TRMNL de tinta electrónica, con el título arriba y el nombre del poeta en una esquina. Cada actualización elige uno al azar de PoetryDB, una colección pública de poesía clásica.

      No necesitas configurar nada. Solo se seleccionan poemas que quepan en la pantalla, de hasta 24 versos, para que ninguno quede cortado por la mitad. Combínalo con un reloj o calendario en un mashup si buscas algo más tranquilo que tu bandeja de entrada.
    polymarket: |-
      Mercados de predicción de Polymarket en una pantalla TRMNL de tinta electrónica. Selecciona un tema y verás hasta 12 mercados abiertos con sus preguntas, número de comentarios y dinero apostado.

      Los temas incluyen negocios, cultura popular, deportes, criptomonedas, ciencia y política. No necesitas cuenta de Polymarket. Solo se muestran mercados activos que cierran dentro de dos semanas, para seguir predicciones que se resuelvan pronto. Si quieres un tema que no aparece, escribe a soporte con el ID de etiqueta de Polymarket para añadirlo a tu cuenta.
    postmark_analytics: |-
      Las estadísticas de correo de Postmark en una pantalla TRMNL de tinta electrónica. Introduce un token de API de servidor de Postmark y elige los últimos 7, 30 o 90 días.

      Las cifras principales son correos enviados y tasa de apertura. Debajo aparecen aperturas únicas, clics, rebotes, errores, reclamaciones de spam y tasa de rebote. Útil para equipos de operaciones o soporte, que podrán detectar picos de rebotes antes de que alguien pregunte por un correo de recuperación de contraseña.
    private_plugin: |-
      Crea tu propia pantalla TRMNL de tinta electrónica. Escribe HTML con plantillas Liquid y el framework de diseño de TRMNL y elige la fuente de datos: una URL que TRMNL consulta para obtener JSON, XML o texto, un webhook al que tu código envía datos, JSON estático o datos de otros plugins de TRMNL.

      Las consultas admiten GET, POST, cabeceras, cuerpo de solicitud y OAuth para servicios con inicio de sesión. Añade campos de formulario para configurar el plugin sin modificar código, transforma los datos con scripts en Node, PHP, Python o Ruby y compártelo como receta cuando esté listo.
    product_hunt: |-
      Los lanzamientos destacados de Product Hunt en una pantalla TRMNL de tinta electrónica. Cada producto muestra su nombre, una descripción breve y el número de votos en una lista numerada.

      No necesitas conectar nada ni tener cuenta. Añade el plugin y la lista se actualizará sola. Si desarrollas un producto, podrás seguir los lanzamientos y su popularidad sin abrir otra pestaña. Funciona en pantalla completa, media pantalla o un cuarto junto a otros plugins.
    profit_well: |-
      Tu facturación de ProfitWell en una pantalla TRMNL de tinta electrónica. Pega el token de API de ProfitWell y consulta las cifras actuales de tu cuenta.

      Arriba aparecen los nuevos ingresos recurrentes y los ingresos recurrentes totales. Debajo se muestran ingresos perdidos por cancelaciones, clientes activos, nuevos clientes y clientes perdidos. Si gestionas un SaaS, tener estas cifras a la vista te ayudará a detectar aumentos de cancelaciones a tiempo.
    proton_calendar: |-
      Tu Proton Calendar en una pantalla TRMNL de tinta electrónica. Puedes pegar el enlace .ics de un calendario compartido de Proton o sincronizar desde iPhone o iPad mediante TRMNL Companion. Si te preocupa la privacidad, Proton permite compartir un enlace que solo indica cuándo estás ocupado, sin detalles de los eventos.

      Elige agenda de hoy, próximos días, semana completa, móvil, laboral o de tres días, cuadrícula mensual u horario minimalista. Muestra horas y descripciones, formato de 12 o 24 horas, oculta eventos por palabras y elige el primer día de la semana. Las vistas semanal y mensual pueden sombrear fines de semana, resaltar hoy y mostrar números de semana.
    purpleair: |-
      Lecturas de un sensor PurpleAir en una pantalla TRMNL de tinta electrónica. Usa uno propio o cualquiera de los públicos del mapa de PurpleAir. Introduce su ID y una clave de API de PurpleAir; para sensores privados necesitarás además una clave de lectura.

      Elige la vista de calidad del aire, con niveles actuales de PM2.5 y PM10 y un gráfico de las últimas 24 horas comparado con las categorías de la EPA, de «Buena» a «Muy insalubre». O muestra temperatura y humedad en Celsius o Fahrenheit. Solo se consultan los cambios desde la última actualización para ahorrar créditos gratuitos de API.
    readwise: |-
      Tus fragmentos destacados de Readwise en una pantalla TRMNL de tinta electrónica. Genera un token de acceso en Readwise y pégalo en el plugin.

      Cada actualización muestra un fragmento de tu repaso diario de Readwise, junto con el título del libro o artículo y su autor. La siguiente actualización pasa al siguiente fragmento. Así podrás volver a leer lo que guardaste en lugar de dejarlo olvidado en una aplicación.
    reddit: |-
      Las publicaciones más votadas de tus subreddits favoritos en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta de Reddit y añade hasta tres subreddits; cada uno tiene su propia columna.

      Ordena por populares, nuevos o destacados y elige un intervalo desde la última hora hasta todo el historial. Se omiten las publicaciones fijadas, que suelen cambiar poco. Muestra u oculta los votos y el nombre de usuario bajo los títulos y limita los títulos largos a una línea para mostrar más publicaciones.
    redirect: |-
      Una herramienta para desarrolladores que generan sus propias imágenes. Cuando tu pantalla TRMNL de tinta electrónica se conecta, consultamos una URL de tu servidor y enviamos la respuesta directamente al dispositivo: la dirección de la imagen, su nombre de archivo y cuánto debe dormir antes de volver a conectarse.

      Tu servidor decide qué mostrar y cuándo en cada conexión. La URL puede cambiar en cada solicitud y apuntar incluso a tu red local. Si envías dos veces el mismo nombre de archivo, la pantalla no se redibuja, lo que ahorra parpadeos y batería. Puedes establecer intervalos de reposo de hasta solo un minuto. Si ya usas Alias y necesitas más control, esta es la siguiente opción.
    rss_feed: |-
      Cualquier feed RSS o Atom en una pantalla TRMNL de tinta electrónica. Pega su dirección y elige un diseño.

      «Destacado» muestra la publicación más reciente con título, texto e imágenes. «Lista» muestra hasta ocho publicaciones recientes con título y un resumen breve sin formato. Ideal para seguir blogs, noticias, pódcast o foros con feed. También puedes consultar feeds de servidores domésticos con certificados autofirmados.
    screen_wiper: |-
      Reduce las imágenes residuales de tu pantalla TRMNL de tinta electrónica. Son restos tenues de imágenes anteriores que pueden acumularse con el tiempo. Cuando el dispositivo llega a Screen Wiper en la lista de reproducción, ejecuta ciclos especiales alternando negro y blanco y después pasa al siguiente elemento.

      Añade el plugin y guarda. Según el dispositivo, la limpieza puede durar entre 30 y 60 segundos o hasta cinco minutos. Usa la programación para ejecutarla una vez al día o a la semana, preferiblemente después de salir del reposo. Necesita firmware 1.8.14 o posterior.
    screensaver: |-
      Arte para tu pantalla TRMNL de tinta electrónica. Cada actualización selecciona una imagen aleatoria de nuestra colección de salvapantallas: la Mona Lisa, Roma, las misiones Apolo, una estación espacial y otras imágenes preparadas para verse bien en tinta electrónica.

      No necesita configuración. Añádelo a la lista de reproducción para disfrutar de una imagen entre reuniones o por la noche. La colección es pequeña, pero sigue creciendo y acepta propuestas. Si quieres sugerir una imagen, escribe a support@trmnl.com.
    screenshot: |-
      Cualquier página web pública en una pantalla TRMNL de tinta electrónica. Pega su URL y capturaremos una imagen de la página: resultados deportivos, un panel de estado o el menú escolar, por ejemplo.

      Si necesita un token de acceso, añade cabeceras HTTP. Corregimos los enlaces relativos de estilos, scripts e imágenes para que se vea como en el navegador, aunque puedes desactivar esa opción. Si el HTML no cambia, evitamos redibujarla. Para paneles que cargan datos con JavaScript, activa la actualización permanente. Consejo: configura el navegador a 800x480 para ver el mismo encuadre que TRMNL.
    shopify: |-
      Tus ventas de Shopify en una pantalla TRMNL de tinta electrónica. Crea una aplicación personalizada en la administración de Shopify con acceso de solo lectura a los pedidos e introduce su token y la dirección de la tienda. Nuestro artículo de ayuda explica cómo hacerlo.

      Elige los últimos 7 o 30 días o lo transcurrido del mes. Verás ventas totales comparadas con el periodo anterior, pedidos pendientes y completados, valor medio y un gráfico diario de ventas. Los importes aparecen en la moneda de tu tienda. TRMNL solo lee pedidos, nada más.
    shopping_list: |-
      Tu lista de la compra en una pantalla TRMNL de tinta electrónica. Escribe los artículos en el plugin, uno por línea, y aparecerán como una lista numerada.

      Colócala en la nevera o junto a la puerta para recordar lo que necesitas antes de salir. Añade o quita artículos cuando quieras desde el panel de TRMNL y la pantalla se actualizará. Guardamos la lista cifrada.
    simple_analytics: |-
      Las estadísticas de Simple Analytics en una pantalla TRMNL de tinta electrónica. Aparecen páginas vistas, visitantes y minutos por página, con un gráfico diario de visitas debajo.

      Crea una clave de API en los ajustes de Simple Analytics, pégala e introduce el dominio de tu web (sin «http»). Elige los últimos 1, 7, 14 o 30 días. También puedes terminar el gráfico ayer para que el día actual incompleto no parezca una caída brusca de tráfico.
    square_pos: |-
      Tus ventas de Square en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta y selecciona hasta tres establecimientos. Cada uno tendrá una columna con el total de pagos y una lista numerada de los pagos completados, con importe y método de pago.

      Elige consultar hoy, las últimas 24 horas o los últimos siete días. Si gestionas varias tiendas, podrás verlas juntas en una pantalla.
    statuspage: |-
      Las páginas de estado de los servicios de los que dependes en una pantalla TRMNL de tinta electrónica. Pega sus URL, una por línea, y buscaremos sus feeds RSS o Atom. Funciona con Statuspage, AWS, Slack, Google Cloud y muchos otros.

      La pantalla muestra dos listas: «Incidencias», con el último problema de cada servicio y cuándo ocurrió, señalando con un icono los de las últimas 24 horas; y «Programadas», con las próximas tareas de mantenimiento y sus fechas. Si una página no responde o no ofrece feed, la pantalla lo indicará.
    stock_price: |-
      Precios de acciones, metales y divisas en una pantalla TRMNL de tinta electrónica. Introduce hasta 12 símbolos para mostrar nombre, precio y variación diaria en porcentaje o puntos. El diseño se adapta al número de elementos.

      Los símbolos de EE. UU. funcionan directamente. Para Canadá, Alemania, Londres o India, añade la bolsa (como SHOP.TSE o INFY.NSE). Utiliza .FX para pares de divisas (EURUSD.FX) o sigue oro, plata, platino, paladio y cobre (XAUUSD para oro). Los índices no se admiten; usa un ETF como SPY para el S&P 500. Si introduces SPX, se te sugerirá. Para más de 12 valores, añade el plugin otra vez y combínalos en un mashup.
    tempest_weather_station: |-
      Datos de tu estación meteorológica Tempest en una pantalla TRMNL de tinta electrónica. Inicia sesión en Tempest para dar acceso de solo lectura y selecciona la estación.

      La pantalla completa muestra temperatura actual, sensación térmica, condiciones, humedad, viento, precipitación, índice UV, amanecer y atardecer, y máximas y mínimas de hoy y mañana. Elige Celsius o Fahrenheit; unidades de viento como mph, km/h, nudos o Beaufort; y precipitación en pulgadas, centímetros o milímetros. Para varias estaciones, añade el plugin por separado y combínalas en un mashup.
    the_office: |-
      Una frase aleatoria de la serie The Office en una pantalla TRMNL de tinta electrónica, junto a un dibujo del personaje que la dijo. Michael, Dwight, Jim y el resto de Dunder Mifflin se turnan para alegrarte un poco la jornada laboral.

      No necesita configuración. Añade el plugin, ponle un nombre si quieres y guarda. Las frases proceden de la API de The Office de Akash Rajpurohit.
    ticktick: |-
      Tus tareas de TickTick en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta y selecciona una lista o la bandeja de entrada. Las tareas muestran su fecha de vencimiento, ordenadas de más próxima a más lejana, y las subtareas aparecen con sangría debajo de la principal.

      Alinea la lista arriba, al centro o abajo. TickTick solo comparte listas de tareas con otras aplicaciones, de modo que el calendario, los hábitos, Pomodoro y la matriz de Eisenhower permanecen en TickTick.
    todo_list: |-
      Una lista sencilla de tareas en una pantalla TRMNL de tinta electrónica, sin conectar ninguna cuenta. Escribe lo que tienes pendiente en «En curso», un elemento por línea, y añade tareas terminadas a «Hecho» si quieres.

      Pasa elementos de «En curso» a «Hecho» a medida que avances. La pantalla muestra ambas listas: lo que falta y lo que ya has completado. Puedes usar Markdown en cada elemento para añadir negritas o cursivas, o desactivarlo y mostrar texto sin formato. Las dos listas se guardan cifradas.
    todoist: |-
      Tus tareas de Todoist en una pantalla TRMNL de tinta electrónica. Conecta tu cuenta, elige un proyecto o las vistas «Hoy» o «Próximamente», y verás las tareas con sus fechas de vencimiento.

      Agrupa por fecha, plazo, prioridad o etiqueta y ordena por nombre, fecha, plazo, prioridad o manualmente. Los filtros permiten limitar por vencimiento o plazo (desde hoy hasta los próximos 30 días), prioridad, etiqueta o responsable. Si ya conoces las consultas de filtro de Todoist, activa el modo personalizado y escribe la tuya.
    unsplash: |-
      Una foto aleatoria de Unsplash en una pantalla TRMNL de tinta electrónica. Introduce una búsqueda como «espacio» o «luna» y cada actualización mostrará una nueva fotografía apaisada que coincida, con tramado para tinta electrónica y a pantalla completa.

      Es el único ajuste. Elige un tema que te guste o añade el plugin varias veces con búsquedas distintas para alternar las imágenes en tu lista de reproducción.
    upcoming_movies: |-
      Una película que esperar con ganas en una pantalla TRMNL de tinta electrónica. Cada actualización elige una y muestra su título, cartel, fecha de estreno y breve sinopsis. Los datos proceden de The Movie Database (TMDB).

      Selecciona tu país para ver los estrenos cercanos. Después elige «Próximos estrenos», con películas que se estrenan hoy o más adelante, o «En cartelera», con las ya estrenadas. Así tendrás ideas para decidir qué ver el fin de semana.
    weather: |-
      Consulta el tiempo antes de salir, sin necesidad de una estación meteorológica. Busca una ciudad, un código postal o introduce coordenadas para mostrar en tu pantalla TRMNL de tinta electrónica temperatura, condiciones, sensación térmica, humedad y máximas, mínimas e índice UV de hoy y mañana.

      Elige un proveedor de datos. Tempest utiliza la estación más cercana o una que selecciones en su mapa y añade viento, precipitación, amanecer y atardecer en pantalla completa. WeatherAPI sirve como alternativa donde no haya estaciones próximas. Configura Celsius o Fahrenheit, unidades de viento y lluvia y etiquetas «hoy» y «mañana» o fechas concretas.
    webhook_image: |-
      Envía tus propias imágenes directamente a una pantalla TRMNL de tinta electrónica. Al añadir el plugin obtendrás una URL de webhook privada. Envía una imagen PNG, JPEG o WebP mediante POST desde un script, una tarea cron o Home Assistant y aparecerá en pantalla. Trata la URL como una contraseña: cualquiera que la tenga podrá cambiar la imagen.

      TRMNL no procesa la imagen, así que ajústala previamente al dispositivo. Las subidas se comprueban según sus dimensiones y profundidad de color o según el modelo que elijas; puedes omitir esta validación si sabes que el dispositivo admite la imagen. En un mashup puedes cubrir el espacio o mostrar la imagen completa sobre un fondo. Se permiten hasta 12 subidas por hora.
    wiki_random_article: |-
      El artículo destacado del día de Wikipedia en una pantalla TRMNL de tinta electrónica. Muestra el título y un resumen breve de un artículo nuevo cada día, sea sobre una batalla o un escarabajo.

      No necesita configuración. Añádelo a tu lista de reproducción y descubre algo interesante mientras preparas el café. Los artículos provienen del feed diario de destacados de la Wikipedia en inglés, así que todos ven el mismo.
    withings: |-
      Tus datos de salud de Withings en una pantalla TRMNL de tinta electrónica. Inicia sesión para conceder acceso de solo lectura y elige la vista. «Peso», para básculas, muestra peso actual, porcentaje de grasa y músculo, variación del periodo y gráfico. «Sueño», para Sleep Analyzer, muestra puntuación, horas dormidas, eficiencia y un gráfico de sueño profundo, REM y ligero por noche. «Actividad», para pulseras o relojes, muestra pasos de hoy frente al objetivo y un gráfico de pasos y sueño.

      Consulta los últimos 7, 30 o 90 días y muestra el peso en libras, kilogramos o stones. No se incluyen las lecturas introducidas manualmente.
    workflowy: |-
      Tus listas de Workflowy en una pantalla TRMNL de tinta electrónica. Cada elemento aparece con su nota debajo y conserva el orden que le hayas dado en Workflowy.

      Pega tu token de API de Workflowy. De forma predeterminada se muestra la lista principal. Si quieres un solo proyecto, introduce el ID de su elemento para usarlo como raíz. Muestra hasta 25 elementos y elige si incluir los completados, que aparecen marcados y tachados.
    youtube_analytics: |-
      Las estadísticas de tu canal de YouTube en una pantalla TRMNL de tinta electrónica. Destacan las visualizaciones y horas de reproducción, seguidas de duración media, nuevos suscriptores, porcentaje de reproducción, «me gusta», comentarios y veces compartido.

      Conecta la cuenta de Google propietaria del canal; los administradores de un canal compartido no pueden conectarlo. Consulta los últimos 7, 28, 90 o 365 días. Si gestionas varios canales, añade el plugin una vez por canal y ponles nombres distintos.
    linkedin_page: |-
      Las estadísticas de tu página de empresa de LinkedIn en una pantalla TRMNL de tinta electrónica. Consulta seguidores, nuevos seguidores, impresiones, clics, tasa de interacción, reacciones, comentarios y veces compartido, con un gráfico diario de la métrica que elijas.

      Conecta la cuenta de LinkedIn que administra la página, selecciónala y elige los últimos 7, 30 o 90 días. LinkedIn publica los datos con dos días de retraso, así que el gráfico termina dos días antes de hoy. Para varias páginas, añade el plugin una vez por cada una.
