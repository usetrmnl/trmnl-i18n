  integration_overviews:
    alias: |-
      Propria imagine, pe un ecran TRMNL ePaper. Alias este pentru cei care își generează deja ecranele în altă parte, de exemplu printr-un script pe un server de acasă. Lipește URL-ul complet al imaginii, iar dispozitivul o preia direct de la acea adresă; funcționează și un URL local precum http://localhost:4567/image.png.

      Imaginea trebuie pregătită pentru ePaper: BMP pe 1 bit sau PNG pe 1 ori 2 biți, cu dimensiunea exactă a dispozitivului. Nu o convertim pentru tine (pentru asta există Image Display). Suprascrii mereu același fișier? Dezactivează cache-ul, iar dispozitivul va redesena ecranul de fiecare dată, chiar dacă numele fișierului nu s-a schimbat.
    apple_calendar: |-
      Calendarul tău Apple, pe un ecran TRMNL ePaper. Ai 3 opțiuni: lipești linkul unui calendar făcut public în iCloud, sincronizezi de pe iPhone sau iPad cu aplicația TRMNL Companion ori te conectezi cu Apple ID și o parolă specifică aplicației, apoi alegi calendarele iCloud de afișat.

      Alege apoi o aranjare: agenda de astăzi, următoarele zile, o săptămână sau săptămâna de lucru, o grilă lunară ori un program minimal. Afișează orele și descrierile evenimentelor, folosește formatul de 12 sau 24 de ore, ascunde evenimentele care conțin anumite cuvinte și începe săptămâna în ziua dorită. O linie pentru ora curentă și evidențierea zilei de astăzi îți arată unde te afli în program.
    apple_photos: |-
      Fotografii dintr-un album partajat Apple Photos, pe un ecran TRMNL ePaper. În aplicația Poze, activează Public Website pentru un album partajat, apoi lipește linkul albumului în plugin. La fiecare reîmprospătare se alege aleatoriu o fotografie.

      Alege Acoperire pentru a umple ecranul (marginile pot fi decupate) sau Încadrare pentru a afișa fotografia completă, cu spațiu în jur. Fotografiile adăugate ulterior intră în rotație. TRMNL citește doar acel album partajat, nimic altceva din biblioteca ta.
    asana: |-
      Sarcinile tale Asana, pe un ecran TRMNL ePaper. Conectează contul Asana, alege un spațiu de lucru, apoi secțiunile My Tasks de afișat, precum „Do today” sau „Do later”. Pe ecranul complet încap 3 secțiuni alăturate; în aranjările mai mici încap 2.

      Fiecare sarcină afișează numele și data scadentă. Sortează după scadență, alfabetic sau în ordinea Asana și afișează scadențele ca „Astăzi”, „Mâine” și nume de zile ori ca date scurte. Poți afișa și proiectul fiecărei sarcini și include sarcinile finalizate. Sunt acceptate doar My Tasks, nu și vederile de proiect, listele comune ale echipei sau subsarcinile.
    basecamp: |-
      Sarcinile tale Basecamp, pe un ecran TRMNL ePaper. Conectează contul Basecamp, alege contul și proiectul, iar ecranul reunește sarcinile din listele proiectului.

      Sarcinile sunt ordonate după scadență, cele mai apropiate primele, astfel încât următorul lucru de făcut apare sus. Vrei să urmărești mai multe proiecte? Adaugă pluginul pentru fiecare proiect și afișează-le alăturat într-o compoziție.
    beehiiv: |-
      Statisticile ultimului tău newsletter beehiiv, pe un ecran TRMNL ePaper. Vezi subiectul, numărul de destinatari, deschiderile și rata de deschidere, clicurile și rata de clic, precum și dezabonările și reclamațiile de spam.

      Configurarea durează un minut și nu necesită cod. În beehiiv, mergi la Settings, apoi Integrations și API, creează o cheie API și copiază ID-ul publicației. Lipește-le pe amândouă în plugin și salvează. Ai mai multe newslettere? Adaugă pluginul pentru fiecare publicație.
    bible_verses: |-
      Un verset biblic aleatoriu pe ecranul TRMNL ePaper, unul nou la fiecare reîmprospătare. Versetul apare în mijlocul ecranului sub titlul „Versetul zilei”, cu cartea, capitolul și versetul dedesubt.

      Alege traducerea: American Standard, King James sau World English Bible. Aceasta este singura setare. Adaugă pluginul în lista de redare și lasă-l să apară între calendar și vreme.
    bitcoin_wallet_balance: |-
      Soldul unui portofel Bitcoin, pe un ecran TRMNL ePaper. Lipește adresa publică a portofelului, iar ecranul afișează soldul în BTC și dolari SUA, plus un grafic cu lumânări al prețului Bitcoin din ultimele 90 de zile.

      Vezi și variația prețului în 7 și 90 de zile, pentru a evalua dintr-o privire cum a fost săptămâna. TRMNL are nevoie doar de adresa publică, niciodată de cheile tale. Ai mai multe portofele? Adaugă pluginul pentru fiecare adresă.
    caldav: |-
      Evenimente din aproape orice serviciu de calendar, pe un ecran TRMNL ePaper. Lipește unul sau mai multe linkuri publicate de calendar .ics și adaugă antete HTTP dacă serverul le cere pentru acces. Preferi telefonul? Sincronizează calendarele de pe iPhone sau iPad cu aplicația TRMNL Companion.

      Alege apoi o aranjare: agenda de astăzi, următoarele zile, o săptămână sau săptămâna de lucru, o grilă lunară ori un program minimal. Afișează orele și descrierile evenimentelor, folosește formatul de 12 sau 24 de ore, ascunde evenimentele cu anumite cuvinte și afișează culorile calendarelor pe blocurile de evenimente. Vederile săptămânale și lunare pot umbri weekendurile, evidenția ziua curentă, afișa numerele săptămânilor și trasa o linie la ora curentă.
    changelog: |-
      Noutăți de la echipa TRMNL, pe ecranul tău TRMNL ePaper. Ecranul listează cele mai recente anunțuri, începând cu cele mai noi, fiecare cu data și titlul său. Pe ecranul complet apare și o descriere scurtă sub fiecare anunț.

      Nu trebuie să configurezi nimic. Adaugă-l într-o listă de redare și vei afla despre pluginuri și funcții noi chiar de pe dispozitiv, fără să verifici e-mailul sau rețelele sociale.
    chatgpt: |-
      Răspunsuri ChatGPT, pe un ecran TRMNL ePaper. Scrie o instrucțiune o singură dată; este trimisă din nou la fiecare reîmprospătare, astfel încât primești mereu un răspuns nou. Poate fi o curiozitate, cuvântul zilei sau o idee zilnică de scriere.

      Creează o cheie API în contul OpenAI și lipește-o împreună cu instrucțiunea. Alege un model și activează căutarea pe web pentru răspunsuri care necesită informații actuale; sursele apar în partea de jos. Pluginul folosește propria ta cheie API, deci utilizarea este înregistrată în contul OpenAI. Dacă atingi limitele de cereri OpenAI, ecranul afișează eroarea lor.
    clicky: |-
      Statisticile site-ului tău din Clicky, pe un ecran TRMNL ePaper. Ecranul afișează vizualizările de pagină, vizitatorii și timpul mediu pe pagină, cu un grafic al vizualizărilor zilnice dedesubt.

      Introdu ID-ul site-ului și cheia site-ului din Clicky, apoi alege perioada: 1, 7, 14 sau 30 de zile. Ai mai multe site-uri? Adaugă pluginul pentru fiecare site și combină-le pe un singur ecran într-o compoziție.
    clock: |-
      Un ceas pentru ecranul TRMNL ePaper. Alege un ceas analogic cu cadran și ace sau unul digital cu cifre cu șapte segmente, ca la un ceas LCD clasic, și setează fusul orar. Poate ocupa tot ecranul, jumătate sau un sfert.

      Ceasul digital afișează ora în format de 24 de ore. Ai colegi sau familie în alte orașe? Adaugă câte un ceas pentru fiecare fus orar. Include-le apoi într-o compoziție lângă calendar sau vreme, ca să vezi ora chiar acolo unde privești deja.
    close: |-
      Fluxul de oportunități Close CRM, pe un ecran TRMNL ePaper. Conectează contul Close, apoi alege până la 3 stări de urmărit, precum „Active” sau „Won”. Fiecare stare are propria coloană de oportunități.

      Fiecare oportunitate afișează numele clientului potențial, valoarea și persoana responsabilă din echipă. Alege perioada: oportunități actualizate în ultimele 7, 14 sau 30 de zile. Pune ecranul pe perete lângă echipa de vânzări și toată lumea va vedea situația tranzacțiilor.
    coinmarketcap: |-
      Prețuri cripto în timp real de la CoinMarketCap, pe un ecran TRMNL ePaper. Fiecare monedă afișează simbolul, numele, prețul curent și variația din ultimele 24 de ore.

      Adaugă cheia API CoinMarketCap, apoi simbolurile urmărite, precum BTC sau ETH. Afișează o singură monedă cu caractere mari sau până la 12 într-o grilă. Prețurile sunt implicit în dolari SUA; poți alege altă monedă, precum EUR, GBP, JPY sau ZAR, cu conversie la un curs vechi de cel mult o zi.
    convertkit_analytics: |-
      Statisticile newsletterului ConvertKit, pe un ecran TRMNL ePaper. O parte afișează contul: numărul de abonați și produsele vândute. Cealaltă afișează rezultatele unei trimiteri: destinatari, rata de deschidere, rata de clic, clicuri, dezabonări și stare.

      Lipește cheia API și secretul API ConvertKit, apoi alege o perioadă de 7, 30 sau 90 de zile.
    custom_text: |-
      Propriile cuvinte, pe un ecran TRMNL ePaper. Un citat, un obiectiv, un memento să bei apă. Introdu o frază sau mai multe separate prin punct și virgulă, iar la fiecare reîmprospătare se alege una aleatoriu.

      Poți folosi Markdown pentru text îngroșat, cursiv sau liste ori îl poți dezactiva pentru a afișa textul exact cum l-ai scris. Scalarea automată a fontului adaptează textul la spațiu, potrivit pentru pasaje mai lungi; poți păstra și o dimensiune fixă. Aliniază textul la stânga, centru sau dreapta și adaugă propria linie în bara de titlu de jos.
    days_left_retirement: |-
      Cât de aproape ești de pensionare, pe un ecran TRMNL ePaper. Introdu data nașterii și vârsta la care intenționezi să te pensionezi. Ecranul afișează progresul procentual, săptămânile rămase și o bară care se umple odată cu trecerea anilor.

      Vezi mai clar timpul rămas când îl numeri în săptămâni. Adaugă-l în lista de redare ca să îți amintești să dedici timp lucrurilor care contează.
    days_left_until: |-
      Numărătoare inversă până la orice dată, pe un ecran TRMNL ePaper. O lansare, o călătorie, un termen-limită, o nuntă. Setează data de început și de sfârșit, iar ecranul afișează zilele trecute, zilele rămase și o bară de progres.

      Te interesează un singur număr? Ascunde zilele trecute sau cele rămase. Numeri până la mai multe evenimente? Adaugă pluginul pentru fiecare dată.
    days_left_year: |-
      Întregul an dintr-o privire, pe un ecran TRMNL ePaper. Fiecare zi este un pătrat mic, aranjat săptămână cu săptămână. Zilele trecute sunt umbrite, ziua de astăzi este neagră, iar celelalte urmează. Deasupra grilei apar două numere: zilele trecute și zilele rămase.

      Nu trebuie să configurezi nimic. Adaugă-l și salvează. Folosește data din fusul orar al contului și începe din nou la 1 ianuarie.
    days_since: |-
      Numărul de zile de la un moment important pentru tine, pe un ecran TRMNL ePaper. Un obicei la care ai renunțat, ziua în care ai început o afacere, ultima dată când cineva a stricat compilarea. Ecranul afișează data de început și zilele trecute.

      Alege data de început și formatul ei, de la „26 noiembrie 2024” la 2024-11-26 sau 11/26/2024. Urmărești mai multe lucruri? Adaugă pluginul pentru fiecare dată și combină-le într-o compoziție.
    dropbox_photo_album: |-
      Transformă ecranul TRMNL ePaper într-o ramă foto digitală alimentată din Dropbox. Conectează contul Dropbox și creăm un folder de aplicație TRMNL în folderul Apps. Adaugă fotografii acolo, iar fiecare reîmprospătare afișează una aleatoriu, adaptată ecranului.

      TRMNL poate citi și partaja fișiere doar din acel folder, niciodată din restul contului Dropbox. Folosești orientarea portret? Încarcă fotografii portret și folosește fotografii peisaj pentru ecranele orizontale. Adaugă sau elimină fotografii oricând, iar rotația se adaptează.
    eight_sleep: |-
      Datele tale Eight Sleep, pe un ecran TRMNL ePaper. După trezire, vezi dintr-o privire cum a fost săptămâna: câte un indicator al scorului de somn pentru ultimele 7 zile și scorul săptămânal, cu o evaluare simplă de la Scăzut la Bun.

      Alături apar mediile săptămânale pentru calitatea somnului, sforăit, somn profund, REM, timpul până la adormire și durata totală a somnului. Configurarea cere doar adresa de e-mail și parola aplicației Eight Sleep. Eight Sleep nu are un API oficial, deci ne conectăm la fel ca aplicația și citim aceleași valori. Pluginul ocupă tot ecranul și nu poate fi inclus într-o compoziție.
    email_meter: |-
      Statisticile Gmail din Email Meter, pe un ecran TRMNL ePaper. Vezi câte mesaje ai trimis și către câți destinatari, câte ai primit și de la câți expeditori, precum și timpul mediu de răspuns.

      Alege ultimele 1, 7 sau 30 de zile. Configurarea cere un mic pas suplimentar: conectează-te la Email Meter, deschide consola browserului și copiază tokenul sesiunii folosind linia oferită în formularul de setări (nu sunt necesare cunoștințe de programare). Tokenul expiră la încheierea sesiunii. Când ecranul indică respingerea lui, obține unul nou și lipește-l.
    enphase: |-
      Sistemul tău fotovoltaic Enphase, pe un ecran TRMNL ePaper. Conectează contul Enphase, alege sistemul, iar ecranul afișează curba producției de astăzi, o valoare principală și ora ultimei raportări.

      Tu alegi valoarea principală: energia produsă, consumată, importată sau exportată astăzi, importul ori exportul net, puterea maximă, producția curentă, acoperirea solară, dependența de rețea, producția totală sau bateria. Alege apoi celelalte valori afișate alături. Aranjările mai mici afișează primele valori care încap. Nu ai contor de consum? Valorile pe care sistemul nu le poate raporta sunt omise, nu afișate ca zero.
    ethereum_wallet_balance: |-
      Soldul portofelului Ethereum, pe un ecran TRMNL ePaper. Lipește adresa publică, iar ecranul afișează valoarea în dolari SUA, cantitatea de ETH și variația prețului în ultimele 7 și 90 de zile, cu un grafic al prețului pe 90 de zile.

      Se introduce doar adresa publică. Fără chei, fără autentificare și fără nimic care să poată transfera fondurile. Urmărești mai multe portofele? Adaugă pluginul pentru fiecare adresă.
    etsy: |-
      Vânzările magazinului Etsy, pe un ecran TRMNL ePaper. Conectează contul Etsy, alege magazinul și vezi vânzările totale, valoarea medie a comenzilor și numărul comenzilor în așteptare sau onorate.

      Un grafic compară vânzările zilnice cu perioada precedentă, ca să vezi imediat dacă săptămâna aceasta o depășește pe cea trecută. Alege ultimele 7, 30 sau 90 de zile ori luna curentă până astăzi. Comenzile anulate sunt excluse, iar cele neplătite nu sunt incluse în vânzări.
    fastmail_calendar: |-
      Calendarul Fastmail, pe un ecran TRMNL ePaper. Publică calendarul din setările Edit & Share din Fastmail, cu toate detaliile evenimentelor sau doar disponibilitatea, apoi lipește linkul în plugin (înlocuiește „webcal” cu „https”). Ai mai multe calendare? Adaugă câte un link pe linie. Preferi telefonul? Sincronizează de pe iPhone sau iPad cu aplicația TRMNL Companion.

      Alege o aranjare: agenda de astăzi, următoarele zile, o săptămână sau săptămâna de lucru, o grilă lunară ori un program minimal. Afișează orele și descrierile, folosește formatul de 12 sau 24 de ore, ascunde evenimentele cu anumite cuvinte și afișează culorile calendarelor. Vederile săptămânale și lunare pot umbri weekendurile, evidenția ziua curentă și afișa numerele săptămânilor.
    fera: |-
      Recenziile tale Fera, pe un ecran TRMNL ePaper. Sus: nota medie, numărul total de recenzii, proporția celor verificate și numărul produselor cu recenzii. Dedesubt: cele mai recente recenzii, cu stele, titluri și text.

      Conectează contul Fera și alege recenziile de afișat: aprobate (implicit), în așteptarea aprobării, în așteptarea actualizării, respinse sau în așteptare. TRMNL doar citește recenziile și nu poate modifica nimic. Îl poți deconecta oricând din Fera.
    gaffa: |-
      Propria pagină de știri, pe un ecran TRMNL ePaper, creată de AI-ul Gaffa. Oferă adresa unui site de știri, iar Gaffa citește pagina, alege subiectele principale și scrie un scurt rezumat pentru fiecare. Primești o listă numerotată de titluri cu un rând sau două de context.

      Ghidează rezumatele cu propria instrucțiune, precum „concentrează-te pe evenimente globale și evită titlurile înșelătoare”, și personalizează eticheta barei de titlu. Perioada de probă gratuită Gaffa acoperă primele 6 luni. După aceea, introdu propria cheie API Gaffa pentru a continua.
    github_commit_graph: |-
      Graficul contribuțiilor tale GitHub, pe un ecran TRMNL ePaper. Introdu numele de utilizator GitHub (fără @), iar ecranul desenează activitatea ultimului an ca o grilă de pătrate, mai întunecate în zilele cu mai multă activitate.

      Alături apar totalul contribuțiilor din ultimul an, cea mai lungă serie și seria curentă de zile consecutive, ziua cea mai activă și media zilnică. Nu trebuie să conectezi nimic și nu ai nevoie de token, doar de numele de utilizator. Vrei și graficul unui coleg? Adaugă din nou pluginul cu numele lui de utilizator.
    github_commits: |-
      Cele mai recente commituri din orice repository GitHub, pe un ecran TRMNL ePaper. Fiecare rând afișează mesajul commitului, autorul, data și ora și hashul scurt.

      Introdu repository-ul ca organizație/repository sau lipește linkul GitHub. Lasă ramura necompletată pentru a urmări ramura implicită ori indică ramura dorită. Repository-urile open source nu cer altceva. Pentru unul privat, schimbă vizibilitatea în privat și adaugă un token cu permisiuni detaliate și acces de citire la conținutul repository-ului. Dacă GitHub întâmpină probleme, ultima listă validă rămâne pe ecran.
    github_contributor_summary: |-
      Cine contribuie la repository-ul tău GitHub, pe un ecran TRMNL ePaper. Un tabel listează numele fiecărui contributor, commiturile din săptămâna trecută și totalul commiturilor, ca să vezi imediat cine este activ.

      Introdu repository-ul ca utilizator/repository și adaugă din setările GitHub un token de acces cu permisiuni detaliate. Este suficient accesul de citire la metadatele repository-ului. GitHub afișează tokenul o singură dată, deci copiază-l direct în TRMNL. Urmărești mai multe repository-uri? Adaugă pluginul pentru fiecare.
    google_analytics: |-
      Statisticile Google Analytics, pe un ecran TRMNL ePaper. Vezi vizualizările de pagină, sesiunile, vizitatorii și durata medie a sesiunii, cu un grafic al vizualizărilor zilnice dedesubt.

      Conectează contul Google, introdu ID-ul proprietății site-ului urmărit și alege o perioadă de 7, 30 sau 90 de zile. Datele pot include ziua de astăzi sau se pot opri la ieri. Alegând ieri, graficul nu scade la final doar pentru că ziua curentă nu s-a încheiat. Ai mai multe site-uri? Adaugă pluginul pentru fiecare proprietate.
    google_calendar: |-
      Calendarul Google, pe un ecran TRMNL ePaper. Conectează-te cu Google, alege calendarele dorite și ai terminat. Ai un cont de serviciu și unul personal? Conectează mai multe conturi Google și afișează calendarele lor pe același ecran.

      Alege aranjarea potrivită: agenda de astăzi, următoarele zile, o săptămână sau săptămâna de lucru, o grilă lunară ori un program minimal. Afișează orele și descrierile, folosește formatul de 12 sau 24 de ore, ascunde evenimentele cu anumite cuvinte ori afișează doar evenimentele acceptate. Poți adăuga o linie pentru ora curentă, iar vederile săptămânale și lunare pot umbri weekendurile, evidenția ziua curentă și afișa numerele săptămânilor.
    google_drive_photos: |-
      Transformă un folder Google Drive într-o ramă foto pentru ecranul TRMNL ePaper. Fiecare reîmprospătare alege aleatoriu o imagine din folder: JPEG, PNG, GIF, BMP, WebP sau TIFF.

      Nu trebuie să te conectezi cu Google. Partajează folderul cu adresa de e-mail TRMNL afișată în setări, cu rolul Viewer, apoi lipește linkul folderului. TRMNL vede doar ce partajezi. Intră în rotație doar fotografiile aflate direct în folder, nu și subfolderele. Alege Acoperire pentru a umple ecranul (marginile pot fi decupate) sau Încadrare pentru imaginea completă, cu spațiu în jur.
    google_photos: |-
      Fotografii din biblioteca Google Photos, pe un ecran TRMNL ePaper. Conectează contul Google, apoi alege manual fotografiile în selectorul Google. Fiecare reîmprospătare afișează aleatoriu una dintre ele.

      TRMNL vede doar fotografiile selectate, nimic altceva din bibliotecă. Alege Acoperire pentru a umple ecranul (marginile pot fi decupate) sau Încadrare pentru fotografia completă, cu spațiu în jur. Google încheie accesul după 7 zile, deci va trebui să alegi din nou periodic. Pagina de setări arată când expiră.
    google_tasks: |-
      Sarcinile Google Tasks, pe un ecran TRMNL ePaper. Conectează contul Google, alege o listă, iar ecranul afișează sarcinile nefinalizate și scadențele. Sarcinile finalizate nu apar.

      Sortează după scadență sau păstrează ordinea stabilită în aplicație. Subsarcinile apar imediat sub sarcina principală, indentate, pentru a le distinge. Poți alinia lista sus, la centru sau jos. Ai o listă de serviciu și una personală? Adaugă pluginul pentru fiecare și afișează-le alăturat într-o compoziție.
    gumroad_analytics: |-
      Vânzările Gumroad, pe un ecran TRMNL ePaper. Două numere mari: câte vânzări ai făcut și valoarea lor.

      Conectează contul Gumroad și alege o perioadă de 7, 30 sau 90 de zile. Aceasta este întreaga configurare. Vrei să compari săptămâna cu trimestrul? Adaugă pluginul de două ori, o dată pentru 7 zile și o dată pentru 90. Pune-l la vedere în timp ce lucrezi și urmărește rezultatele.
    hacker_news: |-
      Ce citește acum comunitatea tehnică, pe un ecran TRMNL ePaper. Ecranul listează articolele Hacker News în ordine, cu titlul, numărul de voturi și autorul postării. Pe ecranul complet sunt aranjate în două coloane.

      Configurarea cere o singură alegere. Top Stories afișează articolele cu cel mai bun clasament actual. Show HN afișează proiecte realizate de utilizatori pentru a le încerca (eliminăm prefixul „Show HN:” din titluri). Într-o compoziție ocupă jumătate sau un sfert din ecran.
    home_assistant_screenshot: |-
      Panourile Home Assistant, pe un ecran TRMNL ePaper. Pluginul funcționează împreună cu extensia TRMNL HA, care face capturi ale panourilor în propria rețea, le pregătește pentru ePaper și le trimite la URL-ul webhook privat oferit de plugin. Nimic nu accesează rețeaua ta din exterior.

      Instalează extensia din magazinul Home Assistant sau ruleaz-o într-un container separat dacă folosești Home Assistant în Docker. Creează un program în extensie, alege presetarea dispozitivului și lipește URL-ul webhook. În TRMNL, alege dacă imaginea umple spațiul sau se afișează integral când împarte ecranul cu alte pluginuri și ce culoare umple spațiul liber din jur.
    homey: |-
      Casa inteligentă Homey, pe un ecran TRMNL ePaper. Prezentarea generală începe cu valori precum puterea, temperatura și umiditatea, listează alarmele active, apoi dispozitivele. Baterii listează dispozitivele pe baterii, începând cu cele mai descărcate. Statistici afișează graficul unei valori înregistrate în ultima oră, zi, săptămână sau lună.

      Ai două moduri de a transmite datele. Instalează aplicația TRMNL pentru Homey (sau un HomeyScript) și lipește URL-ul de trimitere al pluginului. Sau conectează contul Homey pentru ca TRMNL să citească datele din cloud, apoi alege dispozitivul Homey de afișat. Afișează toate zonele sau o singură cameră. Pluginul stă și la baza rețetelor Homey din catalogul TRMNL.
    hubspot: |-
      Tranzacțiile HubSpot, pe un ecran TRMNL ePaper. Conectează contul HubSpot, alege un flux de vânzări, apoi până la 3 etape ale tranzacțiilor de urmărit.

      Fiecare etapă are propria coloană, cu numele tranzacțiilor, valoarea și persoana responsabilă. Vezi rapid situația fluxului fără să deschizi CRM-ul. Vrei mai multe etape sau un al doilea flux? Adaugă din nou pluginul și combină-le într-o compoziție.
    huckleberry: |-
      Ziua bebelușului din Huckleberry, pe un ecran TRMNL ePaper. Ecranul afișează numele și vârsta copilului, dacă doarme sau este treaz și de când, apoi următorul somn SweetSpot sau ora de culcare. Dedesubt apar ultimul biberon, alăptarea, masa solidă și schimbarea scutecului, plus programul planificat al zilei.

      Conectează-te cu adresa de e-mail și parola folosite în Huckleberry, salvează, apoi alege copilul. Huckleberry nu are un API oficial, deci ne conectăm la fel ca aplicația și citim aceleași date. Urmărești doi copii? Adaugă pluginul pentru fiecare și afișează-le alăturat într-o compoziție.
    image_display: |-
      Orice imagine de pe web, pe un ecran TRMNL ePaper. Introdu adresa imaginii, iar TRMNL o convertește pentru ecran. Adaugă mai multe adrese, câte una pe linie, și primești o imagine aleatorie la fiecare reîmprospătare. Linkurile de partajare Google Drive funcționează direct, deci Drive poate găzdui imaginile.

      Folosește o fotografie, un grafic sau un panou generat de alt sistem ori o captură de cameră. Acoperă ecranul, încadrează imaginea cu o culoare de fundal în jur sau întinde-o pentru a umple spațiul. Găzduiești pe un server de acasă cu certificat autosemnat? Permite totuși preluarea de către TRMNL. Dacă serverul trimite antete ETag sau Last-Modified, TRMNL redesenează doar când imaginea se schimbă.
    kickstarter: |-
      Proiecte de finanțare participativă care merită văzute, pe un ecran TRMNL ePaper. Fiecare proiect afișează numele, o descriere scurtă, procentul finanțat din obiectiv, suma promisă în dolari SUA și țara de origine.

      Alege Top pentru proiectele active cu cele mai mari sume strânse sau Ending Soon pentru campaniile care se încheie în curând, dacă vrei să contribui înainte de expirare. Aceasta este singura setare.
    language_learning: |-
      Un cuvânt în limba pe care o înveți, pe un ecran TRMNL ePaper. Ecranul afișează cuvântul în acea limbă, sensul în engleză și o propoziție care îl folosește.

      Alege dintre 13 limbi: portugheză braziliană, daneză, neerlandeză, engleză, franceză, greacă, italiană, japoneză, coreeană, norvegiană, spaniolă, suedeză sau turcă. Fiecare reîmprospătare trece la următorul cuvânt dintr-o listă de mii de cuvinte uzuale, iar TRMNL îți păstrează locul. Vrei mai mult timp pentru un cuvânt? Setează un interval de reîmprospătare mai lung.
    letterboxd: |-
      Jurnalul Letterboxd, pe un ecran TRMNL ePaper. Conectează-te cu Letterboxd, iar ecranul listează filmele înregistrate cel mai recent, cu data vizionării, anul lansării, nota în stele, o inimă dacă ți-au plăcut și o etichetă pentru revizionare. Aranjările mai mari includ afișul ultimului film.

      Vrei să vezi ce urmăresc ceilalți? Treci la modul Prieteni pentru înregistrări și recenzii recente ale persoanelor urmărite, cu autorul, nota și afișul unde există loc.
    lunar_calendar: |-
      Poziția Lunii în ciclul său, pe un ecran TRMNL ePaper. Ecranul începe cu faza curentă, proporția iluminată și vârsta Lunii în zile. Dedesubt apare cronologia fazelor din jurul zilei curente, cu datele lor, apoi următoarea fază, următoarea lună plină și următoarea lună nouă.

      Există o singură setare: Detaliat folosește imagini realiste ale Lunii, iar Simplu folosește pictograme clare. Nu este necesară locația. Datele urmează fusul orar al contului.
    lunch_money: |-
      Finanțele Lunch Money, pe un ecran TRMNL ePaper. Creează un token de acces în setările pentru dezvoltatori Lunch Money, lipește-l și alege ce vrei să vezi.

      Bugete afișează cheltuielile lunii curente pe categorii, în ordine descrescătoare, cu un grafic comparativ față de buget. Alege categoriile principale sau subcategoriile pentru a evita dubla numărare. Conturi afișează soldurile conturilor și activelor conectate, inclusiv datoriile. Avere netă afișează situația de astăzi, variația și un grafic al activelor și datoriilor din ultimele 3, 6, 9 sau 12 luni. Sumele folosesc moneda principală din Lunch Money.
    mailchimp_analytics: |-
      Statisticile audienței Mailchimp, pe un ecran TRMNL ePaper. Conectează contul Mailchimp și alege audiența urmărită.

      Activitate recentă afișează sus mesajele trimise și rata de deschidere, apoi deschiderile unice, clicurile, respingerile permanente și temporare, abonații noi și dezabonările. Istoricul creșterii păstrează mesajele trimise și rata de deschidere, dar înlocuiește restul cu un grafic lunar al numărului de abonați. Ai mai multe newslettere? Adaugă pluginul pentru fiecare audiență.
    mazevo: |-
      Transformă ecranul TRMNL ePaper într-un indicator de sală pentru orice spațiu rezervat în Mazévo. Vezi imediat dacă sala este ocupată, cu numele și intervalul rezervării curente, sau dacă este disponibilă și până când. Rezervările rămase ale zilei apar dedesubt.

      Conectează-te cu o cheie API și un URL API Mazévo, care permit rezervări de organizație și private, sau cu fluxul iCal al unui calendar Mazévo, care afișează doar numele și orele evenimentelor. Alege sala în fața căreia este ecranul. Personalizează-l: înlocuiește numele sălii cu propriul titlu, schimbă eticheta „Disponibil”, adaugă o notă de un rând jos, afișează sau ascunde rezervările încheiate și folosește formatul de 12 sau 24 de ore. Rezervările private apar ca private, fără nume.
    microsoft_todo: |-
      Sarcinile Microsoft To Do, pe un ecran TRMNL ePaper. Conectează-te cu contul Microsoft și alege lista de afișat.

      Ecranul listează toate sarcinile nefinalizate, cu scadența și o scurtă previzualizare a notelor. Sarcinile finalizate dispar, deci vezi doar ce a rămas. Poți alinia sarcinile sus, la centru sau jos. Ai o listă de serviciu și una de cumpărături? Adaugă pluginul pentru fiecare și afișează-le într-o compoziție.
    mondrian: |-
      Artă generativă în stilul lui Piet Mondrian, pe un ecran TRMNL ePaper. La fiecare generare, ecranul se împarte într-o grilă aleatorie de linii negre groase și blocuri umplute, astfel încât două ecrane nu arată la fel.

      Nu trebuie să configurezi nimic. Adaugă-l într-o listă de redare pentru o pauză între ecranele cu date sau într-o compoziție, ca o mică operă de artă lângă calendar ori vreme.
    motivational_quote: |-
      Un citat motivațional al zilei, pe un ecran TRMNL ePaper. Ecranul afișează citatul cu caractere mari și numele autorului dedesubt. Citatele provin din citatul zilei ZenQuotes, deci se schimbă zilnic și toată lumea vede același citat.

      Nu trebuie să configurezi nimic. Adaugă-l într-o listă de redare sau într-o compoziție lângă calendar, pentru un gând între ședințe.
    nano_banana_dashboard: |-
      Datele tale TRMNL, transformate în imagine de modelele de generare Gemini de la Google (poreclite Nano Banana). Alege până la 3 pluginuri drept surse de date, iar Gemini transformă datele într-o scenă: prima pagină a unui ziar, un meniu de cafenea pe tablă, o sală de control și altele.

      Folosești propria cheie API Gemini din Google AI Studio, cu facturarea configurată, și alegi Flash, Flash 2.5 sau Pro. Personalizează apoi imaginea: adaugă textul tău, precizează datele de evidențiat, alege o scenă sau Aleatoriu, adaugă indicații de stil și setează raportul de aspect. Utilizatorii avansați pot scrie întreaga instrucțiune. O imagine nouă este creată doar când setările sau datele se schimbă.
    netatmo_weather_station: |-
      Măsurătorile stației meteo Netatmo, pe un ecran TRMNL ePaper. Conectează-te la Netatmo pentru a acorda TRMNL acces doar pentru citire, apoi alege stația și, opțional, modulul pentru măsurătorile de interior.

      Modul de bază începe cu temperatura exterioară și un grafic, apoi temperatura, umiditatea și CO2 din interior, plus umiditatea exterioară, presiunea, zgomotul și minimele și maximele zilei. Ai pluviometru sau anemometru? Apar și măsurătorile lor. Modul Grafic umple spațiul cu o singură mărime: temperatură, umiditate, CO2, zgomot, presiune, ploaie sau vânt. Alege Fahrenheit ori Celsius și, dacă preferi, noduri pentru vânt.
    nextcloud_calendar: |-
      Calendarul Nextcloud, pe un ecran TRMNL ePaper. Partajează calendarul ca link în Nextcloud și lipește-l (poți adăuga mai multe, câte unul pe linie) sau sincronizează de pe iPhone ori iPad cu aplicația TRMNL Companion.

      Alege o aranjare: agenda de astăzi, următoarele zile, o săptămână, o săptămână mobilă, săptămâna de lucru sau una de 3 zile, o grilă lunară ori lunară mobilă sau un program minimal. Afișează orele, descrierile și culorile calendarelor, folosește formatul de 12 sau 24 de ore și ascunde evenimentele cu anumite cuvinte. Vederile săptămânale și lunare pot umbri weekendurile, evidenția ziua curentă, afișa numerele săptămânilor și trasa o linie la ora curentă.
    notion: |-
      Bazele de date și paginile Notion, pe un ecran TRMNL ePaper. Conectează Notion cu acces doar pentru citire, alege conținutul vizibil pentru TRMNL, apoi o bază de date sau o pagină de afișat.

      Pentru o bază de date, alege proprietatea folosită ca titlu, cea afișată ca insignă mare de stare și cele afișate ca etichete mici ori detalii dedesubt. Sortează după orice proprietate, filtrează cu sintaxa Notion (funcționează și date dinamice precum „astăzi plus 7”), setează numărul elementelor și folosește una sau două coloane. Pentru o pagină, ecranul afișează conținutul în ordine: text, titluri, liste, imagini și altele.
    outlook_calendar: |-
      Calendarul Outlook, pe un ecran TRMNL ePaper. Conectează-te cu contul Microsoft și alege calendarele de afișat. Dacă nu alegi nimic, se folosește calendarul implicit.

      Alege o aranjare: agenda de astăzi, următoarele zile, o săptămână sau săptămâna de lucru, o grilă lunară ori un program minimal. Afișează orele și descrierile, folosește formatul de 12 sau 24 de ore, ascunde evenimentele cu anumite cuvinte și afișează doar evenimentele acceptate. Vederile săptămânale și lunare pot umbri weekendurile, evidenția ziua curentă și afișa numerele săptămânilor. Dacă îți planifici ziua oră cu oră, linia orei curente te ajută să urmărești programul.
    parcel: |-
      Livrările tale din aplicația Parcel, pe un ecran TRMNL ePaper. Fiecare livrare afișează starea, precum în tranzit sau în curs de livrare, numele, ultimul eveniment de urmărire și momentul estimat: astăzi, mâine, o zi a săptămânii sau o dată.

      Ai nevoie de un abonament Parcel plătit. Conectează-te la web.parcelapp.net, creează o cheie API și lipește-o. Afișează livrările active sau recente, alege stilul Detaliat ori Compact, care omite evenimentul de urmărire, și decide ce se întâmplă când nu ai livrări: afișează ecranul gol sau omite-l.
    place_of_the_day: |-
      Un loc nou în fiecare zi pe ecranul TRMNL ePaper: un oraș sau o minune a lumii. Fiecare ecran afișează numele locului, regiunea și țara, o hartă a străzilor și o descriere scurtă, de obicei din Wikipedia. Când sunt disponibile, apar și populația, anul fondării, altitudinea, suprafața, ora locală și coordonatele.

      Nu trebuie să configurezi nimic. Toți utilizatorii pluginului văd același loc într-o anumită zi, iar selecțiile alternează între Europa, Americi și restul lumii.
    poetry_today: |-
      O poezie pe ecranul TRMNL ePaper, cu titlul sus și numele poetului în colț. Fiecare reîmprospătare alege aleatoriu una nouă din PoetryDB, o colecție publică de poezii clasice.

      Nu trebuie să configurezi nimic. Adaugă pluginul și ai terminat. Alegem doar poezii suficient de scurte pentru ecran (cel mult 24 de versuri), ca să nu primești un sonet tăiat la jumătate. Se potrivește lângă un ceas sau calendar într-o compoziție, când vrei ceva de citit mai pe îndelete decât e-mailurile.
    polymarket: |-
      Piețele de predicții Polymarket, pe un ecran TRMNL ePaper. Alege un subiect, iar ecranul listează până la 12 piețe deschise, fiecare cu întrebarea, numărul de comentarii și suma investită.

      Subiectele includ afaceri, cultură pop, sport, cripto, știință și politică. Nu ai nevoie de cont Polymarket. Afișăm doar piețe active care se încheie în următoarele două săptămâni, deci vezi pariuri care se rezolvă curând. Vrei un subiect absent din listă? Trimite asistenței ID-ul etichetei Polymarket și îl adăugăm în cont.
    postmark_analytics: |-
      Statisticile e-mailurilor Postmark, pe un ecran TRMNL ePaper. Lipește un Server API Token din serverul Postmark și alege perioada: 7, 30 sau 90 de zile.

      Valorile principale sunt mesajele trimise și rata de deschidere. Dedesubt apar deschiderile unice, clicurile, respingerile, erorile, reclamațiile de spam și rata de respingere. Util pe biroul unei echipe de operațiuni sau asistență, pentru a observa creșterea respingerilor ori a reclamațiilor înainte ca un client să întrebe de ce nu a primit resetarea parolei.
    private_plugin: |-
      Creează propriul ecran pentru un dispozitiv TRMNL ePaper. Scrie-l în HTML cu șabloane Liquid și frameworkul de design TRMNL, apoi alege sursa datelor: TRMNL interoghează un URL care returnează JSON, XML sau text simplu, codul tău trimite date la un webhook, introduci JSON static sau reutilizezi datele altor pluginuri TRMNL.

      Interogarea permite GET sau POST, antete personalizate, corp de cerere și OAuth pentru servicii care necesită autentificare. Adaugă câmpuri de formular pentru ca alții să configureze pluginul fără să modifice codul, transformă datele cu un script Node, PHP, Python sau Ruby și, când este gata, partajează-l ca rețetă.
    product_hunt: |-
      Lansările promovate de Product Hunt, pe un ecran TRMNL ePaper. Fiecare afișează numele, o descriere scurtă și numărul de voturi, într-o listă numerotată.

      Nu trebuie să conectezi nimic și nu ai nevoie de cont. Adaugă pluginul, iar lista se actualizează singură. Construiești ceva? Urmărește lansările și voturile necesare pentru a ieși în evidență fără să deschizi altă filă. Ocupă tot ecranul, jumătate sau un sfert lângă alte pluginuri.
    profit_well: |-
      Veniturile ProfitWell, pe un ecran TRMNL ePaper. Lipește tokenul API ProfitWell, iar ecranul afișează valorile de astăzi din cont.

      Sus: venitul recurent nou și venitul recurent total. Dedesubt: venitul pierdut, clienții activi, clienții noi și cei pierduți. Ai o afacere SaaS? Pune-l unde îl vezi în fiecare dimineață, ca o zi cu multe pierderi de clienți să nu rămână ascunsă într-un panou uitat.
    proton_calendar: |-
      Calendarul Proton, pe un ecran TRMNL ePaper. Ai două opțiuni: partajezi calendarul Proton ca link și lipești adresa .ics în plugin sau sincronizezi de pe iPhone ori iPad cu aplicația TRMNL Companion. Te preocupă confidențialitatea? Proton permite un link care arată doar când ești ocupat, fără detaliile evenimentelor.

      Alege apoi o aranjare: agenda de astăzi, următoarele zile, o săptămână, o săptămână mobilă, săptămâna de lucru sau una de 3 zile, o grilă lunară ori un program minimal. Afișează orele și descrierile, folosește formatul de 12 sau 24 de ore, ascunde evenimentele cu anumite cuvinte și începe săptămâna în orice zi. Vederile săptămânale și lunare pot umbri weekendurile, evidenția ziua curentă și afișa numerele săptămânilor.
    purpleair: |-
      Măsurătorile unui senzor PurpleAir, pe un ecran TRMNL ePaper. Folosește propriul senzor sau unul public de pe harta PurpleAir. Introdu ID-ul senzorului și o cheie API PurpleAir, plus o cheie de citire dacă senzorul este privat.

      Alege ce afișezi. Calitatea aerului arată valorile curente PM2.5 și PM10, cu un grafic pe 24 de ore raportat la nivelurile EPA, de la Bun la Foarte nesănătos. Temperatură și umiditate afișează în schimb aceste două valori, în Fahrenheit sau Celsius. Cerem PurpleAir doar ce s-a schimbat de la ultima reîmprospătare, deci creditele API gratuite durează mai mult.
    readwise: |-
      Pasajele evidențiate în Readwise, pe un ecran TRMNL ePaper. Obține un token de acces Readwise, lipește-l în plugin și ai terminat.

      Fiecare reîmprospătare afișează un pasaj din recapitularea zilnică Readwise, cu titlul cărții sau articolului și autorul. Următoarea reîmprospătare trece la următorul pasaj. Este o modalitate discretă de a reciti ce ai salvat, în loc să lași pasajele să se adune într-o aplicație pe care nu o deschizi.
    reddit: |-
      Postările populare din subreddit-urile preferate, pe un ecran TRMNL ePaper. Conectează contul Reddit, apoi indică până la 3 subreddit-uri. Fiecare are propria coloană.

      Sortează după Hot, New sau Top și alege intervalul, de la ultima oră la toate timpurile. Postările fixate sunt omise, deoarece se schimbă rar. Afișează sau ascunde numărul de voturi și numele autorului sub fiecare titlu. Scurtează titlurile lungi la un rând pentru a încăpea mai multe postări.
    redirect: |-
      Un instrument pentru dezvoltatorii care își generează propriile imagini. Când ecranul TRMNL ePaper se conectează, apelăm un URL de pe serverul tău și trimitem răspunsul direct dispozitivului: adresa imaginii, numele fișierului și durata repausului până la următoarea conectare.

      Serverul tău decide astfel ce se afișează și când, la fiecare conectare. Adresa imaginii poate varia la fiecare cerere și poate fi chiar în rețeaua locală. Trimite același nume de fișier de două ori, iar ecranul nu se redesenează, reducând pâlpâirea și consumul bateriei. Tu alegi durata repausului, până la un minim de 1 minut. Folosești Alias și vrei mai mult control? Acesta este următorul pas.
    rss_feed: |-
      Orice flux RSS sau Atom, pe un ecran TRMNL ePaper. Lipește adresa fluxului și alege aranjarea.

      Articol principal afișează cea mai nouă postare, cu titlul, textul și imaginile. Listă afișează până la 8 postări recente, fiecare cu titlu și rezumat scurt în text simplu. Urmărești un blog, un site de știri, un podcast sau un forum care are flux? Pune-l pe perete. Găzduiești fluxul pe un server de acasă cu certificat autosemnat? Permite totuși preluarea de către TRMNL.
    screen_wiper: |-
      Elimină urmele imaginilor vechi de pe ecranul TRMNL ePaper. Aceste urme palide se pot acumula în timp pe ePaper. Când dispozitivul ajunge la Screen Wiper în lista de redare, execută cicluri speciale care alternează ecranul între negru și alb, apoi trece la următorul element.

      Adaugă pluginul și salvează. Atât. În funcție de dispozitiv, curățarea produce pâlpâiri timp de 30–60 de secunde sau până la 5 minute. Programeaz-o o dată pe zi ori pe săptămână, ideal imediat după ieșirea dispozitivului din repaus. Necesită firmware 1.8.14 sau mai nou.
    screensaver: |-
      Artă pentru ecranul TRMNL ePaper. Fiecare reîmprospătare alege aleatoriu o imagine din mica noastră colecție: Mona Lisa, Roma, misiunile Apollo sau o stație spațială, toate pregătite pentru un aspect clar pe ePaper.

      Nu trebuie să configurezi nimic. Adaugă-l în lista de redare când vrei un ecran plăcut, precum între întâlniri sau peste noapte. Colecția este mică, dar crește, și acceptăm contribuții. Ai o imagine pe care ai vrea să o vezi aici? Scrie la support@trmnl.com.
    screenshot: |-
      Orice pagină web publică, pe un ecran TRMNL ePaper. Lipește adresa și preluăm pagina ca imagine. Poate fi o pagină cu scoruri sportive, un panou de stare sau meniul de prânz al copilului.

      Pagina cere un token de autentificare? Adaugă antete HTTP. Corectăm linkurile relative către stiluri, scripturi și imagini, astfel încât pagina să arate ca în browser (poți dezactiva această opțiune). Dacă HTML-ul nu s-a schimbat, omitem redesenarea. Pentru panouri care încarcă datele prin JavaScript, activează reîmprospătarea permanentă pentru o captură nouă de fiecare dată. Sfat: setează mai întâi browserul la 800x480 pentru a vedea ce vede TRMNL.
    shopify: |-
      Vânzările Shopify, pe un ecran TRMNL ePaper. Creează în administrarea Shopify o aplicație personalizată cu acces doar pentru citirea comenzilor, apoi lipește tokenul de acces și adresa magazinului în plugin. Articolul nostru de ajutor explică pașii.

      Alege perioada: ultimele 7 zile, ultimele 30 de zile sau luna curentă până astăzi. Ecranul afișează vânzările totale și comparația cu perioada precedentă, comenzile în așteptare și onorate, valoarea medie a comenzilor și un grafic comparativ al vânzărilor zilnice. Sumele folosesc moneda magazinului. TRMNL citește doar comenzile, nimic altceva din magazin.
    shopping_list: |-
      Lista de cumpărături, pe un ecran TRMNL ePaper. Introdu produsele în plugin, câte unul pe linie, iar acestea apar într-o listă numerotată.

      Pune ecranul pe frigider sau lângă ușă și îți vei aminti de pasta de dinți când iei cheile. Adaugă sau elimină produse oricând din panoul TRMNL, iar lista de pe ecran se actualizează. Stocăm lista criptat.
    simple_analytics: |-
      Statisticile Simple Analytics, pe un ecran TRMNL ePaper. Sus apar vizualizările de pagină, vizitatorii și minutele petrecute pe pagină, cu un grafic al vizualizărilor zilnice dedesubt.

      Creează o cheie API în setările contului Simple Analytics, lipește-o și adaugă domeniul site-ului (fără „http”). Alege apoi 1, 7, 14 sau 30 de zile. Vrei ca graficul să se încheie ieri? Setează și asta, ca o zi neterminată să nu pară o prăbușire a traficului.
    square_pos: |-
      Vânzările Square, pe un ecran TRMNL ePaper. Conectează contul Square și alege până la 3 locații. Fiecare are propria coloană, cu totalul plăților sus și o listă numerotată a plăților finalizate dedesubt, cu suma și metoda de plată.

      Alege perioada: astăzi, ultimele 24 de ore sau ultimele 7 zile. Ai mai multe magazine? Vezi-le alăturat pe un singur ecran.
    statuspage: |-
      Paginile de stare ale serviciilor de care depinzi, pe un ecran TRMNL ePaper. Lipește adresele paginilor, câte una pe linie, iar noi găsim fluxul RSS sau Atom al fiecăreia. Funcționează cu Statuspage, AWS, Slack, Google Cloud și majoritatea celorlalte servicii.

      Ecranul are două liste. Incidente afișează cel mai recent incident al fiecărui serviciu și timpul trecut, cu o pictogramă pentru incidentele din ultimele 24 de ore. Programate afișează mentenanța viitoare și data ei. Dacă o pagină nu poate fi accesată sau nu are flux, acest lucru apare pe ecran.
    stock_price: |-
      Prețuri de acțiuni, metale și valute, pe un ecran TRMNL ePaper. Introdu până la 12 simboluri bursiere; fiecare afișează prețul, numele și variația zilnică, procentuală sau în puncte. Aranjarea se adaptează la numărul adăugat.

      Simbolurile americane funcționează direct. Adaugă bursa pentru Canada, Germania, Londra sau India (precum SHOP.TSE ori INFY.NSE), folosește sufixul .FX pentru perechi valutare (EURUSD.FX) sau urmărește aur, argint, platină, paladiu și cupru (XAUUSD pentru aur). Indicii bursieri nu sunt acceptați; folosește un ETF precum SPY pentru S&P 500 (introdu SPX și îl vom sugera). Ai nevoie de mai mult de 12? Adaugă pluginul de două ori și combină-le într-o compoziție.
    tempest_weather_station: |-
      Măsurătorile propriei stații meteo Tempest, pe un ecran TRMNL ePaper. Conectează-te la contul Tempest pentru a acorda TRMNL acces doar pentru citire, apoi alege stația.

      Ecranul complet afișează temperatura curentă și cea resimțită, condițiile meteo, umiditatea, vântul, precipitațiile, UV, răsăritul și apusul, plus minimele și maximele de astăzi și mâine. Alege Fahrenheit ori Celsius, unități pentru vânt precum mph, km/h, noduri sau Beaufort și precipitații în inci, centimetri ori milimetri. Ai mai multe stații? Adaugă pluginul pentru fiecare și combină-le într-o compoziție.
    the_office: |-
      Un citat aleatoriu din The Office, pe un ecran TRMNL ePaper, lângă un desen al personajului care l-a spus. Michael, Dwight, Jim și ceilalți de la Dunder Mifflin îți fac pe rând ziua de lucru mai ușoară.

      Nu trebuie să configurezi nimic. Adaugă pluginul, dă-i un nume dacă vrei și salvează. Citatele provin din Office API al lui Akash Rajpurohit.
    ticktick: |-
      Sarcinile TickTick, pe un ecran TRMNL ePaper. Conectează contul TickTick, apoi alege lista sau Inbox. Sarcinile apar cu scadențele, cele mai apropiate primele, iar subsarcinile apar indentate sub sarcina principală.

      Alege alinierea listei sus, la centru sau jos. TickTick partajează cu alte aplicații doar listele de sarcini, deci calendarul, obiceiurile, Pomodoro și Matricea Eisenhower rămân în TickTick.
    todo_list: |-
      O listă simplă de sarcini, pe un ecran TRMNL ePaper. Nu trebuie să conectezi un cont. Introdu lucrurile la care lucrezi în „În lucru”, câte unul pe linie, și adaugă-le pe cele terminate în „Finalizate”, dacă dorești.

      Revino și mută elementele din „În lucru” în „Finalizate” pe măsură ce avansezi. Ecranul păstrează ambele liste: ce a rămas și ce ai făcut deja. Fiecare element permite Markdown pentru text îngroșat, cursiv și altele; îl poți dezactiva pentru text simplu. Ambele liste sunt stocate criptat.
    todoist: |-
      Sarcinile Todoist, pe un ecran TRMNL ePaper. Conectează contul Todoist, alege un proiect sau vederea Astăzi ori În curând, iar ecranul listează sarcinile și scadențele.

      Grupează sarcinile după dată, termen-limită, prioritate sau etichetă și sortează după nume, dată, termen-limită, prioritate ori ordinea manuală. Filtrează după scadență sau termen-limită (de astăzi până în următoarele 30 de zile), prioritate, etichetă ori persoana responsabilă. Cunoști interogările de filtrare Todoist? Activează modul de interogare personalizată și scrie propria interogare.
    unsplash: |-
      O fotografie aleatorie din Unsplash, pe un ecran TRMNL ePaper. Introdu un termen de căutare precum „space” sau „moon”, iar fiecare reîmprospătare preia o fotografie peisaj nouă, adaptată prin dithering pentru ePaper și afișată pe tot ecranul.

      Aceasta este singura setare. Alege o temă care îți place sau adaugă pluginul de mai multe ori cu căutări diferite și lasă lista de redare să le alterneze.
    upcoming_movies: |-
      Un film de așteptat cu interes, pe un ecran TRMNL ePaper. Fiecare reîmprospătare alege un film și afișează titlul, afișul, data lansării și un scurt rezumat. Datele provin din The Movie Database (TMDB).

      Alege țara pentru a vedea lansările din apropiere. Apoi selectează În curând pentru filmele lansate astăzi sau ulterior ori În cinematografe pentru cele deja lansate. Te ajută să hotărăști ce vedeți în weekend înainte să înceapă discuția.
    weather: |-
      Află cum este vremea înainte să ieși, fără stație meteo. Caută un oraș sau un cod poștal ori introdu coordonatele, iar ecranul TRMNL ePaper afișează temperatura și condițiile curente, temperatura resimțită, umiditatea și minimele, maximele și UV de astăzi și mâine.

      Tu alegi furnizorul de date. Tempest folosește cea mai apropiată stație sau una aleasă pe harta Tempest și adaugă vântul, precipitațiile, răsăritul și apusul pe ecranul complet. WeatherAPI este alternativa pentru locuri fără stație apropiată. Setează Fahrenheit ori Celsius, alege unitățile pentru vânt și precipitații și etichetează prognozele „astăzi” și „mâine” sau cu datele reale.
    webhook_image: |-
      Trimite propriile imagini direct pe un ecran TRMNL ePaper. Adaugă pluginul și primești un URL webhook privat. Trimite prin POST un PNG, JPEG sau WebP dintr-un script, o sarcină cron sau Home Assistant, iar imaginea apare pe ecran. Tratează URL-ul ca pe o parolă: oricine îl are poate modifica ecranul.

      TRMNL nu prelucrează imaginea, deci dimensioneaz-o mai întâi pentru dispozitiv. Încărcările sunt verificate în raport cu dimensiunea și adâncimea de culoare a dispozitivului ori ale unui model ales; poți omite verificarea dacă știi că dispozitivul acceptă imaginea. Într-o compoziție, umple spațiul sau afișează imaginea completă cu o culoare de fundal în jur. Ai până la 12 încărcări pe oră.
    wiki_random_article: |-
      Articolul zilei de pe Wikipedia, pe un ecran TRMNL ePaper. Primești titlul și un rezumat scurt, unul nou în fiecare zi. Într-o zi poate fi o bătălie, în alta un gândac.

      Nu trebuie să configurezi nimic. Adaugă-l în lista de redare și află ceva interesant cât se prepară cafeaua. Articolele provin din fluxul zilnic al Wikipedia în engleză, deci toți văd același articol.
    withings: |-
      Datele de sănătate Withings, pe un ecran TRMNL ePaper. Conectează-te cu Withings pentru a acorda TRMNL acces doar pentru citire, apoi alege modul potrivit dispozitivului. Greutate, pentru cântare, afișează greutatea curentă, procentele de grăsime și masă musculară și variația pe perioada aleasă, cu un grafic. Somn, pentru Sleep Analyzer, afișează scorul, orele dormite și eficiența, cu un grafic al somnului profund, REM și ușor în fiecare noapte. Activitate, pentru dispozitive purtabile, afișează pașii de astăzi față de obiectiv, cu un grafic al pașilor și somnului.

      Alege 7, 30 sau 90 de zile și afișează greutatea în livre, kilograme sau stone. Măsurătorile introduse manual sunt excluse.
    workflowy: |-
      Lista Workflowy, pe un ecran TRMNL ePaper. Fiecare element apare cu nota dedesubt, în ordinea păstrată în Workflowy.

      Lipește tokenul API Workflowy pentru a te conecta. Implicit vezi lista principală. Vrei un singur proiect? Adaugă ID-ul elementului, iar pluginul îl tratează ca nivel superior. Afișează până la 25 de elemente și alege dacă apar și cele finalizate (cu bifă și text tăiat).
    youtube_analytics: |-
      Statisticile canalului YouTube, pe un ecran TRMNL ePaper. Vizualizările și orele urmărite apar primele, apoi durata medie de vizionare, abonații câștigați, rata de vizionare, aprecierile, comentariile și distribuirile.

      Conectează-te cu contul Google care deține canalul (administratorii unui canal partajat nu îl pot conecta), apoi alege 7, 28, 90 sau 365 de zile. Ai mai multe canale? Adaugă pluginul pentru fiecare și denumește-le pentru a le deosebi.
    linkedin_page: |-
      Your LinkedIn Company Page stats, on a TRMNL ePaper display. See followers, new followers, impressions, clicks, engagement rate, reactions, comments and shares, with a daily chart of the metric you choose.

      Connect the LinkedIn account that is an admin of your Page, pick the Page, then choose a lookback of 7, 30 or 90 days. LinkedIn reports these numbers with a 2 day delay, so the screen ends 2 days ago. Run more than 1 Page? Add the plugin once per Page.
