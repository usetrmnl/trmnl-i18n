        bottom_line_title: Choose by the door, not the device.
        bottom_line_description: Booking runs on every screen on this page, so the choice comes down to what each door needs.
        bottom_line:
          tablet_title: Choose an iPad or Android tablet if
          tablet_body: The larger color screen or richer interaction is worth the power, mounting and device management it needs.
          epaper_title: Choose ePaper if
          epaper_body: You want to show room availability reliably, with little wiring, upkeep or deployment work.
          own_tablets_title: Already own tablets?
          own_tablets_body: 'Use them with Booking: open the room''s URL in the browser. Add ePaper displays at doors with no outlet.'
        try_booking_description: Create a free virtual device, connect one calendar and test the room display before you buy hardware. Every plan starts with a %{trial_days}-day free trial.
        disclaimer_sources: We sell TRMNL. Tablet facts and US list prices on this page come from Apple's and Samsung's public sites, checked on %{date}.
        disclaimer_estimates: Enclosure prices are Compulocks list prices. Installation costs are estimates, and vary by building and region.
        disclaimer_trademarks: iPad is a trademark of Apple Inc. Galaxy Tab is a trademark of Samsung. Android is a trademark of Google LLC.
        disclaimer_affiliation: TRMNL is not affiliated with Apple, Samsung or Google.
        og_description: 'Compare iPads and Android tablets with TRMNL ePaper for meeting room displays: power, mounting, device management and total cost. TRMNL Booking runs on all three.'
        faq:
          existing_tablets:
            question: Can I use the tablets I already have?
            answer: Yes. Open any room or collection at its own private URL in the tablet's browser. It needs no login or app, and refreshes itself. To keep the page on screen, use Guided Access on an iPad or app pinning on Android.
          battery:
            question: How long does the battery last on a TRMNL display?
            answer: 3 to 6 months per charge at typical refresh rates. Faster refresh uses more battery, so a display next to a busy room can stay plugged in over USB-C.
          screen_updates:
            question: How quickly does a new booking show on the screen?
            answer: In a browser, within a minute. On ePaper, we redraw each room every five minutes, and the device shows it at its own refresh rate.
          booking_at_display:
            question: Can people book a room at the display?
            answer: Anyone who scans the QR code on the screen can book from their phone, with no TRMNL account or app. It works the same on ePaper and on tablets. The booking goes straight into your calendar.
          mdm:
            question: Do TRMNL displays need MDM?
            answer: No. A TRMNL runs only TRMNL firmware. It pulls its screen from our server and cannot be accessed remotely. You manage it from the TRMNL dashboard.
          several_screens:
            question: Does a room cost more on several screens?
            answer: No. Booking is $%{price} a month, or $%{annual_price} a year, for each bookable resource. A room on an ePaper display and on a tablet counts once.
