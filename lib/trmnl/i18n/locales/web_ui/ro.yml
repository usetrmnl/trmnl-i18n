        trade_in_description: Your room calendars stay in Google or Microsoft, so there is no data to move. Run Booking next to Robin, and we’ll cover the rest of your contract.
        disclaimer_sources: We sell TRMNL. Robin facts on this page come from Robin's public site, checked on %{date}.
        disclaimer_trademark: Robin is a trademark of its owner. TRMNL is not affiliated with Robin.
        og_description: 'Compare Robin''s workplace platform with TRMNL Booking: live room schedules and QR walk-up booking for teams of any size, on TRMNL ePaper or a screen you already own.'
        faq:
          public_price:
            question: Do I need to talk to sales to get a price?
            answer: No. Booking is $%{price} a month, or $%{annual_price} a year, for each bookable resource shown on a screen. Sign up online and start with a %{trial_days}-day free trial.
          monthly:
            question: Can I pay month to month?
            answer: Yes. Pay monthly or yearly, with no contract. A room on several displays is billed once.
          team_size:
            question: Is Booking only for large companies?
            answer: No. There is no minimum team size. Start with one room, and add more when you need them.
          displays:
            question: Do I have to buy displays separately?
            answer: No. Open any room or collection at its own private URL in a browser, on a tablet, TV or LCD screen. TRMNL ePaper is optional, and a one-time purchase if you want it.
          switch:
            question: Can I switch from Robin without moving data?
            answer: Yes. Booking reads the same Google or Microsoft room calendars, so your bookings stay where they are. You can run both until your Robin contract ends.
          calendars:
            question: Which calendars work?
            answer: Google (personal accounts and Workspace), Microsoft (Outlook, Exchange Online rooms and Microsoft Places workspaces) and any iCal feed.
          visitor_booking:
            question: Can visitors book a room?
            answer: Anyone who scans the QR code on the display can book from their phone, with no TRMNL account or app. The booking goes straight into your calendar.
